  adminKnowSubj:function(v){ S.adminKnowSubj=v||null; render(); },
  adminTab:function(k){ S.adminTab=k; renderOverlays(); var sb=document.querySelector('#overlays .sheetbody'); if(sb) sb.scrollTop=0; },
  addVocab:function(){
    if(!S.adminKnowSubj){ toast("เลือกวิชาก่อน"); return; }
    var term=((document.getElementById("kvTerm")||{}).value||"").trim(), def=((document.getElementById("kvDef")||{}).value||"").trim();
    if(!term){ toast("ใส่คำศัพท์ก่อน"); return; }
    var k=Object.assign({},S.knowledge), arr=(k[S.adminKnowSubj]||[]).slice(); arr.push({type:"vocab",term:term,def:def,ts:Date.now()}); k[S.adminKnowSubj]=arr;
    set({knowledge:k, knowledgeDirty:true}); toast("เพิ่มคำศัพท์แล้ว");
  },
  addPdf:function(){
    if(!S.adminKnowSubj){ toast("เลือกวิชาก่อน"); return; }
    var url=((document.getElementById("kpUrl")||{}).value||"").trim(), title=((document.getElementById("kpTitle")||{}).value||"").trim();
    if(!/^https?:\/\//.test(url)){ toast("ใส่ลิงก์ PDF (ขึ้นต้น http)"); return; }
    var k=Object.assign({},S.knowledge), arr=(k[S.adminKnowSubj]||[]).slice(); arr.push({type:"pdf",url:url,title:title||"เอกสาร PDF",ts:Date.now()}); k[S.adminKnowSubj]=arr;
    set({knowledge:k, knowledgeDirty:true}); toast("เพิ่ม PDF แล้ว");
  },
  addKnowImg:function(input){
    var subj=S.adminKnowSubj; if(!subj){ toast("เลือกวิชาก่อน"); input.value=""; return; }
    var file=input.files&&input.files[0]; if(!file) return;
    if(!/^image\//.test(file.type)){ toast("ต้องเป็นไฟล์ภาพ"); input.value=""; return; }
    var cap=((document.getElementById("kImgCap")||{}).value||"").trim();
    var rd=new FileReader();
    rd.onload=function(){ var img=new Image(); img.onload=function(){
        var mx=1000, w=img.width, hh=img.height;
        if(w>mx||hh>mx){ if(w>=hh){ hh=Math.round(hh*mx/w); w=mx; } else { w=Math.round(w*mx/hh); hh=mx; } }
        var cv=document.createElement("canvas"); cv.width=w; cv.height=hh; cv.getContext("2d").drawImage(img,0,0,w,hh);
        var data=cv.toDataURL("image/jpeg",0.72);
        var k=Object.assign({},S.knowledge), arr=(k[subj]||[]).slice(); arr.push({type:"image",data:data,cap:cap,ts:Date.now()}); k[subj]=arr;
        set({knowledge:k, knowledgeDirty:true}); toast("เพิ่มภาพแล้ว ("+Math.round(data.length/1024)+" KB)");
      }; img.onerror=function(){ toast("เปิดภาพไม่ได้"); }; img.src=rd.result; };
    rd.onerror=function(){ toast("อ่านไฟล์ไม่ได้"); };
    rd.readAsDataURL(file); input.value="";
  },
  delKnow:function(subj,idx){ var k=Object.assign({},S.knowledge), arr=(k[subj]||[]).slice(); arr.splice(idx,1); if(arr.length) k[subj]=arr; else delete k[subj]; set({knowledge:k, knowledgeDirty:true}); },
  playVideo:function(id){
    var e=videoIndex()[id]; if(!e) return;
    // ถ้ากดคลิปเดิมที่กำลังเล่นอยู่ ไม่ต้องทำอะไร (แค่เลื่อนขึ้นให้เห็นจอ)
    if(S.player && S.player.id===id && _yt.player){ var vv=document.getElementById("view"); if(vv) vv.scrollTop=0; return; }
    // มีเครื่องเล่นอยู่แล้ว → สลับคลิปในเครื่องเดิม (ไม่สร้าง iframe ใหม่ = วิดีโอไม่หยุดบนมือถือ)
    var mnt=document.getElementById("ytmount");
    if(_yt.player && _yt.player.loadVideoById && S.player && S.tab==="study" && !S.quiz && !S.adminOpen && !S.mock && mnt && mnt.tagName==="IFRAME"){
      switchClip(id); return;
    }
    // ครั้งแรก / ไม่มีเครื่องเล่น → สร้างใหม่
    destroyPlayer();
    S.player={ id:id, title:e.v.title, yt:e.v.yt||ytId(e.v.url), sk:e.sk, tid:e.tid, desc:e.v.desc||"", dur:e.v.dur||"" };
    saveProg(id,{});
    render();
    var v=document.getElementById("view"); if(v) v.scrollTop=0;
  },
  closeVideo:function(){ destroyPlayer(); S.player=null; render(); var v=document.getElementById("view"); if(v) v.scrollTop=0; },
  nextLesson:function(){
    var p=S.player; if(!p) return;
    var vs=studyVids(p.tid), i=vs.map(function(v){return v.id;}).indexOf(p.id);
    if(i>=0 && i<vs.length-1) A.playVideo(vs[i+1].id);
    else toast("นี่คือคลิปสุดท้ายในหัวข้อนี้แล้ว");
  },
  toggleSaved:function(id){
    var sv=Object.assign({},S.saved||{});
    if(sv[id]) delete sv[id]; else sv[id]=true;
    S.saved=sv; save();     // ไม่ render เพื่อไม่ให้วิดีโอรีโหลด — อัปเดตปุ่มตรง ๆ
    var on=!!S.saved[id], btn=document.getElementById("savebtn");
    if(btn){ btn.textContent=on?"✓ บันทึกแล้ว":"บันทึกไว้"; btn.style.color=on?"var(--pri)":""; btn.style.borderColor=on?"var(--pri)":""; }
  },
  // ── ปุ่มควบคุมจอวิดีโอของเราเอง (จอถูกล็อก controls ของ YouTube) ──
  ytToggle:function(){
    if(!_yt.player || !_yt.player.getPlayerState) return;
    if(_yt.player.getPlayerState()===1) _yt.player.pauseVideo(); else _yt.player.playVideo();
    setTimeout(setYtUI,80);
  },
  ytSeek:function(sec){
    if(!_yt.player || !_yt.player.getCurrentTime) return;
    var t=(_yt.player.getCurrentTime()||0)+sec; if(t<0) t=0;
    _yt.player.seekTo(t,true); pollProg();
  },
  ytFull:function(){
    var st=document.getElementById("ytstage"); if(!st) return;
    var fsEl=document.fullscreenElement||document.webkitFullscreenElement;
    if(fsEl){ (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); return; }
    if(st.classList.contains("ytfs")){ st.classList.remove("ytfs"); document.body.style.overflow=""; return; }  // ออกจากโหมดสำรอง (iOS)
    if(st.requestFullscreen){ st.requestFullscreen().catch(function(){ st.classList.add("ytfs"); document.body.style.overflow="hidden"; }); }
    else if(st.webkitRequestFullscreen){ st.webkitRequestFullscreen(); }
    else { st.classList.add("ytfs"); document.body.style.overflow="hidden"; }
  },

  planDraftSub:function(v){ if(!S.planDraft) S.planDraft={}; S.planDraft.sub=v||null; },

  // ── เตือนผ่านปฏิทินมือถือ (ไฟล์ .ics) ──
  remind:function(d,idx){
    var t=(S.plan[d]||[])[idx]; if(!t) return;
    var time=t.time||"08:00", ds=d.replace(/-/g,"");
    var startL=ds+"T"+time.replace(":","")+"00", endL=ds+"T"+addTime(time,30).replace(":","")+"00";
    var stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
    var e=function(s){ return String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n"); };
    var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//nst18//TH","CALSCALE:GREGORIAN","BEGIN:VEVENT",
      "UID:"+Date.now()+"-"+idx+"@nst18","DTSTAMP:"+stamp,"DTSTART:"+startL,"DTEND:"+endL,
      "SUMMARY:"+e("แผน นสต.18 · "+t.label),"DESCRIPTION:"+e("แผนเตรียมสอบ นสต.18"),
      "BEGIN:VALARM","TRIGGER:-PT10M","ACTION:DISPLAY","DESCRIPTION:"+e(t.label),"END:VALARM",
      "END:VEVENT","END:VCALENDAR"].join("\r\n");
    try{
      var blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
      var url=URL.createObjectURL(blob), a=document.createElement("a");

function loadQuiz(sk,id,label,subjName){
  var bank=validQs((S.bank||{})[id]);

  if(window.claude && window.claude.complete){ aiQuiz(sk,id,label,subjName); return; }

/* ── กันจอดับระหว่างทำข้อสอบ (Wake Lock) ──
   ขอให้ระบบ "ไม่ดับจอเอง" ตลอดที่ทำข้อสอบ นักเรียนนั่งคิดนานแค่ไหนจอก็ไม่ดับ
   (Android + iOS 16.4 ขึ้นไปรองรับ · เครื่องที่ไม่รองรับก็ไม่ error แค่ทำงานเหมือนเดิม) */
var _wakeLock=null;
function requestWakeLock(){
  try{
    if("wakeLock" in navigator && navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request("screen").then(function(wl){ _wakeLock=wl; }).catch(function(){});
    }
  }catch(e){}
}
function releaseWakeLock(){
  try{ if(_wakeLock){ _wakeLock.release(); _wakeLock=null; } }catch(e){}
}
function startQuiz(id,qs){
  if(!S.quiz || S.quiz.topicId!==id) return;
  S.quiz.status="active"; S.quiz.questions=qs; S.quiz.idx=0;
  S.quiz.picked=qs.map(function(){ return null; });   // ยาวเท่าจำนวนข้อ, null=ยังไม่ตอบ (ข้ามไปทำข้ออื่น/แก้ไขได้)
  S.quiz.correct=0; S.quiz._confirm=false;
  S.quiz.totalMs = qs.length * SEC_PER_Q * 1000;   // ข้อละ 1.2 นาที ตามจำนวนข้อ
  S.quiz.deadline = Date.now() + S.quiz.totalMs;
  S.quiz.timeUp = false;
  requestWakeLock();   // กันจอดับตลอดที่ทำข้อสอบ
  render();
  startQuizTimer();
}

/* ── จับเวลาทำข้อสอบ: ให้เวลา "ข้อละ 1.2 นาที" ตามจำนวนข้อ แสดงนับถอยหลังขณะทำ ──
   หมดเวลา = ส่งคำตอบให้อัตโนมัติ ข้อที่ยังไม่ตอบนับเป็นผิด */
var SEC_PER_Q = 72;                 // 1.2 นาที = 72 วินาที/ข้อ
var quizTimerId = 0;
function quizRemainMs(){
  var q=S.quiz;
  if(!q || !q.deadline) return 0;
  var r=q.deadline-Date.now();
  return r>0?r:0;
}
function fmtClock(ms){
  var s=Math.ceil(ms/1000);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function clearQuizTimer(){ if(quizTimerId){ clearInterval(quizTimerId); quizTimerId=0; } }
function startQuizTimer(){
  clearQuizTimer();
  quizTimerId=setInterval(function(){
    var q=S.quiz;
    if(!q || q.status!=="active"){ clearQuizTimer(); return; }
    var rem=quizRemainMs();
    if(rem<=0){ timeUpQuiz(); return; }
    var el=document.getElementById("quizClock");
    if(el){
      el.textContent=fmtClock(rem);
      var bar=document.getElementById("quizTimerBar");
      if(bar && rem<=60000) bar.classList.add("tmup");   // เหลือ 1 นาทีสุดท้าย ให้กล่องกะพริบเตือน
    }
  },500);
}
function gradeQuiz(){                       // นับข้อถูกจากคำตอบที่เลือกไว้ (ข้อที่ไม่ตอบ = ผิด)
  var q=S.quiz, c=0;
  for(var i=0;i<q.questions.length;i++){ if(q.picked[i]===q.questions[i].answer) c++; }
  q.correct=c;
  q.pct=q.questions.length?Math.round(c/q.questions.length*100):0;
  if(q.isMock && q.mockSections){
    // ★ ข้อสอบเสมือนจริงแบบแบ่งภาค: คิดคะแนนแยกแต่ละภาค ต้องผ่านครบทุกภาค (ไม่ตัดจากคะแนนรวม)
    var secs=q.mockSections.map(function(s){
      return { name:s.name, pass:s.pass, total:0, got:0,
               parts:(s.parts||[]).map(function(p){ return { label:p.label, total:0, got:0 }; }) };
    });
    for(var j=0;j<q.questions.length;j++){
      var si=q.questions[j]._sect||0, sec=secs[si]; if(!sec) continue;
      var ok=q.picked[j]===q.questions[j].answer;
      sec.total++; if(ok) sec.got++;
      var lbl=q.questions[j]._subj;
      for(var k=0;k<sec.parts.length;k++){ if(sec.parts[k].label===lbl){ sec.parts[k].total++; if(ok) sec.parts[k].got++; break; } }
    }
    secs.forEach(function(s){ s.ok = s.got>=s.pass; });
    q.sectResult=secs;
    q.passed = secs.length>0 && secs.every(function(s){ return s.ok; });
  } else {
    q.passed=topicPass(q.topicId, q.correct, q.questions.length);
  }
}
function finishQuiz(timeUp){
  clearQuizTimer();
  releaseWakeLock();   // ทำข้อสอบจบแล้ว ปล่อยให้จอดับได้ตามปกติ
  S.quizConfirm=false;   // ปิดหน้ายืนยัน (เผื่อค้าง)
  var q=S.quiz;
  if(!q || q.status!=="active") return;
  gradeQuiz();
  q.timeUp=!!timeUp;
  q.status="result";
  if(q.isMock){ saveMockAttempt(q); render(); return; }   // เสมือนจริง — บันทึกประวัติ ไม่ทับคะแนนรายหัวข้อ
  if(q.isReview){ render(); return; }   // ทบทวนข้อผิด — ไม่บันทึกทับคะแนน
  var sc=Object.assign({},S.scores); sc[q.topicId]=q.pct;
  var kn=Object.assign({},S.know); if(q.passed) kn[q.topicId]=true;
  set({scores:sc, know:kn});
}
function timeUpQuiz(){ finishQuiz(true); }   // หมดเวลา = ส่งอัตโนมัติ
function aiQuiz(sk,id,label,subjName){
  var prompt="คุณเป็นผู้ออกข้อสอบและติวเตอร์นายสิบตำรวจ (สายปราบปราม) ระดับสนามสอบจริง\n"+
    "สร้างคลังข้อสอบปรนัย 30-50 ข้อ หัวข้อ: \""+subjName+" — "+label+"\" ครอบคลุมหลายแง่มุมและห้ามซ้ำกัน\n"+
    "ตอบกลับเป็น JSON เท่านั้น ห้ามมีข้อความอื่น รูปแบบ:\n"+
    "{\"questions\":[{\"q\":\"โจทย์\",\"choices\":[\"ตัวเลือกที่1\",\"ตัวเลือกที่2\",\"ตัวเลือกที่3\",\"ตัวเลือกที่4\"],\"answer\":0,\"explain\":\"เฉลยละเอียด\"}]}\n"+
    "กติกา: แต่ละข้อมี 4 ตัวเลือก, answer เป็นดัชนี 0-3 ของตัวเลือกที่ถูก, ภาษาไทย มีคำตอบถูกเพียงข้อเดียว\n"+
    "สำคัญมาก: ฟิลด์ explain ต้องเป็นเฉลยแบบละเอียดให้มือใหม่เข้าใจง่ายที่สุด อธิบายเป็นขั้นตอน (ขึ้นบรรทัดใหม่ด้วย \\n)";
  window.claude.complete({messages:[{role:"user",content:prompt}], max_tokens:32000})
    .then(function(raw){
      var txt=String(raw).replace(/```json/gi,"").replace(/```/g,"").trim();
      var pool=validQs(JSON.parse(txt).questions);
      if(pool.length<1) throw new Error("empty");
      var p=Object.assign({},S.pool); p[id]=pool;
      S.pool=p; save();
      startQuiz(id, drawQs(pool, topicDraw(id)));
    })
    .catch(function(){ if(S.quiz && S.quiz.topicId===id){ S.quiz.status="error"; render(); } });
}

/* นำคลังข้อสอบที่โหลดมาใส่แอป (ใช้ร่วมกันทั้งโหลดจากแคชและจากเน็ต) */
function applyContent(d){
  if(!d) return;
  // คำสั่งรีเซ็ตจากครู: ถ้า resetToken บนเว็บใหม่กว่าที่เครื่องนี้เคยทำ → ล้างความคืบหน้ากลับค่าเริ่มต้น 1 ครั้ง
  var rt=d.resetToken||0;
  if(rt > (S.resetAppliedToken||0)){
    set({ scores:{}, know:{}, done:{}, progress:{}, resetAppliedToken:rt });
    toast("ครูรีเซ็ตความคืบหน้าใหม่ทั้งหมดแล้ว — เริ่มต้นใหม่ได้เลย");
  }
  var v=d.version||0, newer = v!==(S.contentVersion||0);
  if(S.everAdmin && S.bankDirty){              // เฉพาะเครื่องแอดมินจริงที่มีข้อสอบแก้ค้าง ห้ามทับ (เครื่องนักเรียนไม่โดนแช่แข็ง)
    if(newer) toast("มีเนื้อหาใหม่บนเว็บ — แต่ยังไม่ดึงมา เพราะมีข้อสอบที่ยังไม่ได้ส่งออก");
    return;
  }
  var patch={ contentVersion:v };
  if(d.topics) patch.topics=d.topics;
  if(d.bank) patch.bank=d.bank;
  if(d.physEvents) patch.physEvents=d.physEvents;
  if(d.videos && !S.videosDirty) patch.videos=d.videos;   // ไม่ทับวิดีโอที่แก้ค้างในเครื่อง
  if(d.knowledge && !S.knowledgeDirty) patch.knowledge=d.knowledge;   // คลังความรู้จากเว็บ
  if(d.bankPub) patch.bankPub=d.bankPub;   // เวลาที่เผยแพร่ข้อสอบแต่ละหัวข้อ (สำหรับป้าย "ใหม่")
  patch.subjStatus = d.subjStatus || {};   // สถานะรายวิชา เช่น "อยู่ระหว่างอัปเดต"
  patch.mockTracks = d.mockTracks || {};   // ชุดข้อสอบเสมือนจริงรายสาย + สัดส่วนวิชา
  patch.shopProducts = d.shopProducts || [];   // สินค้าในร้าน (ครูเติมทีหลัง)
  patch.shopFreebies = d.shopFreebies || [];   // ของแจกฟรี (ดาวน์โหลด PDF)
  if(d.shopFB!=null) patch.shopFB = d.shopFB;  // ชื่อเพจ Facebook สำหรับลิงก์สั่งซื้อ
  set(patch);
  try{ localStorage.setItem(CV_KEY, String(v)); }catch(e){}
  if(newer && v>1) toast("อัปเดตเนื้อหาใหม่แล้ว");
}
/* โหลดไฟล์คลังข้อสอบ — force=true บังคับดึงจากเน็ต (เวอร์ชันใหม่), ไม่งั้นอ่านจากแคช (ไม่กินเน็ต) */
function fetchQuestions(force){
  return fetch("questions.json", force?{cache:"reload"}:{cache:"force-cache"})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){ applyContent(d); })
    .catch(function(){});
}
/* เช็ค "ป้ายเวอร์ชัน" จิ๋วก่อน (~20 ไบต์) แล้วโหลดคลังเต็ม (~6MB) เฉพาะตอนเวอร์ชันเปลี่ยนจริง
   เวอร์ชันเดิม = ใช้ของในเครื่อง (0 เน็ต) · เวอร์ชันใหม่ = ดึงใหม่ครั้งเดียว · ออฟไลน์ = ใช้แคช */
function syncContent(){
  return fetch("version.json?_="+Date.now(),{cache:"no-store"})
    .then(function(r){ return r.ok?r.json():null; })
    .catch(function(){ return null; })
    .then(function(vj){
      var latestV = (vj && typeof vj.v==="number") ? vj.v : null;
      var appliedV = parseInt(localStorage.getItem(CV_KEY)||"",10); if(isNaN(appliedV)) appliedV=null;
      var haveContent = !!(S.bank && Object.keys(S.bank).length);
      // มีเนื้อหาในหน่วยความจำแล้ว + เวอร์ชันตรงล่าสุด → ไม่ต้องโหลดอะไรเลย
      if(haveContent && latestV!=null && latestV===appliedV) return;
      // ต้องโหลดเข้าหน่วยความจำ: บังคับดึงเน็ตเมื่อเวอร์ชันใหม่กว่า/ยังไม่รู้เวอร์ชันในเครื่อง, ไม่งั้นอ่านจากแคช
      var force = (latestV!=null && latestV!==appliedV);
      return fetchQuestions(force);
    });
}
/* ── กันสลับหน้าจอระหว่างทำข้อสอบ ──
   ถ้าสลับไปหน้าจอ/แอปอื่นขณะกำลังทำข้อสอบ ให้เด้งออกทันที ไม่บันทึกคะแนน
   ครอบคลุม: สลับแท็บ สลับแอป กดปุ่มโฮม ล็อกหน้าจอ */
function abortQuizOnSwitch(){
  if(S.quiz && S.quiz.status==="active"){
    clearQuizTimer();
    releaseWakeLock();
    S.quiz.status="aborted";
    render();
  }
}

/* ── ดึงข้อสอบใหม่ตอนกลับมาที่แอป ──
   นักเรียนส่วนใหญ่ไม่ได้ปิดแอปสนิท แค่สลับไปแอปอื่นแล้วกดกลับมา
   ถ้าไม่เช็คตรงนี้ เขาจะไม่ได้ข้อสอบชุดใหม่จนกว่าจะปิดแอปแล้วเปิดใหม่เอง */
var lastSyncAt = 0;
function maybeSync(){
  if(!isActivated()) return;                    // ยังไม่ได้เปิดใช้งาน
  if(S.quiz || S.adminOpen || S.mock || S.player || S.planOpen || S.trackDetail) return;   // ทำข้อสอบ/แอดมิน/ดูชุดข้อสอบ/ดูวิดีโอ/วางแผน/ดูรายละเอียดชุดเสมือนจริง อย่ารบกวน
  if(Date.now()-lastSyncAt < 30000) return;     // เพิ่งเช็คไปไม่ถึงครึ่งนาที
  lastSyncAt = Date.now();
  syncContent();
}

function deadlineDaysLeft(){ return DEADLINE_DAYIDX - Math.floor((Date.now()+7*3600000)/86400000); }
/* ── ป้ายวิ่งเตือนกำหนดชำระเงินสมัคร (แดงไหลด้านบน) — หยุดแสดงอัตโนมัติหลัง PAYMSG_END ──
   ปิดถาวร: PAYMSG_ON=false · เปลี่ยนเวลาหยุด: PAYMSG_END (มิลลิวินาที) · เปลี่ยนข้อความ: PAYMSG_TEXT */
var PAYMSG_ON=true;
var PAYMSG_END=1787158799000;   // 19 ส.ค. 2569 เวลา 23:59:59 (เวลาไทย) — หลังเวลานี้ป้ายหายเอง
var PAYMSG_TEXT="🔴 ด่วน! ชำระเงินสมัครสอบ นายสิบตำรวจ รุ่น 18 ได้ถึง 22:00 น. คืนนี้เท่านั้น — ห้ามพลาดเด็ดขาด!";
function paymsgActive(){ return PAYMSG_ON && Date.now()<=PAYMSG_END; }
function renderPaymsg(){
  var host=document.getElementById("paymsg"); if(!host) return;
  if(!paymsgActive()){ if(host.getAttribute("data-on")==="1"){ host.innerHTML=""; host.setAttribute("data-on","0"); } return; }
  if(host.getAttribute("data-on")==="1") return;   // สร้างแล้ว ไม่สร้างซ้ำ (กันแอนิเมชันสะดุด)
  host.setAttribute("data-on","1");
  if(!document.getElementById("paymsg-kf")){ var st=document.createElement("style"); st.id="paymsg-kf"; st.textContent="@keyframes paymflow{from{transform:translateX(0)}to{transform:translateX(-50%)}}"; document.head.appendChild(st); }
  var seg='<span style="color:#fff;font-size:13.5px;font-weight:800;padding-right:64px;white-space:nowrap;">'+PAYMSG_TEXT+'</span>';
  host.innerHTML='<div style="background:#E4111F;overflow:hidden;box-shadow:0 2px 8px rgba(228,17,31,.45);"><div style="display:inline-flex;white-space:nowrap;padding:7px 0;animation:paymflow 16s linear infinite;">'+seg+seg+'</div></div>';
}
function maybeShowDeadline(){
  if(!DEADLINE_ON) return;
  try{ if(localStorage.getItem('np18_deadline_off')==='1') return; }catch(e){}
  var d=deadlineDaysLeft();
  if(d<0) return;                                   // เลยวันหมดเขตแล้ว → ไม่เด้ง
  if(document.getElementById('deadlinePop')) return;
  var msg = d>1 ? ('เหลืออีก <b style="color:#E23B36">'+d+' วัน</b> ก่อนปิดรับสมัคร')
        : (d===1 ? '<b style="color:#E23B36">พรุ่งนี้วันสุดท้าย!</b> ปิดรับสมัครแล้ว'
                 : '<b style="color:#E23B36">วันนี้วันสุดท้าย!</b> รีบสมัครนะ');
  var w=document.createElement('div');
  w.id='deadlinePop';
  w.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(14,15,18,.72);display:flex;align-items:center;justify-content:center;padding:18px;';
  w.innerHTML='<div style="width:min(92vw,360px);max-height:94vh;overflow:auto;border-radius:18px;background:#fff;box-shadow:0 14px 44px rgba(0,0,0,.45);position:relative;-webkit-overflow-scrolling:touch;">'
    +'<button aria-label="ปิด" onclick="closeDeadline()" style="position:absolute;top:9px;right:9px;z-index:2;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:17px;line-height:34px;text-align:center;padding:0;cursor:pointer;">✕</button>'
    +'<img src="'+DEADLINE_IMG+'" alt="วันที่ 19 นี้ จะหมดเขตรับสมัครแล้ว ห้ามพลาด" style="display:block;width:100%;height:auto;border-radius:18px 18px 0 0;">'
    +'<div style="padding:12px 16px 16px;text-align:center;font-family:inherit;">'
      +'<div style="font-size:15.5px;color:#1a1a1a;font-weight:700;line-height:1.4;">'+msg+'</div>'
      +'<button onclick="closeDeadline()" style="width:100%;margin-top:12px;background:#E23B36;color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;">รับทราบแล้ว เข้าแอป</button>'
      +'<div onclick="closeDeadline(true)" style="margin-top:10px;color:#8a8a8a;font-size:12.5px;text-decoration:underline;cursor:pointer;">ไม่ต้องเตือนอีก</div>'
    +'</div>'
  +'</div>';
  w.addEventListener('click',function(e){ if(e.target===w) closeDeadline(); });
  document.body.appendChild(w);
}
function closeDeadline(off){
  if(off===true){ try{ localStorage.setItem('np18_deadline_off','1'); }catch(e){} }
  var el=document.getElementById('deadlinePop'); if(el) el.remove();
}
function startApp(){
  document.getElementById("gate").hidden=true;
  document.getElementById("install").hidden=true;
  document.getElementById("app").hidden=false;
  // ปุ่มติดตั้งบนแถบบน — โชว์เฉพาะเครื่องที่ยังไม่ได้ติดตั้ง (อัปเดตทุกครั้งที่แสดงแอป)
  var ib=document.getElementById("installbtn");
  if(ib){ ib.hidden=isStandalone(); ib.onclick=openInstallFromApp; }
  if(appStarted){ render(); return; }   // เคยเริ่มแล้ว (เช่นกลับจากหน้าติดตั้ง) — แค่แสดงแอป
  appStarted=true;
  load();
  render();
  maybeShowDeadline();
  renderPaymsg();
  lastSyncAt = Date.now();
  syncContent();
  setInterval(tickClock,30000);   // อัปเดตแค่นาฬิกา/วันนับถอยหลัง ไม่วาดใหม่ทั้งหน้า (กันจอกระพริบ/รูปโหลดซ้ำ)
  setInterval(renderPaymsg,30000);   // ตรวจเวลา ป้ายวิ่งชำระเงิน (หายเองหลัง 23:59)
  setInterval(focusTick,1000);   // นาฬิกาจับเวลาโฟกัส
  setInterval(checkAlarms,15000); // ตรวจเวลางานตามแผน แล้วเด้งเตือน
  document.addEventListener("touchstart", unlockAudio, {passive:true});
  document.addEventListener("click", unlockAudio);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden") abortQuizOnSwitch();
    else { if(S.quiz && S.quiz.status==="active") requestWakeLock(); maybeSync(); checkAlarms(); }   // wake lock หลุดตอนจอดับ ขอใหม่ถ้ายังทำข้อสอบอยู่
  });
  window.addEventListener("online", maybeSync);
  document.getElementById("brandtap").onclick=function(){ A.openAdmin(); };
}
/* ── เชิญติดตั้งลงหน้าจอ (หลังกรอกรหัสผ่าน) ── */
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); deferredPrompt=e; });
window.addEventListener("appinstalled",function(){ deferredPrompt=null; });
function isStandalone(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone===true;
}
function isIOSDevice(){
  var ua=navigator.userAgent||"";
  return /iPad|iPhone|iPod/.test(ua) || ((/Macintosh/.test(ua)) && navigator.maxTouchPoints>1);
}
function proceedToApp(){ document.getElementById("install").hidden=true; startApp(); }
function isInAppBrowser(){
  var ua=navigator.userAgent||"";
  return /Line\/|FBAN|FBAV|FB_IAB|Instagram|Messenger|TikTok|musical_ly|Twitter/i.test(ua);
}
function inAppName(){
  var ua=navigator.userAgent||"";
  if(/Line\//i.test(ua)) return "ไลน์";
  if(/FBAN|FBAV|FB_IAB|Messenger/i.test(ua)) return "เฟซบุ๊ก/Messenger";
  if(/Instagram/i.test(ua)) return "Instagram";
  if(/TikTok|musical_ly/i.test(ua)) return "TikTok";
  return "แอปนี้";
}
// หน้าแนะนำ "เปิดใน Safari/Chrome" (เมื่อเปิดในเบราว์เซอร์ในแอปอย่างไลน์/เฟซ — ติดตั้งลงหน้าจอไม่ได้)
function showOpenInBrowser(onContinue){
  var el=document.getElementById("install");
  var ios=isIOSDevice();
  var how = ios
    ? 'แตะปุ่ม <b>⋯</b> (จุดสามจุด) ที่มุมขวา → เลือก <b>“เปิดใน Safari”</b>'
    : 'แตะปุ่ม <b>⋮</b> (จุดสามจุด) มุมขวาบน → เลือก <b>“เปิดในเบราว์เซอร์”</b> หรือ <b>“เปิดด้วย Chrome”</b>';
  var h=''+
    '<div style="font-size:46px;text-align:center;margin-bottom:6px;">🌐</div>'+
    '<h1>เปิดใน '+(ios?"Safari":"Chrome/เบราว์เซอร์")+'</h1>'+
    '<p class="sub">ตอนนี้เปิดอยู่ใน<b>'+inAppName()+'</b> ซึ่ง<b>ติดตั้งลงหน้าจอไม่ได้</b><br>เปิดในเบราว์เซอร์จริงเพื่อใช้เต็มที่และติดตั้งได้</p>'+
    '<div style="text-align:left;background:rgba(255,255,255,.78);border:1px solid var(--c-border);border-radius:16px;padding:16px 18px;font-size:13.5px;line-height:1.8;">'+how+'</div>'+
    '<button class="btn" type="button" id="copyLinkBtn" style="width:100%;margin-top:14px;">📋 คัดลอกลิงก์แอป</button>'+
    '<button class="btn ghost" type="button" id="useHereBtn" style="width:100%;margin-top:10px;">ใช้ต่อในนี้ก่อน →</button>';
  el.innerHTML=h;
  document.getElementById("gate").hidden=true; document.getElementById("app").hidden=true;
  el.hidden=false;
  document.getElementById("copyLinkBtn").onclick=function(){
    var url=location.href.split("#")[0];
    var done=function(){ var b=document.getElementById("copyLinkBtn"); if(b) b.textContent="✓ คัดลอกแล้ว — เปิดเบราว์เซอร์แล้ววาง"; };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(done); }
    else { try{ var t=document.createElement("textarea"); t.value=url; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.focus(); t.select(); document.execCommand("copy"); t.remove(); done(); }catch(e){} }
  };
  document.getElementById("useHereBtn").onclick=function(){ el.hidden=true; if(onContinue) onContinue(); };
}
// ปุ่ม "ติดตั้ง" บนแถบบน (ข้อ 2) — เปิดในไลน์=แนะนำเปิดเบราว์เซอร์, ไม่งั้น=หน้าติดตั้ง
function openInstallFromApp(){
  if(isInAppBrowser()) showOpenInBrowser(function(){ startApp(); });
  else showInstallScreen();
}
function showInstallScreen(){
  var el=document.getElementById("install");
  var ios=isIOSDevice(), canPrompt=!!deferredPrompt;
  var h='';
  if(ios){
    // อินโฟกราฟิกวิธีติดตั้ง 5 ขั้น (ใบเดียวจบ)
    h+='<img src="icons/install-guide.jpg" alt="วิธีติดตั้งแอปลงหน้าจอ 5 ขั้นตอน" style="width:100%;display:block;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.15);">';
  } else {
    h+='<img src="icons/app-preview.jpg" alt="นสต.18" style="width:128px;display:block;margin:0 auto 12px;border-radius:16px;border:1px solid var(--c-border);box-shadow:0 10px 26px rgba(164,0,1,.22);">'+
       '<h1>ติดตั้งแอปลงหน้าจอ</h1>'+
       '<p class="sub">ติดตั้งแล้วได้ไอคอนนี้บนหน้าจอ — เปิดง่าย เร็ว ใช้ได้แม้ไม่มีเน็ต</p>';
    if(canPrompt){
      h+='<button class="btn" id="doInstall" type="button" style="width:100%;padding:14px;font-size:15px;">📲 ติดตั้งแอปเลย</button>';
    } else {
      h+='<div style="text-align:left;background:rgba(255,255,255,.75);border:1px solid var(--c-border);border-radius:16px;padding:16px 18px;font-size:13.5px;line-height:1.8;">'+
           'แตะเมนู <b>⋮</b> มุมขวาบนของเบราว์เซอร์ → เลือก <b>“ติดตั้งแอป”</b> หรือ <b>“เพิ่มลงในหน้าจอหลัก”</b>'+
         '</div>';
    }
  }
  h+='<button class="btn ghost" type="button" onclick="proceedToApp()" style="width:100%;margin-top:12px;">ข้ามไปก่อน เริ่มใช้เลย →</button>';
  el.innerHTML=h;
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=true;
  el.hidden=false;
  var di=document.getElementById("doInstall");
  if(di) di.onclick=function(){
    if(!deferredPrompt){ proceedToApp(); return; }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt=null; proceedToApp(); }).catch(function(){ proceedToApp(); });
  };
}
function showGate(){
  document.getElementById("app").hidden=true;
  document.getElementById("gate").hidden=false;
  var input=document.getElementById("codein");
  var err=document.getElementById("codeerr");
  var btn=document.getElementById("codebtn");

  input.addEventListener("input",function(){
    err.textContent="";
    var raw=normCode(input.value).slice(0,16);
    if(raw.indexOf("NST18")!==0 && raw.length>0 && "NST18".indexOf(raw)!==0) raw="NST18"+raw;
    var out=raw.slice(0,5);
    if(raw.length>5) out+="-"+raw.slice(5,10);
    if(raw.length>10) out+="-"+raw.slice(10,16);
    input.value=out;
  });
  var SAYS={
    offline:"ตอนเปิดใช้งานครั้งแรกต้องต่อเน็ตก่อนนะครับ\n(หลังจากนี้ใช้ได้ตลอด ไม่ต้องมีเน็ตอีก)",
    notfound:"ไม่พบรหัสนี้ในระบบ ตรวจตัวอักษรอีกครั้ง",
    used:"รหัสนี้ถูกเปิดใช้กับเครื่องอื่นไปแล้ว\n1 รหัสใช้ได้ 1 เครื่อง — ถ้าเปลี่ยนมือถือ ติดต่อผู้ขาย",
    revoked:"รหัสนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ขาย",
    busy:"ระบบกำลังยุ่ง รอสักครู่แล้วลองใหม่",
    badrequest:"เปิดใช้งานไม่สำเร็จ ลองใหม่อีกครั้ง",
    servererror:"ระบบขัดข้องชั่วคราว ลองใหม่อีกครั้ง"
  };
  function finish(v){
    try{ saveLic(v); }
    catch(e){ err.textContent="เครื่องนี้บันทึกข้อมูลไม่ได้ (ลองปิดโหมดไม่ระบุตัวตน)"; return; }
    if(isStandalone()) startApp();       // เปิดจากไอคอนแอปอยู่แล้ว → ข้ามหน้าติดตั้ง
    else showInstallScreen();            // เพิ่งกรอกรหัสในเบราว์เซอร์ → เชิญติดตั้งลงหน้าจอ
  }
  /* ปุ่มเปิดใช้งานคือรูปโลโก้ — ห้ามแตะ textContent ของปุ่ม (รูปจะหาย)
     บอกสถานะที่บรรทัด "แตะโลโก้เพื่อเปิดใช้งาน" ใต้โลโก้แทน */
  var hint=document.getElementById("taphint");
  var HINT=hint.textContent;
  var busy=false;
  function setBusy(on){
    busy=on;
    btn.disabled=on;
    btn.style.opacity=on?"0.45":"";
    hint.textContent=on?"กำลังตรวจสอบรหัส…":HINT;
  }
  function submit(){
    if(busy) return;
    var v=input.value;
    if(!normCode(v)){ err.textContent="กรอกรหัสก่อนนะครับ"; return; }
    if(!validCode(v)){
      err.textContent="รหัสไม่ถูกต้อง ตรวจตัวอักษรอีกครั้ง";
      input.select(); return;
    }
    if(!ACTIVATE_URL){ finish(v); return; }   // ยังไม่ได้เปิดระบบคุมเครื่อง

    setBusy(true); err.textContent="";
    askServer("activate", v, function(j){
      setBusy(false);
      if(j && j.ok){ finish(v); return; }
      err.textContent = SAYS[j && j.reason] || SAYS.servererror;
      input.select();
    });
  }
  btn.onclick=submit;
  input.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
}

function boot(){ if(isActivated()){ startApp(); revalidate(); } else showGate(); }
// เปิดในเบราว์เซอร์ในแอป (ไลน์/เฟซ) และยังไม่ได้ติดตั้ง → แนะนำเปิดใน Safari/Chrome ก่อน
if(isInAppBrowser() && !isStandalone()){ showOpenInBrowser(boot); } else boot();

/* ── service worker: ทำให้ใช้ออฟไลน์ได้ + แจ้งเตือนเมื่อมีเวอร์ชันใหม่ ── */
/* ขอ persistent storage — บอก Android/เบราว์เซอร์ว่า "อย่าลบข้อมูลแอปนี้ทิ้งเมื่อพื้นที่เหลือน้อย"
   กันไม่ให้ล็อกอิน/รหัสเครื่อง (np18_*) หาย → ลดปัญหาแอนดรอยด์เด้งออกแล้วกรอกรหัสเดิมไม่ได้
   หมายเหตุ: เป็นการ "ขอ" เท่านั้น ไม่แตะการตรวจรหัส/เครื่อง ไม่กระทบบัญชีที่เปิดใช้อยู่ */
try{
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persisted().then(function(already){
      if(!already){ navigator.storage.persist().catch(function(){}); }
    }).catch(function(){});
  }
}catch(e){}

if("serviceWorker" in navigator && location.protocol!=="file:"){
  /* อัปเดตอัตโนมัติ: พอมีเวอร์ชันใหม่ให้โหลดโค้ดใหม่เองเงียบ ๆ (นักเรียนไม่ต้องกดอะไร)
     — ยกเว้นตอนกำลังทำข้อสอบ จะรอจนออกจากข้อสอบก่อนค่อยรีโหลด (กันคะแนนหาย) */
  var _hadCtrl = !!navigator.serviceWorker.controller, _refreshing=false, _pendingReload=false;
  function _safeReload(){
    if(_refreshing) return;
    if(window.S && (S.quiz || S.mock || S.trackDetail)){ _pendingReload=true; return; }   // กำลังทำข้อสอบ/ดูชุด — ยังไม่รีโหลด
    _refreshing=true; try{ location.reload(); }catch(e){}
  }
  setInterval(function(){ if(_pendingReload) _safeReload(); }, 3000);
  navigator.serviceWorker.addEventListener("controllerchange",function(){ if(_hadCtrl) _safeReload(); });
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      try{ reg.update(); }catch(e){}                                   // เช็คเวอร์ชันใหม่ทุกครั้งที่เปิดแอป
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange",function(){
          if(nw.state==="installed" && navigator.serviceWorker.controller){
            nw.postMessage("skip-waiting");                           // เปิดใช้เวอร์ชันใหม่ทันที → controllerchange → รีโหลดอัตโนมัติ
          }
        });
      });
    }).catch(function(){});
  });
}
</script>
<script>
/* ───── โหมดถนอมสายตา (ทำงานแยกจากตัวแอป ไม่ยุ่งกับ state/render เดิม) ───── */
(function () {
  var K_NIGHT = 'np18_night', K_DIM = 'np18_dim', DIM_MAX = 0.55
  var root = document.documentElement
  var btn = document.getElementById('ecBtn')
  var panel = document.getElementById('ecPanel')
  var sw = document.getElementById('ecNight')
  var dim = document.getElementById('ecDim')
  var dimVal = document.getElementById('ecDimVal')
  if (!btn || !panel || !sw || !dim) return

  function get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }
  function set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k) } catch (e) {} }

  var isNight = get(K_NIGHT) === '1'
  var dimVer = Math.min(DIM_MAX, Math.max(0, parseFloat(get(K_DIM)) || 0))

  function applyNight() {
    if (isNight) root.setAttribute('data-theme', 'night')
    else root.removeAttribute('data-theme')
    sw.setAttribute('aria-checked', isNight ? 'true' : 'false')
    btn.textContent = isNight ? '☀' : '☾'
  }
  function applyDim() {
    root.style.setProperty('--ec-dim', String(dimVer))
    dim.value = String(dimVer)
    dimVal.textContent = Math.round((dimVer / DIM_MAX) * 100) + '%'
  }
  applyNight()
  applyDim()

  function openPanel(open) {
    panel.hidden = !open
    btn.setAttribute('aria-expanded', open ? 'true' : 'false')
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation()
    openPanel(panel.hidden)
  })
  sw.addEventListener('click', function () {
    isNight = !isNight
    if (isNight) set(K_NIGHT, '1'); else del(K_NIGHT)
    applyNight()
  })
  dim.addEventListener('input', function () {
    dimVer = Math.min(DIM_MAX, Math.max(0, parseFloat(dim.value) || 0))
    set(K_DIM, String(dimVer))
    applyDim()
  })
  // ปิดแผงเมื่อคลิกที่อื่น หรือกด Esc
  document.addEventListener('click', function (e) {
    if (!panel.hidden && !panel.contains(e.target) && e.target !== btn) openPanel(false)
  })
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) openPanel(false)
  })
})()
</script>
