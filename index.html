<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผู้ช่วยเตรียมสอบ นสต. รุ่น 18</title>
<meta name="theme-color" content="#A40001">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="นสต.18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pri:#E4111F; --priD:#B60D18;
    /* โทนกลางวัน (ค่าเดิมของแอป — กลางวันหน้าตาเหมือนเดิมทุกจุด) */
    --c-bg:#F4F6FA;
    --c-surface:#FFFFFF;
    --c-border:#E4E5E7;
    --c-text:#0E0F12;
    --c-text-muted:#6E7378;
    --c-text-subtle:#9AA0A8;
    --c-on-brand:#FFFFFF;
    --c-navpill:#FFFFFF;
    --ec-dim:0;              /* ชั้นหรี่แสง 0–0.55 */
  }
  /* โทนกลางคืน — พื้นอุ่นถนอมสายตา */
  [data-theme="night"]{
    color-scheme:dark;
    --c-bg:#1A1A1C;
    --c-surface:#242427;
    --c-border:#35353A;
    --c-text:#E8E6E3;
    --c-text-muted:#A3A099;
    --c-text-subtle:#7A776F;
    --c-on-brand:#F4EFEA;
    --c-navpill:#ECE7DE;
  }
  body{ transition:background-color .2s ease, color .2s ease; }

  /* ───── โหมดถนอมสายตา: ปุ่ม + แผงตั้งค่า + ชั้นหรี่แสง ───── */
  .ec-toggle{ flex:none; width:34px; height:34px; border-radius:10px; border:1px solid var(--c-border);
    background:var(--c-surface); color:var(--c-text); font-size:16px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s; }
  .ec-toggle:active{ transform:scale(.92); }
  .ec-statusgroup{ display:flex; align-items:center; gap:10px; }
  .ec-panel{ position:fixed; z-index:2147483600; top:52px; right:14px; width:250px; max-width:calc(100vw - 28px);
    background:var(--c-surface); color:var(--c-text); border:1px solid var(--c-border); border-radius:16px;
    box-shadow:0 14px 40px rgba(0,0,0,.28); padding:14px 16px; }
  .ec-panel[hidden]{ display:none !important; }
  .ec-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .ec-row + .ec-row{ margin-top:16px; }
  .ec-row .lbl2{ font-size:13px; font-weight:600; color:var(--c-text); }
  .ec-row .sub2{ font-size:11px; color:var(--c-text-subtle); margin-top:2px; }
  .ec-switch{ flex:none; width:46px; height:28px; border-radius:999px; border:none; cursor:pointer;
    background:var(--c-border); position:relative; transition:background .18s ease; }
  .ec-switch[aria-checked="true"]{ background:var(--pri); }
  .ec-switch::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
    background:var(--c-surface); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .18s ease; }
  .ec-switch[aria-checked="true"]::after{ left:21px; }
  .ec-dimrow{ flex-direction:column; align-items:stretch; }
  .ec-dimhead{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .ec-dimval{ font-size:12px; font-weight:600; color:var(--c-text-subtle); font-variant-numeric:tabular-nums; }
  .ec-range{ -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:999px;
    background:var(--c-border); outline:none; cursor:pointer; }
  .ec-range::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--pri); border:2px solid var(--c-surface); cursor:pointer; }
  .ec-range::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:var(--pri);
    border:2px solid var(--c-surface); cursor:pointer; }
  .ec-toggle:focus-visible, .ec-switch:focus-visible, .ec-range:focus-visible{ outline:2px solid var(--pri); outline-offset:2px; }
  /* ชั้นหรี่แสง: ทับทั้งจอ ไม่รับคลิก อยู่ใต้แผงตั้งค่าเพื่อให้ปรับสไลเดอร์ได้ชัด */
  .ec-dimlayer{ position:fixed; inset:0; pointer-events:none; z-index:2147483000;
    background:rgb(0 0 0 / var(--ec-dim)); transition:background-color .2s ease; }
  @media (prefers-reduced-motion:reduce){
    .ec-toggle,.ec-switch,.ec-switch::after,.ec-dimlayer,body{ transition:none !important; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; min-height:100%; }
  body{
    font-family:'Anuphan',system-ui,sans-serif; color:var(--c-text); background:var(--c-bg);
    -webkit-text-size-adjust:100%;
  }
  input,select,textarea,button{ font-family:inherit; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .np-scroll::-webkit-scrollbar{ width:0; }
  @keyframes flipIn{ from{ transform:rotateX(-88deg); opacity:0; } to{ transform:rotateX(0); opacity:1; } }
  @keyframes fadeUp{ from{ transform:translateY(8px); opacity:0; } to{ transform:none; opacity:1; } }

  /* โครงหน้าจอ — เต็มจอบนมือถือ, จัดกลางบนคอม */
  .shell{ max-width:460px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; background:transparent; position:relative; z-index:1; }
  /* พื้นหลังภาพของแอป (โหมดกลางวันเท่านั้น) — วางด้านหลังคงที่ ส่วนกลางขาวคอนเทนต์อ่านง่าย */
  #appbg{ position:fixed; inset:0; z-index:-1; pointer-events:none; background:#F4F6FA url('icons/app-bg.jpg') center top / cover no-repeat; }
  [data-theme="night"] #appbg{ display:none; }
  [data-theme="night"] .shell{ background:var(--c-bg); }
  .statusbar{ flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 22px;
    height:46px; padding-top:env(safe-area-inset-top); box-sizing:content-box; }
  /* โลโก้ + ชื่อสถาบัน มุมซ้ายบน = ปุ่มเข้าแผงแอดมิน */
  .brandtap{ display:flex; align-items:center; gap:9px; cursor:pointer; border:none; background:none;
    padding:0; border-radius:11px; transition:transform .12s ease; }
  .brandtap img{ width:34px; height:34px; border-radius:10px; display:block; box-shadow:0 3px 10px rgba(164,0,1,.28); }
  .brandname{ font-size:11px; font-weight:700; letter-spacing:.11em; color:#A40101; white-space:nowrap; }
  .brandtap:active{ transform:scale(.9); }
  .brandtap:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--pri); }
  .tabhead{ flex:none; padding:6px 20px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .kicker{ font-size:18px; font-weight:600; letter-spacing:.08em; color:var(--pri); text-transform:uppercase; }
  .tabhead h1{ margin:2px 0 0; font-size:23px; font-weight:700; letter-spacing:-.01em; }
  .cdchip{ text-align:right; color:var(--c-on-brand); border-radius:12px; padding:7px 12px; background:#A40001; flex:none; }
  .view{ flex:1; overflow-y:auto; padding:2px 16px 24px; -webkit-overflow-scrolling:touch; }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  .navwrap{ flex:none; padding:10px 14px calc(14px + env(safe-area-inset-bottom)); position:sticky; bottom:0; background:linear-gradient(180deg,rgba(244,246,250,0) 0%,var(--c-bg) 42%); }
  .navbar{ background:var(--pri); border-radius:999px; display:flex; padding:5px; gap:3px; box-shadow:0 10px 26px rgba(14,15,18,.20); }
  .navbtn{ flex:1; text-align:center; white-space:nowrap; cursor:pointer; border-radius:999px; padding:10px 4px;
    font-size:11.5px; font-weight:600; color:rgba(255,255,255,.80); border:none; background:transparent; transition:background .15s; }
  .navbtn.on{ background:var(--c-navpill); color:var(--pri); font-weight:700; box-shadow:0 2px 6px rgba(14,15,18,.18); }

  .card{ background:var(--c-surface); border:1px solid var(--c-border); border-radius:18px; padding:16px; }
  .card h3{ margin:0; font-size:14px; font-weight:700; }
  .lbl{ font-size:12px; font-weight:600; letter-spacing:.05em; color:var(--c-text-muted); text-transform:uppercase; }
  .muted{ font-size:12px; color:var(--c-text-muted); }
  .btn{ padding:11px 16px; border-radius:11px; border:none; background:var(--pri); color:var(--c-on-brand); font-size:14px; font-weight:700; cursor:pointer; }
  .btn.ghost{ border:1px solid var(--c-border); background:var(--c-surface); color:var(--c-text); font-weight:600; }
  .btn.sm{ padding:6px 12px; font-size:12px; border-radius:9px; font-weight:600; }
  .in{ border:1px solid var(--c-border); border-radius:9px; padding:7px 10px; font-size:14px; background:var(--c-surface); color:var(--c-text); }
  .chip{ font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:999px; white-space:nowrap; }

  /* ───── การแสดงผลสมการคณิตศาสตร์ ───── */
  /* เศษส่วนซ้อนบน-ล่าง */
  .fr{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle;
    margin:0 3px; line-height:1.12; font-size:.9em; position:relative; top:-0.06em; }
  .fr .n{ padding:0 4px 1px; border-bottom:1.4px solid currentColor; }
  .fr .d{ padding:1px 4px 0; }
  .mixw{ vertical-align:middle; margin-right:1px; }
  /* ยกกำลัง / ตัวห้อย */
  .msup{ font-size:.68em; vertical-align:super; line-height:0; margin-left:1px; }
  .msub{ font-size:.68em; vertical-align:sub;   line-height:0; margin-left:1px; }
  /* กรณฑ์ (รากที่สอง) — ขีดบนคลุมทั้งพจน์
     ต้องล็อก line-height ไว้ ไม่งั้นกล่องจะยืดตามข้อความรอบ ๆ แล้วเลขหลุดลงไปใต้ขีด */
  .sq{ display:inline-flex; align-items:stretch; vertical-align:middle; margin:0 2px; line-height:1.15; }
  .sq .rad{ font-size:1.05em; line-height:1.15; align-self:center; margin-right:-1px; }
  .sq .bod{ border-top:1.3px solid currentColor; padding:1px 3px 0 2px; line-height:1.15; }
  .fr, .fr .n, .fr .d{ line-height:1.15; }

  /* ประตูกรอกรหัส */
  .gate{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
    max-width:460px; margin:0 auto; padding:28px 24px calc(28px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,#FFFFFF 0%,#EAEFF6 100%); animation:fadeUp .35s ease-out; }
  .gate h1{ margin:0; font-size:22px; font-weight:700; text-align:center; letter-spacing:-.01em; }
  .gate .sub{ margin:8px 0 24px; font-size:13.5px; color:var(--c-text-muted); text-align:center; line-height:1.55; text-wrap:pretty; }
  /* โลโก้ = ปุ่มเข้าใช้งาน */
  .logobtn{ display:block; margin:18px auto 0; padding:0; border:none; background:none; cursor:pointer;
    border-radius:34px; line-height:0; transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 14px 38px rgba(164,0,1,.32); }
  .logobtn img{ width:154px; height:154px; border-radius:34px; display:block; }
  .logobtn:active{ transform:scale(.94); box-shadow:0 6px 18px rgba(164,0,1,.30); }
  .logobtn:focus-visible{ outline:none; box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--pri); }
  .logobtn.busy{ animation:pulse .5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(.96); } }
  .taphint{ margin:14px 0 0; font-size:13.5px; font-weight:700; color:var(--pri); text-align:center; }
  .codein{ width:100%; border:1.5px solid var(--c-border); border-radius:14px; padding:16px 14px; background:var(--c-surface);
    font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; text-align:center; letter-spacing:.06em; text-transform:uppercase; }
  .codein:focus{ outline:none; border-color:var(--pri); }
  .gate .err{ font-size:13px; color:var(--pri); font-weight:600; margin-top:10px; text-align:center; min-height:19px; white-space:pre-line; line-height:1.5; }
  .gate .note{ font-size:11.5px; color:var(--c-text-subtle); line-height:1.6; margin-top:22px; text-align:center; text-wrap:pretty; }

  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom));
    background:#0E0F12; color:var(--c-on-brand); font-size:13px; font-weight:600; padding:11px 18px; border-radius:999px;
    z-index:90; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:fadeUp .2s ease-out; max-width:88%; text-align:center; }

  .sheet{ position:fixed; inset:0; z-index:60; background:rgba(14,15,18,.5); display:flex; flex-direction:column; justify-content:flex-end; }
  .sheetin{ background:var(--c-bg); border-radius:24px 24px 0 0; max-height:92%; display:flex; flex-direction:column; overflow:hidden;
    max-width:460px; width:100%; margin:0 auto; animation:fadeUp .22s ease-out; padding-bottom:env(safe-area-inset-bottom); }
  .sheethead{ padding:16px 18px; border-bottom:1px solid var(--c-border); background:var(--c-surface); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .sheetbody{ padding:16px 18px; overflow-y:auto; }
  @keyframes tmpulse{ 0%,100%{ transform:scale(1); box-shadow:0 6px 18px rgba(0,0,0,.14); } 50%{ transform:scale(1.03); box-shadow:0 8px 24px rgba(0,0,0,.22); } }
  #quizTimerBar.tmup{ animation:tmpulse 1s ease-in-out infinite; }
  @media (prefers-reduced-motion:reduce){ #quizTimerBar.tmup{ animation:none; } }
  /* วงเปอร์เซ็นต์แบบเปลวไฟ — แสงเรืองไหวระริกเหมือนไฟลุก */
  @keyframes flameflick{ 0%,100%{ filter:drop-shadow(0 0 2px var(--fl)); } 45%{ filter:drop-shadow(0 0 7px var(--fl)); } 70%{ filter:drop-shadow(0 0 4px var(--fl)); } }
  #ytmount, #ytmount iframe{ position:absolute; inset:0; width:100%!important; height:100%!important; border:0; }
  /* จอวิดีโอล็อก — ปุ่มควบคุมของเราเอง (กันกดเข้าลิงก์/ก็อปลิงก์) */
  .ytctrl{ background:var(--c-surface); border-top:1px solid var(--c-border); }
  .ytbtn{ appearance:none; -webkit-appearance:none; border:0; background:var(--c-bg); color:var(--c-text); width:38px; height:38px; border-radius:50%; font-size:13px; font-weight:800; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition:transform .1s, background .15s; }
  .ytbtn:hover{ background:var(--c-border); }
  .ytbtn:active{ transform:scale(.9); }
  .ytbtn.play{ background:var(--pri); color:var(--c-on-brand); width:46px; height:46px; font-size:18px; box-shadow:0 3px 9px rgba(0,0,0,.18); }
  .ytstage:fullscreen{ width:100vw; height:100vh; border-radius:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ytstage:-webkit-full-screen{ width:100vw; height:100vh; border-radius:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ytstage.ytfs{ position:fixed!important; inset:0!important; z-index:9999!important; border-radius:0!important; background:#000; display:flex!important; flex-direction:column; align-items:center; justify-content:center; }
  .ytstage:fullscreen .ytwrap, .ytstage:-webkit-full-screen .ytwrap, .ytstage.ytfs .ytwrap,
  .ytstage:fullscreen .ytctrl, .ytstage:-webkit-full-screen .ytctrl, .ytstage.ytfs .ytctrl{ width:min(100%, calc((100vh - 54px) * 16 / 9)); }
  .ytstage:fullscreen .ytwrap, .ytstage:-webkit-full-screen .ytwrap, .ytstage.ytfs .ytwrap{ padding-top:0!important; aspect-ratio:16 / 9; }
  .flamearc{ filter:drop-shadow(0 0 3px var(--fl)); animation:flameflick 1.5s ease-in-out infinite; }
  /* ไฟลุกที่ปลายแถบ: ลิ้นไฟลุกขึ้น-ลง + แสงเรืองหายใจ */
  @keyframes fltongue{ 0%,100%{ transform:scaleY(1) scaleX(1); opacity:.95; } 35%{ transform:scaleY(1.28) scaleX(.88); opacity:1; } 65%{ transform:scaleY(.86) scaleX(1.08); opacity:.9; } }
  @keyframes flhalo{ 0%,100%{ opacity:.45; transform:scale(1); } 50%{ opacity:.9; transform:scale(1.2); } }
  @keyframes flcore{ 0%,100%{ opacity:.9; } 50%{ opacity:1; } }
  @keyframes freePulse{ 0%{ box-shadow:0 0 0 0 rgba(228,17,31,.5); } 70%{ box-shadow:0 0 0 12px rgba(228,17,31,0); } 100%{ box-shadow:0 0 0 0 rgba(228,17,31,0); } }
  .free-pill{ animation:freePulse 1.6s infinite; }
  @media (prefers-reduced-motion:reduce){ .free-pill{ animation:none; } }
  .fltongue{ transform-box:fill-box; transform-origin:50% 100%; filter:drop-shadow(0 0 2px var(--fl)); animation:fltongue .85s ease-in-out infinite; }
  .flhalo{ transform-box:fill-box; transform-origin:center; animation:flhalo 1.1s ease-in-out infinite; }
  .flcore{ filter:drop-shadow(0 0 3px var(--fl)); animation:flcore .85s ease-in-out infinite; }
  @media (prefers-reduced-motion:reduce){ .flamearc,.fltongue,.flhalo,.flcore{ animation:none; } }
  .x{ width:32px; height:32px; flex:none; border-radius:9px; border:1px solid var(--c-border); background:var(--c-surface); color:var(--c-text-muted); cursor:pointer; font-size:14px; }

  /* ───── กระดาษข้อสอบเสมือนจริง ───── */
  .paperhead{ text-align:center; padding-bottom:14px; margin-bottom:16px; border-bottom:2px solid #0E0F12; }
  .ph-org{ font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--pri); }
  .ph-title{ font-size:17px; font-weight:800; margin-top:3px; line-height:1.3; }
  .ph-sub{ font-size:11.5px; color:var(--c-text-muted); margin-top:3px; }
  .ph-name{ font-size:12px; margin-top:12px; text-align:left; }
  .psec{ font-size:12px; font-weight:700; color:var(--pri); background:#FBEFF0; padding:5px 10px;
         border-radius:6px; margin:18px 0 10px; page-break-after:avoid; break-after:avoid; }
  .pq{ margin-bottom:14px; page-break-inside:avoid; break-inside:avoid; }
  .pq-t{ display:flex; gap:7px; font-size:13.5px; line-height:1.65; align-items:baseline; }
  .pq-n{ font-weight:700; flex:none; min-width:1.7em; }
  .pch{ list-style:none; margin:5px 0 0 1.7em; padding:0; }
  .pch li{ font-size:13px; line-height:1.7; }
  .pans{ font-size:13px; font-weight:700; color:#1E9E5A; margin:4px 0 0 1.7em; }
  .ptopic{ font-size:10.5px; color:var(--c-text-subtle); margin:2px 0 0 1.7em; }
  .pexp{ font-size:12.5px; line-height:1.7; color:#3D4348; margin:5px 0 0 1.7em;
         padding-left:10px; border-left:2px solid var(--c-border); }
  .ex-h{ font-weight:800; color:#1E40AF; font-size:12px; margin:11px 0 3px; }   /* น้ำเงิน = ทั่วไป */
  .ex-h.warn{ color:#E4111F; }   /* แดง = จุดเตือน */
  .ex-h.tech{ color:#1E9E5A; }   /* เขียว = เทคนิค */
  .pexp .ex-h:first-child{ margin-top:0; }
  .ex-p{ font-size:11.5px; line-height:1.65; color:#3D4348; margin:3px 0; }
  .ex-li{ font-size:11.5px; line-height:1.55; color:#3D4348; margin:3px 0 3px 2px; padding-left:15px; position:relative; }
  .ex-li::before{ content:"•"; position:absolute; left:2px; color:var(--pri); font-weight:800; }
  .ex-hl{ background:#FFF1B8; color:#5A4200; border-radius:3px; padding:0 3px; font-weight:600; }
  .ex-warn{ background:#FEECEC; border-left:3px solid #E4111F; border-radius:0 8px 8px 0; padding:8px 11px; margin:9px 0; font-size:11.5px; color:#7A1219; line-height:1.6; }
  .ex-formula{ background:#EAF7EF; border:1px solid #B7E0C7; border-left:4px solid #1E9E5A; border-radius:10px; padding:11px 13px; margin:11px 0; }
  .ex-formula-t{ font-size:11.5px; font-weight:800; color:#1E7A44; margin-bottom:9px; letter-spacing:.02em; }
  .ex-formula-row{ margin-bottom:10px; }

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   ผู้ช่วยเตรียมสอบ นสต. รุ่น 18
   สร้างตามดีไซน์ ผู้ช่วยสอบนายสิบ.dc.html
   ═══════════════════════════════════════════════════════════════ */

/* ───── SHA-256 (เขียนไว้ในไฟล์ เพื่อให้ตรวจรหัสได้แม้เปิดจากไฟล์ในเครื่อง/ไม่มีเน็ต) ───── */
function sha256(str){
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var msg=unescape(encodeURIComponent(str));
  var maxWord=Math.pow(2,32), i, j, result="", words=[];
  var bitLength=msg.length*8;
  var hash=sha256.h=sha256.h||[];
  var k=sha256.k=sha256.k||[];
  var primeCounter=k.length, isComposite={};
  for(var candidate=2; primeCounter<64; candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate) isComposite[i]=candidate;
      hash[primeCounter]=(Math.pow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(Math.pow(candidate,1/3)*maxWord)|0;
    }
  }
  msg+="\x80";
  while(msg.length%64-56) msg+="\x00";
  for(i=0;i<msg.length;i++){
    j=msg.charCodeAt(i);
    if(j>>8) return "";
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(bitLength/maxWord)|0;
  words[words.length]=bitLength;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var i15=i-15, i2=i-2, a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^(~e&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:( w[i15]=w[i15]|0, w[i2]=w[i2]|0,
            (w[i-16]|0)+(rr(w[i15],7)^rr(w[i15],18)^(w[i15]>>>3))
            +(w[i-7]|0)+(rr(w[i2],17)^rr(w[i2],19)^(w[i2]>>>10)) )|0 );
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++)
    for(j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b<16)?0:"")+b.toString(16);
    }
  return result;
}

/* ───── ระบบรหัสเปิดใช้งาน ─────
   ⚠️ SECRET นี้ต้องตรงกับในไฟล์ "สร้างรหัส.html" ที่ใช้ออกรหัสให้นักเรียน
      ถ้าเปลี่ยนตรงนี้ รหัสเก่าที่แจกไปแล้วจะใช้ไม่ได้ทันที */
var SECRET = "nst18-lionking-2569-k7x2m9";
var LIC_KEY = "np18_license_v1";
var DEV_KEY = "np18_device_v1";
var ALPHA = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";

/* ⚠️ ลิงก์เซิร์ฟเวอร์ที่คุมว่า "1 รหัส = 1 เครื่อง" (ได้จาก Google Apps Script)
      ดูวิธีทำที่ไฟล์  เซิร์ฟเวอร์-รหัส/วิธีติดตั้ง.md
      ถ้าเว้นว่างไว้ = ไม่คุมเครื่อง (รหัสเดียวเปิดได้ทุกเครื่อง เหมือนก่อนหน้านี้) */
var ACTIVATE_URL = "https://script.google.com/macros/s/AKfycbwnlI8Pny8j8L4ltZXbPBfr9rhG4O1eAWwimhhkFqb1-TnMJJ8KKJfif-kk4jBLSFnWFA/exec";

/* รหัสประจำเครื่อง — สุ่มครั้งเดียวตอนเปิดแอปครั้งแรก ไม่มีข้อมูลส่วนตัวใด ๆ */
function deviceId(){
  var d=null;
  try{ d=localStorage.getItem(DEV_KEY); }catch(e){}
  if(!d){
    var a=new Uint8Array(8);
    (window.crypto||window.msCrypto).getRandomValues(a);
    d="D";
    for(var i=0;i<8;i++){ var h=a[i].toString(16); d+=(h.length<2?"0":"")+h; }
    try{ localStorage.setItem(DEV_KEY,d); }catch(e){}
  }
  return d;
}

function normCode(v){ return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function checkFor(payload){ return sha256(SECRET+"|"+payload).slice(0,6).toUpperCase(); }
function validCode(v){
  var c=normCode(v);
  if(c.indexOf("NST18")!==0) return false;
  var body=c.slice(5);
  if(body.length!==11) return false;
  var p=body.slice(0,5), chk=body.slice(5);
  for(var i=0;i<5;i++) if(ALPHA.indexOf(p[i])<0) return false;
  return checkFor(p)===chk;
}
function prettyCode(v){
  var c=normCode(v);
  return "NST18-"+c.slice(5,10)+"-"+c.slice(10,16);
}
function licSig(code,dev){ return sha256(SECRET+"|lic|"+code+"|"+dev).slice(0,12).toUpperCase(); }
function readLic(){
  try{ return JSON.parse(localStorage.getItem(LIC_KEY)||"null"); }catch(e){ return null; }
}
function saveLic(v){
  var code=prettyCode(v), dev=deviceId();
  localStorage.setItem(LIC_KEY, JSON.stringify({
    code:code, device:dev, sig:licSig(code,dev), at:new Date().toISOString()
  }));
}
function isActivated(){
  var l=readLic();
  if(!(l && l.code && validCode(l.code))) return false;
  if(!ACTIVATE_URL) return true;              // ยังไม่ได้เปิดระบบคุมเครื่อง
  var dev=deviceId();
  if(l.device!==dev) return false;            // ย้ายไฟล์ไปเครื่องอื่น → ต้องกรอกรหัสใหม่
  return l.sig===licSig(l.code,dev);          // กันการแก้ข้อมูลในเครื่องแบบง่าย ๆ
}

/* คุยกับเซิร์ฟเวอร์รหัส — ใช้ text/plain เพื่อให้ Apps Script รับได้โดยไม่ติด CORS */
function askServer(action,code,cb){
  var done=false;
  var t=setTimeout(function(){ if(!done){ done=true; cb({ok:false,reason:"offline"}); } },15000);
  fetch(ACTIVATE_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({ action:action, code:prettyCode(code), device:deviceId() })
  })
  .then(function(r){ return r.json(); })
  .then(function(j){ if(!done){ done=true; clearTimeout(t); cb(j||{ok:false,reason:"servererror"}); } })
  .catch(function(){ if(!done){ done=true; clearTimeout(t); cb({ok:false,reason:"offline"}); } });
}

/* เช็กเงียบ ๆ ตอนเปิดแอป: ล็อกออกเฉพาะรหัสที่พี่กด "ระงับ" เท่านั้น
   ถ้าไม่มีเน็ต/เซิร์ฟเวอร์ล่ม → ปล่อยผ่าน ไม่รบกวนคนที่ใช้ออฟไลน์อยู่ */
function revalidate(){
  if(!ACTIVATE_URL) return;
  var l=readLic(); if(!l) return;
  askServer("check", l.code, function(j){
    if(j && j.ok===false && j.reason==="revoked"){
      try{ localStorage.removeItem(LIC_KEY); }catch(e){}
      alert("รหัสนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ขาย");
      location.reload();
    }
  });
}

/* ═══════════ ตัวเขียนสมการคณิตศาสตร์ ═══════════
   แปลงข้อความที่ติวเตอร์พิมพ์ ให้แสดงตามหลักการเขียนคณิตศาสตร์
     1/2          → เศษส่วนซ้อนบน-ล่าง
     2 1/2        → จำนวนคละ
     (x+1)/(x-2)  → เศษส่วนที่มีหลายพจน์
     x^2  2^(n+1) → ยกกำลัง
     a_1  a_(n+1) → ตัวห้อย
     sqrt(2)      → กรณฑ์ มีขีดบนคลุม
     <= >= != +- *  -> → ≤ ≥ ≠ ± × →
   ข้อความไทยและตัวเลขธรรมดาไม่ถูกแตะต้อง · ผ่าน esc() กันสคริปต์แฝงทุกจุด */
var MSYM = [[/<=/g,"≤"], [/>=/g,"≥"], [/!=/g,"≠"], [/\+-/g,"±"], [/->/g,"→"], [/\*/g,"×"], [/<->/g,"↔"]];
function msym(t){ MSYM.forEach(function(p){ t = t.replace(p[0], p[1]); }); return t; }
function mIsInt(t){ return /^\d+$/.test(t); }

function mtok(s){
  var out = [], i = 0, n = s.length;
  while(i < n){
    var c = s[i];
    if(c === "\n"){ out.push({k:"chr", html:"\n"}); i++; continue; }
    if(c === " " || c === "\t"){
      var j = i; while(j < n && (s[j] === " " || s[j] === "\t")) j++;
      out.push({k:"sp", html:s.slice(i,j)}); i = j; continue;
    }
    if(c === "("){                                    // วงเล็บ → หาคู่ปิด แล้วแปลงข้างในซ้ำ
      var d = 0, j2 = i, ok = false;
      for(; j2 < n; j2++){
        if(s[j2] === "(") d++;
        else if(s[j2] === ")"){ d--; if(d === 0){ ok = true; break; } }
      }
      if(ok){
        var inner = s.slice(i+1, j2);
        out.push({k:"atom", grouped:true, txt:inner, html:"(" + mrender(inner) + ")"});
        i = j2 + 1; continue;
      }
    }
    if(s.substr(i,4) === "sqrt"){ out.push({k:"fn"}); i += 4; continue; }
    if(c === "^" || c === "_" || c === "/"){ out.push({k:"op", op:c}); i++; continue; }
    if(/[0-9A-Za-z.]/.test(c)){                       // เลข/ตัวแปร = พจน์เดี่ยว
      var j3 = i; while(j3 < n && /[0-9A-Za-z.]/.test(s[j3])) j3++;
      var t = s.slice(i,j3);
      out.push({k:"atom", txt:t, html:esc(t)}); i = j3; continue;
    }
    var j4 = i;                                        // ไทย/เครื่องหมายอื่น ๆ
    while(j4 < n && !/[\s()\^_\/0-9A-Za-z.]/.test(s[j4])) j4++;
    if(j4 === i) j4 = i + 1;
    out.push({k:"chr", html:esc(msym(s.slice(i,j4)))});
    i = j4;
  }
  return out;
}
function mNextAtom(t, i){ var j = i; while(j < t.length && t[j].k === "sp") j++; return (t[j] && t[j].k === "atom") ? j : -1; }

function mSqrt(t){
  var out = [];
  for(var i = 0; i < t.length; i++){
    if(t[i].k === "fn"){
      var j = mNextAtom(t, i+1);
      if(j >= 0){
        var body = t[j].grouped ? mrender(t[j].txt) : t[j].html;
        out.push({k:"atom", html:'<span class="sq"><span class="rad">√</span><span class="bod">'+body+'</span></span>'});
        i = j; continue;
      }
      out.push({k:"chr", html:"sqrt"}); continue;
    }
    out.push(t[i]);
  }
  return out;
}
function mScript(t){
  var out = [];
  for(var i = 0; i < t.length; i++){
    if(t[i].k === "op" && (t[i].op === "^" || t[i].op === "_") &&
       out.length && out[out.length-1].k === "atom" && t[i+1] && t[i+1].k === "atom"){
      var base = out.pop();
      var sup  = t[i+1].grouped ? mrender(t[i+1].txt) : t[i+1].html;   // วงเล็บของเลขชี้กำลังไม่ต้องแสดง
      var cls  = t[i].op === "^" ? "msup" : "msub";
      out.push({k:"atom", html: base.html + '<span class="'+cls+'">' + sup + "</span>"});
      i++; continue;
    }
    out.push(t[i]);
  }
  return out;
}
/* เศษส่วนต้องเป็น "เลข/เลข" จริง ๆ — ไม่ใช่ศัพท์อย่าง TCP/IP, N/A, BIOS/UEFI, OS/2 (มีตัวอักษร)
   และตัวส่วนต้องไม่ใช่เลข 4 หลัก (พ.ศ./เลขอ้างอิง เช่น 2/2548) */
function mNum(a){ if(!a) return false; if(a.grouped) return true; var t=a.txt||""; return /^[0-9]+(\.[0-9]+)?$/.test(t) && !/^0[0-9]/.test(t); }
function mDen(a){ return mNum(a) && !(a && !a.grouped && /^[0-9]{4,}$/.test(a.txt||"")); }
function mFrac(t){
  var out = [];
  for(var i = 0; i < t.length; i++){
    // ต้องติดกันสนิท "3/4" เท่านั้น — "1 / 10" ไม่ใช่เศษส่วน และทั้งเศษ/ส่วนต้องเป็นตัวเลข
    if(t[i].k === "op" && t[i].op === "/" &&
       out.length && out[out.length-1].k === "atom" && t[i+1] && t[i+1].k === "atom" &&
       mNum(out[out.length-1]) && mDen(t[i+1])){
      var num = out.pop(), den = t[i+1];
      var nh = num.grouped ? mrender(num.txt) : num.html;
      var dh = den.grouped ? mrender(den.txt) : den.html;
      var frac = '<span class="fr"><span class="n">'+nh+'</span><span class="d">'+dh+'</span></span>';
      // จำนวนคละ: จำนวนเต็ม + เว้นวรรค + เศษส่วน  เช่น "2 1/2"
      if(!num.grouped && mIsInt(num.txt) && out.length >= 2 &&
         out[out.length-1].k === "sp" && out[out.length-2].k === "atom" &&
         mIsInt(out[out.length-2].txt)){
        out.pop();                                   // ทิ้งช่องว่าง
        var whole = out.pop();
        frac = '<span class="mixw">' + whole.html + "</span>" + frac;
      }
      out.push({k:"atom", html:frac});
      i++; continue;
    }
    out.push(t[i]);
  }
  return out;
}
function mrender(s){
  var raw = String(s == null ? "" : s);
  // เลขอ้างอิงกฎหมาย/ระเบียบ เช่น "ข้อ 89/1" "มาตรา 9/1" ไม่ใช่เศษส่วน — คั่นด้วยอักขระกว้างศูนย์ กันไม่ให้แปลงเป็นเศษ
  raw = raw.replace(/((?:ข้อ|มาตรา|ฉบับที่|ระเบียบที่|ประกาศที่)\s*[0-9]+)\/([0-9]+)/g, "$1​/$2");
  var t = mtok(raw);
  t = mSqrt(t); t = mScript(t); t = mFrac(t);
  // สัญลักษณ์ที่ไม่ได้ถูกใช้สร้างเศษส่วน/ยกกำลัง ต้องคืนเป็นตัวอักษรตามเดิม
  // ไม่งั้นหน่วยอย่าง "ลิตร/ชม." จะกลายเป็น "ลิตรชม." (ขีดหายไปเฉย ๆ)
  t = t.map(function(x){
    if(x.k === "op") return { k:"chr", html: esc(x.op) };
    if(x.k === "fn") return { k:"chr", html: "sqrt" };
    return x;
  });
  return t.map(function(x){ return x.html; }).join("");
}
function mfrac(s){ return mrender(s); }

/* จัดรูปแบบเฉลยให้อ่านง่าย — หัวข้อ / ย่อหน้า / ตาราง / บูลเล็ต / กล่องเน้น "จุดล่อ"
   ทำงานจากข้อความที่คั่นด้วย \n และแถวตารางที่คั่นด้วย " | " */
var EXP_HEAD = /^(อ้างอิง|คำแปลโจทย์|คำแปล|ศัพท์ที่ต้องรู้|ศัพท์|โครงสร้างประโยค|โครงสร้าง|คำอธิบาย|เหตุผล|หลักคิดสำคัญ|หลักคิด|หลักการ|วิธีจำที่ไม่หลง|วิธีจำ|วิธีคิด|ตัวอย่างให้เห็นภาพ|ตัวอย่าง|ประโยคจำ|เกร็ดเพิ่มเติม|เกร็ดเพิ่ม|เกร็ด|ข้อควรจำ|ข้อควรระวัง|จุดที่ต้องระวัง|จุดที่ต้องจำ|จุดล่อ\S*|ทำไมข้ออื่นผิด|ทำไมจุดอื่น\S*|เทียบ\S*|ท่อง\S*|สังเกต\S*|คู่ตรงข้าม\S*|คู่ที่ต้อง\S*|ดูคำที่ตามหลัง\S*|ตารางลำดับ|ลำดับขนาด\S*|นึกภาพ\S*|รูปย่อ\S*|วิธีทำให้สมบูรณ์|สำนวนที่ควรจำ\S*|แก้ไขให้ถูกต้อง|โจทย์|ขั้นที่\s*[0-9๑-๙]*|จุดพลาดที่พบบ่อย|ตรวจคำตอบ|ข้อสังเกต|มองด้วยแผนภาพ|แนวทางฝึกต่อยอด|สรุป|ตารางเปรียบเทียบ\S*|ประเด็น)\s*[:：]?\s*/;
function expHeadClass(label){
  if(/^(จุดล่อ|ข้อควรระวัง|จุดที่ต้องระวัง|ทำไมข้ออื่นผิด)/.test(label)) return " warn";   // แดง = จุดเตือน
  if(/^(วิธีจำ|วิธีคิด|เทคนิค|เกร็ด|หลักคิด)/.test(label)) return " tech";  // เขียว = เทคนิค
  return "";                                                               // น้ำเงิน = ทั่วไป
}
function expHL(h){   // ไฮไลต์จุดสำคัญ: คำในเครื่องหมายคำพูด + ตัวเลข+หน่วย
  h=h.replace(/“([^”<]{1,40})”/g,'<mark class="ex-hl">“$1”</mark>');
  h=h.replace(/(\d+(?:[.,]\d+)*\s?(?:dpi|วัน|ชั่วโมง|ชม\.|ปี|เดือน|บาท|คน|ฉบับ|เท่า|กลุ่ม|เปอร์เซ็นต์|%))/g,'<mark class="ex-hl">$1</mark>');
  return h;
}
function fmtExp(s){
  var lines = String(s==null?"":s).split("\n").map(function(x){ return x.replace(/[─-╿]/g," ").replace(/\s{2,}/g," ").trim(); }).filter(Boolean);   // ล้างตัวอักษรกรอบ (┌─┐│└┘) กันตารางเพี้ยน
  var out="", i=0;
  while(i<lines.length){
    var ln=lines[i];
    if(/^ข้อ\s*\d+\s*[—–\-]\s*ตอบ\s*[ก-ง]/.test(ln)){ i++; continue; }   // ตัดบรรทัดเฉลยที่ซ้ำกับด้านบน
    if(ln.indexOf(" | ")>=0){                                            // ตาราง (กล่องมีกรอบ)
      var rows=[];
      while(i<lines.length && lines[i].indexOf(" | ")>=0){ rows.push(lines[i].split(" | ")); i++; }
      out+='<div class="ex-tblwrap"><table class="ex-tbl">';
      for(var r=0;r<rows.length;r++){
        out+='<tr>';
        for(var c=0;c<rows[r].length;c++){
          var cell=mrender(rows[r][c].trim());
          out+= (r===0 ? '<th>'+cell+'</th>' : '<td>'+cell+'</td>');
        }
        out+='</tr>';
      }
      out+='</table></div>'; continue;
    }
    if(/^📐/.test(ln)){                                                  // กล่องสูตรสีเขียว: บรรทัด "📐 ..." ตามด้วยบูลเล็ต "• จุดประสงค์ — สูตร"
      var ftitle=ln.replace(/^📐\s*/,"").trim(); i++;
      var frows="";
      while(i<lines.length && /^[•\-–●▪]\s+/.test(lines[i])){
        var fbody=lines[i].replace(/^[•\-–●▪]\s+/,"").trim();
        var fp=fbody.split(/\s—\s/), purpose="", formula=fbody;          // แยกด้วยขีดยาว (—) : "จุดประสงค์ — สูตร"
        if(fp.length>=2){ purpose=fp[0].trim(); formula=fp.slice(1).join(" — ").trim(); }
        frows+='<div class="ex-formula-row">'+(purpose?'<div class="ex-formula-p">'+esc(purpose)+'</div>':"")+'<div class="ex-formula-f">'+mrender(formula)+'</div></div>';
        i++;
      }
      out+='<div class="ex-formula"><div class="ex-formula-t">📐 '+esc(ftitle||"สูตรที่ใช้")+'</div>'+frows+'</div>'; continue;
    }
    if(/^⚠️/.test(ln)){ out+='<div class="ex-warn">'+expHL(mrender(ln))+'</div>'; i++; continue; }
    if(/^[-–•●▪✓]\s+/.test(ln)){ out+='<div class="ex-li">'+expHL(mrender(ln.replace(/^[-–•●▪✓]\s+/,"")))+'</div>'; i++; continue; }
    var m=ln.match(EXP_HEAD);
    if(m){
      out+='<div class="ex-h'+expHeadClass(m[1])+'">'+esc(m[1])+'</div>';
      var rest=ln.slice(m[0].length).trim();
      if(rest){
        var parts=rest.split(/\s[-–]\s/);                              // แยกลิสต์ "... - ก. ... - ง. ..."
        if(parts.length>=2){
          for(var p2=0;p2<parts.length;p2++){ var pp=parts[p2].replace(/^[-–•]\s*/,"").trim(); if(pp) out+='<div class="ex-li">'+expHL(mrender(pp))+'</div>'; }
        } else { out+='<div class="ex-p">'+expHL(mrender(rest))+'</div>'; }
      }
      i++; continue;
    }
    // ลิสต์เลขในบรรทัดเดียว "... 1. a 2. b 3. c" → นำ + บูลเล็ต
    if(/(^|\s)1[.)]\s/.test(ln) && /\s2[.)]\s/.test(ln)){
      var segs=ln.split(/\s(?=[1-9]\d?[.)]\s)/);
      if(segs.length>=2){
        var lead=segs[0].trim();
        if(lead && !/^[1-9]\d?[.)]/.test(lead)){ out+='<div class="ex-p">'+expHL(mrender(lead))+'</div>'; segs=segs.slice(1); }
        for(var s2=0;s2<segs.length;s2++){ var it=segs[s2].replace(/^[1-9]\d?[.)]\s*/,"").trim(); if(it) out+='<div class="ex-li">'+expHL(mrender(it))+'</div>'; }
        i++; continue;
      }
    }
    out+='<div class="ex-p">'+expHL(mrender(ln))+'</div>'; i++;
  }
  return out;
}
function pv(str){
  if(str==null) return NaN;
  var s=String(str).trim();
  if(s.indexOf(":")>=0){ var p=s.split(":").map(parseFloat); if(p.some(isNaN)) return NaN; return p[0]*60+(p[1]||0); }
  return parseFloat(s.replace(/[^0-9.]/g,""));
}

function phaseCounts(T){
  var mock=T<=1?0:Math.min(3,Math.max(2,Math.round(T*0.2)));
  var content=Math.max(1,Math.round(T*0.6));
  if(content+mock>T) mock=Math.max(0,T-content);
  var drill=T-content-mock;
  if(drill<0){ drill=0; content=T-mock; }
  return {content:content, drill:drill, mock:mock};
}
function phaseFor(i,T){ var c=phaseCounts(T); if(i<c.content) return "content"; if(i>=T-c.mock) return "mock"; return "drill"; }
function iconFor(k,type){
  if(type==="phys") return "🏃";

}

}

function calc(){
  var hours=Number(S.hours)||3, total=Math.round(hours*60);
  var b0=Math.round(total*5/12), b1=Math.round(total*4/12), b2=total-b0-b1;
  var mins=[b0,b1,b2];
  var t0=S.studyStart, t1=addTime(t0,b0), t2=addTime(t0,b0+b1), t3=addTime(t0,total);
  var timeRanges=[t0+"–"+t1, t1+"–"+t2, t2+"–"+t3];

  var daysLeft=null;
  if(S.examDate){ var ex=new Date(S.examDate+"T00:00:00"); daysLeft=Math.round((ex-today0())/MS); }
  var planNo=S.planWeeksNoDate||12;
  var T = daysLeft!=null ? Math.max(1,Math.ceil(daysLeft/7)) : planNo;

  var anchorMon=mondayOf(today0());
  var selObj=S.selDate?parseISO(S.selDate):today0();
  var weekIndex=Math.min(Math.max(0,Math.floor(Math.round((selObj-anchorMon)/MS)/7)),T-1);

  return { mins:mins, timeRanges:timeRanges, daysLeft:daysLeft, planNo:planNo, T:T,
           anchorMon:anchorMon, selObj:selObj, weekIndex:weekIndex };
}
function cellFor(entry,time){
  var k=entry[0], act=entry[1], type=entry[2];
  return { subjName:short(k), sk:k, type:type, icon:iconFor(k,type), act:act, time:time };
}
function blocksOf(dayIdx,weekIndex,T){
  var c=calc();
  var off=Number(S.dayOff);
  if(dayIdx===off) return null;
  var P=plans()[phaseFor(weekIndex,T)];
  var k=0; for(var i=0;i<dayIdx;i++){ if(i!==off) k++; }
  return P[k%6].map(function(b,bi){ return cellFor(b, c.timeRanges[bi]); });
}
/* รวม override ที่ผู้ใช้แก้เองเข้ากับบล็อกตั้งต้น */
function merged(b,weekIndex,dayIdx,bi){
  var ov=(S.edits||{})[weekIndex+":"+dayIdx+":"+bi]||{};
  var type=ov.type!=null?ov.type:b.type, sk=ov.sk!=null?ov.sk:b.sk;
  return { subjName: ov.subj!=null?ov.subj:b.subjName,
           act: ov.act!=null?ov.act:b.act,
           time: ov.time!=null?ov.time:b.time,
           type:type, sk:sk,
           icon: ov.type!=null?iconFor(sk,type):b.icon };
}

function knowStats(){
  var done=0,total=0;
  subjects().forEach(function(su){
    (S.topics[su.k]||[]).forEach(function(t){ total++; if(S.know[t.id]) done++; });
  });
  return { done:done, total:total, pct: total?Math.round(done/total*100):0 };
}
function physStats(){
  var evs=physList(), passedCount=0;
  var per=evs.map(function(e){
    var targetRaw=(S.target[e.k]!=null && S.target[e.k]!=="")?S.target[e.k]:e.def;
    var target=pv(targetRaw);
    var list=(S.tests&&S.tests[e.k])||[];
    var passArr=list.map(function(v){
      var val=pv(v);
      if(isNaN(val)||isNaN(target)) return false;
      return e.dir==="high" ? val>=target : val<=target;
    });
    // ผลครั้งล่าสุด (รายการท้ายสุด) — ใช้ตัดสินสถานะ "ผ่าน/ไม่ผ่าน" ตามผลล่าสุดที่ทำได้
    var lastObj=null;
    for(var li=list.length-1; li>=0; li--){ var lval=pv(list[li]); if(!isNaN(lval)){ lastObj={raw:list[li],val:lval}; break; } }
    var passed = lastObj!=null && !isNaN(target) && (e.dir==="high"?lastObj.val>=target:lastObj.val<=target);
    if(passed) passedCount++;
    return { e:e, targetRaw:targetRaw, target:target, list:list, passArr:passArr, n:list.length,
             last:(lastObj?lastObj.val:null), lastRaw:(lastObj?lastObj.raw:null), passed:passed,
             stKey: list.length===0?"none":(passed?"pass":"improve") };
  });
  return { per:per, passed:passedCount, total:evs.length, pct: evs.length?Math.round(passedCount/evs.length*100):0 };
}
// แสดงระยะห่างจากเกณฑ์ให้อ่านง่าย (เวลาเป็น น:วิ, อื่น ๆ เป็นตัวเลข+หน่วย)
function fmtGap(e, diff){
  diff=Math.abs(diff);
  if(e.fmt==="mmss"){ var m=Math.floor(diff/60), s=Math.round(diff%60); return m?(m+":"+String(s).padStart(2,"0")+" นาที"):(s+" วินาที"); }
  return (Math.round(diff*100)/100)+" "+(e.unit||"");
}

/* ───── ตั้งค่าพิเศษรายหัวข้อ (หัวข้อที่ไม่ระบุ = ค่าปกติ: สุ่ม 10 ข้อ · ผ่าน 80%) ─────
   draw  = จำนวนข้อที่สุ่มมาให้ทำต่อครั้ง
   passN = เกณฑ์ผ่านแบบ "นับจำนวนข้อถูก" (แทนผ่าน 80%)
   badge = ข้อความบนป้ายแดงแทนคำว่า "ใหม่" */
var TOPIC_CFG = {
  math_13: { draw:15, passN:13, badge:"มาใหม่ และสู้มือ!" },
  math_07: { draw:15, passN:13, badge:"มาใหม่ และสู้มือ!" },
  math_14: { draw:15, passN:13, badge:"มาใหม่ และสู้มือ!" }
};
function topicDraw(id){ var c=TOPIC_CFG[id]; return (c&&c.draw)||10; }
function topicPassN(id){ var c=TOPIC_CFG[id]; return (c&&c.passN!=null)?c.passN:null; }         // เกณฑ์ผ่านเป็นจำนวนข้อ (null=ใช้ 80%)
function topicPass(id, correct, total){                                                          // ตัดสินผ่าน/ไม่ผ่านจากผลจริง
  var n=topicPassN(id);
  if(n!=null) return correct>=n;
  return total ? Math.round(correct/total*100)>=80 : false;
}
function scoredPass(id, pct){                                                                    // ตัดสินผ่านจากเปอร์เซ็นต์ที่เก็บไว้ (ใช้ตอนแสดงผลย้อนหลัง)
  var c=TOPIC_CFG[id];
  if(c && c.passN!=null && c.draw) return pct >= Math.round(c.passN/c.draw*100);
  return pct>=80;
}

/* จานสีเปลวไฟของวงเปอร์เซ็นต์ — ล่างเข้ม→บนสว่าง เหมือนไฟลุก + มีแสงเรือง/ไหวระริก
   key = สีฐานที่ส่งเข้ามา (แดง=ความรู้, เขียว=ร่างกาย) ทำให้ทุกจุดที่เรียก ring() หน้าตาเหมือนกัน */
var FLAME={
  "#E4111F":{ base:"#E4111F", g0:"#FFCF3D", g1:"#FF6A1A", g2:"#D80E1B", glow:"#FF5A1E" }, // เปลวไฟแดง
  "#1E9E5A":{ base:"#1E9E5A", g0:"#C4F24E", g1:"#37C46B", g2:"#0B7A41", glow:"#40CB74" }  // เปลวไฟเขียว
};
var _flN=0;
function ring(pct,color,label,st){
  var C=2*Math.PI*46;
  var p=Math.max(0,Math.min(100, pct||0));
  var f=FLAME[color]||{ base:color, g0:color, g1:color, g2:color, glow:color };
  var uid="flame"+(++_flN), hid=uid+"h";
  // ตำแหน่ง "ปลาย" ของแถบ (หัวความคืบหน้า) — เริ่มที่ 12 นาฬิกา วนตามเข็ม
  var th=2*Math.PI*(p/100);
  var tx=54+46*Math.sin(th), ty=54-46*Math.cos(th);
  var flameTip = p>0
    ? '<g transform="translate('+tx.toFixed(2)+','+ty.toFixed(2)+')" style="--fl:'+f.glow+';">'+
        '<circle class="flhalo" r="9" fill="url(#'+hid+')"></circle>'+
        '<path class="fltongue" d="M0,-10 C5.2,-4 4.2,2.6 0,5.2 C-4.2,2.6 -5.2,-4 0,-10 Z" fill="url(#'+uid+')"></path>'+
        '<circle class="flcore" r="2.6" fill="'+f.g0+'"></circle>'+
      '</g>'
    : '';
  return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">'+
    '<div style="position:relative;width:108px;height:108px;">'+
      '<svg width="108" height="108" viewBox="0 0 108 108" style="overflow:visible;">'+
        '<defs><linearGradient id="'+uid+'" x1="0" y1="1" x2="0" y2="0">'+
          '<stop offset="0%" stop-color="'+f.g2+'"></stop>'+
          '<stop offset="55%" stop-color="'+f.g1+'"></stop>'+
          '<stop offset="100%" stop-color="'+f.g0+'"></stop>'+
        '</linearGradient>'+
        '<radialGradient id="'+hid+'">'+
          '<stop offset="0%" stop-color="'+f.glow+'" stop-opacity="0.85"></stop>'+
          '<stop offset="100%" stop-color="'+f.glow+'" stop-opacity="0"></stop>'+
        '</radialGradient></defs>'+
        '<circle cx="54" cy="54" r="46" fill="none" stroke="var(--c-border)" stroke-width="10"></circle>'+
        '<circle class="flamearc" cx="54" cy="54" r="46" fill="none" stroke="url(#'+uid+')" stroke-width="10" stroke-linecap="round" '+
          'stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p/100))+'" transform="rotate(-90 54 54)" '+
          'style="--fl:'+f.glow+';transition:stroke-dashoffset .6s;"></circle>'+
        flameTip+
      '</svg>'+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">'+
        '<span class="mono" style="font-size:26px;font-weight:700;color:'+f.base+';">'+pct+'</span>'+
        '<span style="font-size:11px;font-weight:600;color:'+f.base+';margin-top:-2px;">%</span>'+
      '</div>'+
    '</div>'+
    '<div style="font-size:13px;font-weight:600;">'+label+'</div>'+
    '<div style="font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:#F4F6F9;color:'+st.c+';">'+st.t+'</div>'+
  '</div>';
}

// ดึง YouTube video id จากลิงก์หลายรูปแบบ (watch, youtu.be, embed, shorts) หรือรับ id ตรง ๆ
function ytId(url){
  var s=String(url||"").trim();
  if(/^[\w-]{11}$/.test(s)) return s;
  var m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
  return m?m[1]:"";
}

function videoIndex(){                       // id → {v, tid, sk} สำหรับสร้างประวัติ/เปิดเล่น
  var idx={};
  subjects().forEach(function(su){
    (S.topics[su.k]||[]).forEach(function(t){
      studyVids(t.id).forEach(function(v){ idx[v.id]={v:v, tid:t.id, sk:su.k}; });
    });
  });
  return idx;
}
function prog(id){ return (S.progress||{})[id]||{sec:0,pct:0,at:null}; }
function isDone(id){ return (prog(id).pct||0) >= 90; }   // ดูจบ ~90% ขึ้นไป = เรียนจบ
function subjVidStats(sk){
  var total=0, done=0;
  (S.topics[sk]||[]).forEach(function(t){
    studyVids(t.id).forEach(function(v){ total++; if(isDone(v.id)) done++; });
  });
  return { total:total, done:done, pct: total?Math.round(done/total*100):0 };
}
function allVidStats(){
  var total=0, done=0;
  subjects().forEach(function(su){ var s=subjVidStats(su.k); total+=s.total; done+=s.done; });
  return { total:total, done:done, pct: total?Math.round(done/total*100):0 };
}
function learnHistory(){
  var idx=videoIndex(), pr=S.progress||{}, arr=[];
  Object.keys(pr).forEach(function(id){ if(idx[id] && pr[id] && pr[id].at) arr.push({ id:id, at:pr[id].at, v:idx[id].v, sk:idx[id].sk, pct:pr[id].pct||0 }); });
  arr.sort(function(a,b){ return a.at<b.at?1:(a.at>b.at?-1:0); });
  return arr;
}
function relTime(iso){
  var t=new Date(iso).getTime(); if(isNaN(t)) return "";
  var s=Math.floor((Date.now()-t)/1000);
  if(s<60) return "เมื่อครู่นี้";
  if(s<3600) return Math.floor(s/60)+" นาทีที่แล้ว";
  if(s<86400) return Math.floor(s/3600)+" ชม.ที่แล้ว";
  if(s<2592000) return Math.floor(s/86400)+" วันที่แล้ว";
  var d=new Date(iso); return d.getDate()+"/"+(d.getMonth()+1);
}

/* ── YouTube IFrame API (ฟรี ไม่ต้องมี API key) — ทำ % ที่ดูจริง + จำตำแหน่งล่าสุด ── */
var _yt={ player:null, vid:null, poll:0, apiReq:false };
function ensureYTApi(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  window.onYouTubeIframeAPIReady=function(){ cb(); };
  if(!_yt.apiReq){
    _yt.apiReq=true;
    var s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s);
  }
}
function saveProg(id, patch){
  var pr=Object.assign({}, S.progress||{});
  pr[id]=Object.assign({sec:0,pct:0}, pr[id]||{}, patch, {at:new Date().toISOString()});
  S.progress=pr; save();     // ไม่ render เพื่อไม่ให้ iframe รีโหลด
}
function fmtSec(sec){ var s=Math.floor(sec||0); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function setYtUI(){                       // อัปเดตปุ่มเล่น/หยุด + ชั้นหรี่จอเวลาหยุด (ไม่ render)
  if(!_yt.player || !_yt.player.getPlayerState) return;
  var playing=_yt.player.getPlayerState()===1;
  var ic=document.getElementById("ytplayicon"); if(ic) ic.textContent=playing?"⏸":"▶";
  var big=document.getElementById("ytbigplay"); if(big) big.style.display=playing?"none":"flex";
  var sh=document.getElementById("ytshield"); if(sh) sh.style.background=playing?"transparent":"rgba(0,0,0,.4)";
}
function pollProg(){
  if(!_yt.player || !_yt.player.getCurrentTime || !S.player) return;
  var cur=_yt.player.getCurrentTime()||0;
  var dur=(_yt.player.getDuration&&_yt.player.getDuration())||0;
  var tEl=document.getElementById("yttime"); if(tEl) tEl.textContent=fmtSec(cur)+(dur>0?" / "+fmtSec(dur):"");
  if(dur>0){
    var pct=Math.max(0,Math.min(100,Math.round(cur/dur*100)));
    saveProg(S.player.id,{sec:cur,pct:pct});
    var bar=document.getElementById("ytbar"); if(bar) bar.style.width=pct+"%";
    var mp=document.getElementById("ytmeta"); if(mp) mp.textContent=(S.player.dur?S.player.dur+" · ":"")+"ดูแล้ว "+pct+"% · บันทึกตำแหน่งล่าสุดอัตโนมัติ";
  }
}
function startPoll(){ stopPoll(); _yt.poll=setInterval(pollProg,1500); }
function stopPoll(){ if(_yt.poll){ clearInterval(_yt.poll); _yt.poll=0; } }
function destroyPlayer(){ stopPoll(); if(_yt.player && _yt.player.destroy){ try{ _yt.player.destroy(); }catch(e){} } _yt.player=null; _yt.vid=null; }
// สลับวิชา/ย้อนกลับ — ถ้ามีวิดีโอเล่นอยู่ อัปเดตแค่ลิสต์ (ไม่รีโหลด iframe = วิดีโอไม่หยุด)
function studyNav(){
  var mnt=document.getElementById("ytmount");
  var br=document.getElementById("studyBrowse");
  if(S.player && _yt.player && br && mnt && mnt.tagName==="IFRAME"){
    br.innerHTML=studyBrowseHTML();
  } else {
    render();
  }
  var v=document.getElementById("view"); if(v) v.scrollTop=0;
}
// สลับคลิปในเครื่องเล่นเดิม (ไม่รีโหลด iframe) — อัปเดตเฉพาะส่วนใต้จอ+ลิสต์ วิดีโอเล่นต่อทันที
function switchClip(id){
  var e=videoIndex()[id]; if(!e) return;
  var newYt=e.v.yt||ytId(e.v.url);
  S.player={ id:id, title:e.v.title, yt:newYt, sk:e.sk, tid:e.tid, desc:e.v.desc||"", dur:e.v.dur||"" };
  _yt.vid=id;
  saveProg(id,{});
  var startSec=Math.floor(prog(id).sec||0);
  try{ if(newYt) _yt.player.loadVideoById({videoId:newYt, startSeconds:startSec}); }catch(err){}
  var ch=document.getElementById("ytchrome"); if(ch) ch.innerHTML=playerChromeHTML(S.player);
  var br=document.getElementById("studyBrowse"); if(br) br.innerHTML=studyBrowseHTML();
  var bar=document.getElementById("ytbar"); if(bar) bar.style.width=(prog(id).pct||0)+"%";
  var v=document.getElementById("view"); if(v) v.scrollTop=0;
}
function mountPlayer(){
  var p=S.player; if(!p || !p.yt) return;
  var el=document.getElementById("ytmount"); if(!el) return;
  if(el.tagName==="IFRAME" && _yt.player && _yt.vid===p.id) return;   // ยังเล่นอยู่ ไม่ต้องสร้างใหม่
  destroyPlayer();
  _yt.vid=p.id;
  var startSec=Math.floor(prog(p.id).sec||0);
  ensureYTApi(function(){
    if(!S.player || S.player.id!==p.id) return;
    if(!document.getElementById("ytmount")) return;
    _yt.player=new YT.Player("ytmount",{
      width:"100%", height:"100%", videoId:p.yt,
      // controls:0 + fs:0 + disablekb + iv_load_policy:3 → ซ่อนคอนโทรล/โลโก้/คำบรรยายของ YouTube (ใช้ปุ่มเราแทน)
      playerVars:{ rel:0, modestbranding:1, playsinline:1, controls:0, fs:0, disablekb:1, iv_load_policy:3, start:startSec },
      events:{
        onReady:function(e){ var l=document.getElementById("ytload"); if(l) l.style.display="none"; try{ e.target.playVideo(); }catch(_){} startPoll(); setYtUI(); },
        onStateChange:function(e){ setYtUI(); if(e.data===1) startPoll(); else { pollProg(); if(e.data===2||e.data===0) stopPoll(); } }
      }
    });
  });
}

/* ═══════════ ข้อสอบ ═══════════ */
var THL=["ก","ข","ค","ง"];
/* ข้อสอบมิติสัมพันธ์ที่ตัวเลือก A-D วาดอยู่ในรูป — ปุ่มต้องขึ้น "A" เฉย ๆ
   ไม่ใช่ "ก.A" ไม่งั้นนักเรียนงงว่าให้ดูตัวอักษรชุดไหน */
function isLetterCh(ch){
  return ch && ch.length===4 && ch[0]==="A" && ch[1]==="B" && ch[2]==="C" && ch[3]==="D";
}
function chLabel(ch, ci){
  return isLetterCh(ch) ? '<b>'+ch[ci]+'</b>' : (THL[ci]||"")+". "+mfrac(ch[ci]);
}
function validQs(a){
  // โจทย์ต้องมีข้อความ "หรือ" รูป (ข้อสอบรูปภาพบางข้อไม่มีข้อความโจทย์เลย)
  return (a||[]).filter(function(x){ return x && (x.q || x.img) && Array.isArray(x.choices) && x.choices.length>=2; })
    .map(function(x){
      var o = { q:x.q||"", choices:x.choices.slice(0,4),
                answer:Math.max(0,Math.min(x.choices.length-1, x.answer|0)),
                explain:x.explain||"" };
      if(x.img)  o.img  = x.img;                    // รูปโจทย์
      if(x.ximg) o.ximg = x.ximg;                   // รูปเฉลย
      if(x.cimg) o.cimg = x.cimg.slice(0,4);        // รูปตัวเลือก
      return o;
    });
}
function drawQs(arr, n){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a.slice(0, n||10);
}

/* ══════════ ชุดข้อสอบเสมือนจริง ══════════
   สัดส่วนตามข้อสอบจริงของ นสต. — แก้ตัวเลขตรงนี้ได้ถ้าประกาศเปลี่ยน */
var MOCK_PLAN = [
  { k:"math",   n:30 },
  { k:"thai",   n:25 },
  { k:"eng",    n:30 },
  { k:"com",    n:25 },
  { k:"law",    n:20 },
  { k:"social", n:20 }
];
var MOCK_TOTAL = MOCK_PLAN.reduce(function(a,b){ return a+b.n; },0);

/* ข้อสอบทั้งหมดของวิชาหนึ่ง (รวมทุกหัวข้อ) พร้อมชื่อหัวข้อติดไปด้วย */
function poolOf(subj){
  var out=[];
  (S.topics[subj]||[]).forEach(function(t){
    validQs(S.bank[t.id]).forEach(function(q){
      q._topic = t.label; out.push(q);
    });
  });
  return out;
}
/* พูลข้อสอบจากหัวข้อเจาะจง (ใช้กับสายสอบที่กำหนดสัดส่วนย่อยระดับหัวข้อ เช่น 2.1 Office 60%) */
function topicLabelById(tid){
  var subs=Object.keys(S.topics||{});
  for(var i=0;i<subs.length;i++){ var arr=S.topics[subs[i]]||[]; for(var j=0;j<arr.length;j++){ if(arr[j].id===tid) return arr[j].label; } }
  return "";
}
function poolOfTopics(ids){
  var out=[], lbl;
  (ids||[]).forEach(function(tid){
    lbl=topicLabelById(tid);
    validQs(S.bank[tid]).forEach(function(q){ q._topic=lbl; out.push(q); });
  });
  return out;
}
function shuffled(a){
  var x=a.slice();
  for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; }
  return x;
}

/* ตารางสัดส่วน + เตือนวิชาที่ข้อสอบไม่พอ */
function mockPlanHTML(){
  var rows="", short=0;
  MOCK_PLAN.forEach(function(p){
    var have=poolOf(p.k).length, ok=have>=p.n;
    if(!ok) short += (p.n-have);
    rows+='<tr>'+
      '<td style="padding:5px 8px;">'+esc(sName[p.k]||p.k)+'</td>'+
      '<td style="padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums;">'+p.n+'</td>'+
      '<td style="padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums;color:'+(ok?"var(--c-text-muted)":"var(--pri)")+';">'+have+'</td>'+
      '<td style="padding:5px 8px;text-align:right;font-weight:700;color:'+(ok?"#1E9E5A":"var(--pri)")+';">'+
        (ok?"พอ":"ขาด "+(p.n-have))+'</td></tr>';
  });
  return '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12.5px;">'+

/* สุ่มชุดข้อสอบ */
/* สร้างชุดข้อสอบ (สำหรับพิมพ์ PDF) จากสายสอบ — ใช้สัดส่วนตามภาคเหมือนสอบจริง */
function buildTrackMock(id){
  var tr=(S.mockTracks||{})[id];
  if(!tr) return { items:[], gaps:[], at:new Date(), mockSet:true, label:"" };
  var st=trackStat(tr);
  return { items:buildTrackItems(tr),
           gaps:st.gaps.map(function(g){ return { subj:g.label||sName[g.k]||g.k, want:g.want, got:g.got }; }),
           at:new Date(), mockSet:true, _track:id,
           label:(tr.name||"เสมือนจริง")+" · ข้อสอบเสมือนจริง "+st.need+" ข้อ" };
}
function buildMock(){
  var items=[], gaps=[];
  MOCK_PLAN.forEach(function(p){
    var pool=poolOf(p.k), take=Math.min(p.n, pool.length);
    if(take<p.n) gaps.push({ subj:sName[p.k]||p.k, want:p.n, got:take });
    shuffled(pool).slice(0,take).forEach(function(q){
      q._subj = sName[p.k]||p.k;
      items.push(q);
    });
  });
  return { items:items, gaps:gaps, at:new Date(), mockSet:true,
           label:"ข้อสอบเสมือนจริง นายสิบตำรวจ รุ่น 18" };
}

/* ══════════ ข้อสอบเสมือนจริงรายสาย (สายปราบปราม / สายอำนวยการ) ══════════
   สัดส่วนวิชาแต่ละสายมาจาก questions.json (mockTracks) — ครูแก้จำนวนข้อ/รูปได้โดยไม่ต้องแตะโค้ด */
/* แผนสอบมี 2 แบบ: แบ่งภาค (sections → parts) หรือแบบเรียบ (plan) — แปลงเป็นรายการส่วนย่อยแบน ๆ พร้อมข้อมูลภาค */
function trackParts(tr){
  if(tr && tr.sections){
    var out=[];
    tr.sections.forEach(function(s,si){
      (s.parts||[]).forEach(function(p){
        out.push({ k:p.k, n:p.n, label:p.label||sName[p.k]||p.k, sect:si, sectName:s.name||("ภาค "+(si+1)), pass:s.pass||0, groups:p.groups });
      });
    });
    return out;
  }
  return ((tr&&tr.plan)||[]).map(function(p){ return { k:p.k, n:p.n, label:sName[p.k]||p.k, sect:0, sectName:"", pass:0 }; });
}
/* ข้อมูลภาคสำหรับคิดคะแนนแยกภาค (คืน null ถ้าเป็นแผนแบบเรียบ) */
function trackSections(tr){
  if(!(tr&&tr.sections)) return null;
  return tr.sections.map(function(s){
    return { name:s.name, pass:s.pass||0,
             total:(s.parts||[]).reduce(function(a,p){ return a+p.n; },0),
             parts:(s.parts||[]).map(function(p){ return { label:p.label||sName[p.k]||p.k, n:p.n }; }) };
  });
}
function trackStat(tr){
  var need=0, have=0, gaps=[];
  trackParts(tr).forEach(function(p){
    if(p.groups){   // ส่วนย่อยที่กำหนดสัดส่วนระดับหัวข้อ (เช่น 2.1 Office 60% + อื่น ๆ 40%)
      p.groups.forEach(function(g){ var pl=poolOfTopics(g.topics).length, take=Math.min(g.n,pl);
        need+=g.n; have+=take; if(take<g.n) gaps.push({k:p.k, label:p.label, want:g.n, got:take}); });
    } else {
      var pool=poolOf(p.k).length, take=Math.min(p.n,pool);
      need+=p.n; have+=take; if(take<p.n) gaps.push({k:p.k, label:p.label, want:p.n, got:take});
    }
  });
  return { need:need, have:have, gaps:gaps };
}
function buildTrackItems(tr){
  var items=[];
  trackParts(tr).forEach(function(p){
    var picked;
    if(p.groups){   // ดึงตามสัดส่วนแต่ละกลุ่มหัวข้อ แล้วคละเข้าด้วยกัน
      picked=[];
      p.groups.forEach(function(g){ var pool=poolOfTopics(g.topics); picked=picked.concat(shuffled(pool).slice(0,Math.min(g.n,pool.length))); });
      picked=shuffled(picked);
    } else {
      var pool=poolOf(p.k); picked=shuffled(pool).slice(0,Math.min(p.n,pool.length));
    }
    picked.forEach(function(qq){
      var o={}; for(var kk in qq){ if(Object.prototype.hasOwnProperty.call(qq,kk)) o[kk]=qq[kk]; }
      o._subj=p.label; o._sect=p.sect; o._sectName=p.sectName;   // ติดป้ายภาค/ส่วนไว้ตอนคิดคะแนนแยกภาค
      items.push(o);
    });
  });
  return items;
}

/* ── ดึงข้อสอบเป็นไฟล์เอง: เลือกได้หลายวิชา/หลายหัวข้อ + จำนวนข้อต่อวิชา (มีผลแค่ไฟล์นี้ ไม่แตะนักเรียน) ── */
function pickSubCfg(sk){ S.pickSubs=S.pickSubs||{}; if(!S.pickSubs[sk]) S.pickSubs[sk]={on:false,exp:false,n:20}; return S.pickSubs[sk]; }
function pickTopicOn(tid){ return !((S.pickOff||{})[tid]); }
function pickSubPool(sk){
  var out=[];
  (S.topics[sk]||[]).forEach(function(t){
    if(!pickTopicOn(t.id)) return;
    validQs(S.bank[t.id]).forEach(function(q){ q._topic=t.label; out.push(q); });
  });
  return out;
}
function pickSubSel(sk){ var sel=0,tot=0; (S.topics[sk]||[]).forEach(function(t){ if(validQs(S.bank[t.id]).length){ tot++; if(pickTopicOn(t.id)) sel++; } }); return {sel:sel,tot:tot}; }
function buildPick(){
  var items=[], gaps=[], order=(S.pickOrder==="bank"?"bank":"rand"), labels=[];
  subjects().forEach(function(su){
    var cfg=(S.pickSubs||{})[su.k];
    if(!cfg || !cfg.on) return;
    var pool=pickSubPool(su.k);
    if(!pool.length) return;
    var want=Math.max(1, parseInt(cfg.n,10)||10), take=Math.min(want, pool.length);
    if(take<want) gaps.push({ subj:sName[su.k]||su.k, want:want, got:take });
    var picked=(order==="bank"?pool.slice(0,take):shuffled(pool).slice(0,take));
    picked.forEach(function(q){ q._subj=sName[su.k]||su.k; items.push(q); });
    labels.push((sName[su.k]||su.k)+" "+take);
  });
  return { items:items, gaps:gaps, at:new Date(), label:"ไฟล์ข้อสอบ"+(labels.length?" — "+labels.join(" · "):"") };
}
function pickApply(){ save(); var el=document.getElementById("pickbuilder"); if(el){ el.outerHTML=pickFormHTML(); } else { renderOverlays(); } }   // อัปเดตหลังคลิก: วาดใหม่เฉพาะกล่องตัวสร้างไฟล์ (ไม่วาดแผงแอดมินทั้งแผง/หน้าหลัก) — เบาสุด กันค้างบนมือถือ

    var head='<div onclick="A.pickHead(\''+su.k+'\')" style="display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;">'+ckSub+'<div style="flex:1;min-width:0;font-size:14px;font-weight:'+(cfg.on?'700':'500')+';'+(cfg.on?'':'color:var(--c-text-muted);')+'">'+esc(short(su.k))+(cfg.on?' <span style="font-size:10.5px;color:var(--c-text-subtle);font-weight:400;">('+sc.sel+'/'+sc.tot+' หัวข้อ)</span>':'')+'</div>'+nInput+'<div style="flex:none;font-size:11px;color:var(--c-text-subtle);width:14px;text-align:center;">'+(cfg.on?(cfg.exp?'▲':'▼'):'')+'</div></div>';
    var body="";

/* ───── ปฏิทินวางแผนล่วงหน้า ───── */
function planEmoji(t){ return t==="study"?"📖":t==="quiz"?"📝":"🏃"; }
function toMin(hhmm){ var p=String(hhmm).split(":"); return (Number(p[0])||0)*60+(Number(p[1])||0); }
function fmtMMSS(ms){ ms=Math.max(0,ms); var s=Math.round(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
/* งานที่ "ตอนนี้ควรทำ" = งานที่ยังไม่เสร็จซึ่งถึงเวลาแล้วล่าสุด ถ้ายังไม่ถึงเวลาไหนเลย = งานถัดไป */
function currentTaskIdx(tasks){
  var nowM=(function(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); })();
  var cur=-1, curT=-1, next=-1, nextT=1e9, firstND=-1;
  tasks.forEach(function(t,i){
    if(t.done) return;
    if(firstND<0) firstND=i;
    if(!t.time) return;
    var m=toMin(t.time);
    if(m<=nowM){ if(m>=curT){ curT=m; cur=i; } }
    else if(m<nextT){ nextT=m; next=i; }
  });
  return cur>=0?cur:(next>=0?next:firstND);
}
/* จำนวนวันติดกันที่ทำแผนครบทุกงาน (นับถึงวันนี้ ถ้าวันนี้ยังไม่ครบก็ไม่ตัด นับต่อจากเมื่อวาน) */
function computeStreak(){
  var n=0;
  for(var i=0;i<400;i++){
    var dt=new Date(); dt.setHours(0,0,0,0); dt.setDate(dt.getDate()-i);
    var tasks=(S.plan||{})[iso(dt)]||[];
    var complete=tasks.length>0 && tasks.every(function(t){ return t.done; });
    if(complete) n++;
    else if(i===0) continue;   // วันนี้ยังทำไม่ครบ ไม่ถือว่าขาด
    else break;
  }
  return n;
}
/* จับเวลาโฟกัส (Pomodoro) — เดินทุกวินาที อัปเดตเฉพาะตัวเลข ไม่วาดใหม่ทั้งหน้า */
function focusTick(){
  if(!S.focus || S.focus.paused) return;
  var remain=S.focus.endTs-Date.now();
  if(remain>0){ var el=document.getElementById("focusTime"); if(el) el.textContent=fmtMMSS(remain); return; }   // ไม่มีการ์ดบนจอ = อยู่แท็บอื่น อย่าวาดใหม่ทั้งแอป (กันกระตุก)
  if(navigator.vibrate){ try{ navigator.vibrate([120,60,120]); }catch(e){} }
  if(S.focus.mode==="work"){ S.focus={label:S.focus.label, mode:"break", endTs:Date.now()+5*60000, paused:false}; toast("ครบ 25 นาที! พัก 5 นาที ☕"); render(); }
  else { S.focus=null; toast("จบ 1 รอบโฟกัส เก่งมาก! 🎉"); render(); }
}

/* ───── แจ้งเตือนตามแผน: เสียง + เด้งป๊อปอัป ───── */
var _audioCtx=null;
function unlockAudio(){ try{ if(!_audioCtx){ var AC=window.AudioContext||window.webkitAudioContext; if(AC) _audioCtx=new AC(); } if(_audioCtx && _audioCtx.state==="suspended") _audioCtx.resume(); }catch(e){} }
function playAlarmSound(){
  try{ unlockAudio(); var ctx=_audioCtx; if(!ctx) return;
    var beep=function(freq,start,dur){ var o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine"; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
      var t0=ctx.currentTime+start; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.35,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.start(t0); o.stop(t0+dur+0.03); };
    beep(880,0,0.2); beep(1175,0.24,0.2); beep(880,0.5,0.3);   // บี๊บ 3 จังหวะ
  }catch(e){}
}
var _alerted={};
function checkAlarms(){
  if(S.alarm || S.quiz || S.mock) return;                     // มีป๊อปอัปค้าง/กำลังทำข้อสอบ อย่ารบกวน
  var t=iso(today0()), tasks=(S.plan||{})[t]||[];
  var now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  for(var i=0;i<tasks.length;i++){ var tk=tasks[i]; if(tk.done||!tk.time) continue;
    var m=toMin(tk.time);
    if(nowMin>=m && nowMin<=m+1){ var key=t+"#"+tk.time+"#"+tk.label; if(_alerted[key]) continue; _alerted[key]=1; fireAlarm(t,i,tk); return; }
  }
}
function fireAlarm(isoD,idx,task){
  S.alarm={label:task.label, iso:isoD, idx:idx, time:task.time};
  playAlarmSound();
  if(navigator.vibrate){ try{ navigator.vibrate([300,120,300,120,400]); }catch(e){} }
  if(window.Notification && Notification.permission==="granted"){ try{ new Notification("⏰ ถึงเวลาทำตามแผน", {body:task.time+" น. · "+task.label, tag:"nst18plan"}); }catch(e){} }
  render();
}

function loadYTApi(cb){                          // โหลด YouTube IFrame API ครั้งเดียว
  if(window.YT && window.YT.Player){ _ytApiReady=true; cb&&cb(); return; }
  function poll(){ if(window.YT && window.YT.Player){ _ytApiReady=true; cb&&cb(); return true; } return false; }
  if(_ytApiLoading){ var t=setInterval(function(){ if(poll()) clearInterval(t); },120); return; }
  _ytApiLoading=true;
  var s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s);
  var t2=setInterval(function(){ if(poll()) clearInterval(t2); },120);

var _feedObs=null, _feedActiveId=null;
function destroyFeedObs(){ if(_feedObs){ try{ _feedObs.disconnect(); }catch(e){} _feedObs=null; } feedDestroyPlayers(); _feedActiveId=null; }
function mountFeed(){                          // เล่นคลิปที่อยู่ในจออัตโนมัติ + หยุดคลิปที่เลื่อนพ้น
  var scroll=document.getElementById("feedScroll");
  if(!scroll){ destroyFeedObs(); return; }
  if(scroll.getAttribute("data-obs")==="1") return;   // ตั้ง observer แล้วสำหรับ DOM ชุดนี้
  destroyFeedObs(); scroll.setAttribute("data-obs","1");
  if(!("IntersectionObserver" in window)) return;
  _feedObs=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(en.isIntersecting && en.intersectionRatio>=0.6){
        var id=en.target.getAttribute("data-vid"), yt=en.target.getAttribute("data-yt");
        if(_feedActiveId===id) return;
        if(_feedActiveId) feedRevert(document.getElementById("fp-"+_feedActiveId));
        feedMountIframe(document.getElementById("fp-"+id), yt);
        _feedActiveId=id;
      }
    });
  },{root:scroll,threshold:0.6});
  [].forEach.call(scroll.querySelectorAll(".feedpage"), function(p){ _feedObs.observe(p); });
  var pgs=scroll.querySelectorAll(".feedpage");   // เล่นคลิปแรกที่เห็นทันที (กัน observer เริ่มช้า)
  if(pgs.length){ var f=pgs[0], id0=f.getAttribute("data-vid"), yt0=f.getAttribute("data-yt"); feedMountIframe(document.getElementById("fp-"+id0),yt0); _feedActiveId=id0; }

function renderOverlays(){

  var keep=[].map.call(o.querySelectorAll(".sheetbody"), function(el){ return el.scrollTop; });
  var h="";
  if(S.quiz) h+=quizSheet();
  if(S.quiz && S.quizConfirm && S.quiz.status==="active") h+=quizConfirmSheet();
  if(S.feed && studyOpen()) h+=feedSheet();
  if(S.adminOpen) h+=adminSheet();
  if(S.mock) h+=mockSheet();
  if(S.trackDetail) h+=trackDetailSheet();
  if(S.histTrack) h+=historySheet();
  if(S.reviewAtt) h+=reviewSheet();
  if(S.shopDetail && shopOpen()) h+=shopDetailSheet();
  if(S.shopSampleIdx!=null && S.shopDetail && shopOpen()) h+=shopSampleSheet();
  if(S.planOpen) h+=planSheet();
  if(S.alarm) h+=alarmSheet();

  [].forEach.call(o.querySelectorAll(".sheetbody"), function(el,i){
    if(keep[i]) el.scrollTop=keep[i];
  });
}

        '<div class="pq-t"><span class="pq-n">'+(i+1)+'.</span><span>'+mrender(q.q).replace(/\n/g,"<br>")+'</span></div>'+

            /* ข้อสอบรูปภาพ ตัวเลือกเป็นตัวอักษร A–D อยู่ในตัวมันเองแล้ว ใช้ c ตรง ๆ

        '<span style="flex:none;font-size:12px;font-weight:800;color:#fff;background:'+col+';border-radius:999px;padding:3px 12px;white-space:nowrap;">'+(s.ok?"ผ่าน ✓":"ตก ✗")+'</span>'+
      '</div>'+
      '<div style="display:flex;align-items:baseline;gap:8px;margin:6px 0 8px;"><span class="mono" style="font-size:24px;font-weight:800;color:'+col+';">'+s.got+' / '+s.total+'</span>'+
        '<span style="font-size:12px;color:var(--c-text-muted);">('+pct+'%) · เกณฑ์ผ่าน ≥ '+s.pass+' ข้อ</span></div>'+
      '<div style="border-top:1px dashed var(--c-border);padding-top:6px;">'+rows+'</div>'+

  var up="";

    var weak=null;

  return '<div>'+head+cards+up+'</div>';
}
/* ═══════════ ประวัติการทำข้อสอบ 150 ข้อ + ทบทวนข้อผิด ═══════════ */
function qfp(s){ s=String(s||""); var h=5381,i=s.length; while(i){ h=(h*33)^s.charCodeAt(--i); } return (h>>>0).toString(36); }
function saveMockAttempt(q){
  var items=[];
  for(var i=0;i<q.questions.length;i++){ var qq=q.questions[i];
    items.push({ fp:qfp(qq.q), subj:qq._subj||qq._topic||"อื่น ๆ", pick:(q.picked[i]==null?-1:q.picked[i]), ans:qq.answer }); }
  var att={ ts:Date.now(), track:q._track, correct:q.correct, total:q.questions.length, pct:q.pct, passed:!!q.passed,
            usedMs:(q.totalMs||0)-Math.max(0,(q.deadline||0)-Date.now()),
            sections:(q.sectResult||[]).map(function(s){ return {name:s.name,got:s.got,total:s.total,pass:s.pass,ok:s.ok}; }),
            items:items };
  var hist=Object.assign({},S.mockHist||{});
  var arr=(hist[q._track]||[]).slice(); arr.unshift(att); if(arr.length>15) arr=arr.slice(0,15);
  hist[q._track]=arr; set({mockHist:hist});
}
function bankFpMap(){ var m={},bk=S.bank||{}; for(var k in bk){ if(!bk[k]) continue; for(var i=0;i<bk[k].length;i++){ var qq=bk[k][i]; if(qq&&qq.q){ var f=qfp(qq.q); if(!(f in m)) m[f]=qq; } } } return m; }
function relDate(ts){ var d=new Date(ts), DAY=86400000, hm=(""+d.getHours()).padStart(2,"0")+":"+(""+d.getMinutes()).padStart(2,"0");
  var a=new Date(ts); a.setHours(0,0,0,0); var b=new Date(); b.setHours(0,0,0,0); var days=Math.round((b-a)/DAY);
  if(days<=0) return "วันนี้ "+hm; if(days===1) return "เมื่อวาน "+hm; if(days<7) return days+" วันก่อน"; return d.getDate()+"/"+(d.getMonth()+1)+" "+hm; }
function fmtDur(ms){ var m=Math.round(ms/60000); return m<60?(m+" นาที"):(Math.floor(m/60)+":"+(""+(m%60)).padStart(2,"0")+" ชม."); }
function _deltaChip(dp){ if(!isFinite(dp)||dp===0) return ""; var up=dp>0; return '<span style="font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;margin-left:4px;'+(up?"background:#E7F6EE;color:#12833f;":"background:#FDECEC;color:#B01515;")+'">'+(up?"▲ ":"▼ ")+Math.abs(dp)+'%</span>'; }
function _wrongCount(att){ return (att.items||[]).filter(function(it){return it.pick!==it.ans;}).length; }
function _secBars(att){ if(!att.sections||!att.sections.length) return "";
  return '<div style="margin-top:14px;display:flex;flex-direction:column;gap:11px;">'+att.sections.map(function(s){
    var pctW=s.total?Math.round(s.got/s.total*100):0, thr=s.total?Math.round(s.pass/s.total*100):60;
    return '<div><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;"><b style="font-weight:700;">'+esc(s.name)+'</b><span style="font-weight:800;color:'+(s.ok?"#1E9E5A":"var(--pri)")+';">'+s.got+' / '+s.total+'</span></div>'+
      '<div style="height:10px;background:#EFF1F4;border-radius:99px;position:relative;"><div style="height:100%;border-radius:99px;width:'+pctW+'%;background:'+(s.ok?"#1E9E5A":"var(--pri)")+';"></div>'+
        '<div style="position:absolute;top:-3px;bottom:-3px;width:2px;background:#9AA0A6;left:'+thr+'%;" title="เกณฑ์"></div></div></div>';
  }).join("")+'</div>'; }
function _secSummary(att){ return (att.sections||[]).map(function(s){ return s.name.replace(/ .*/,"")+" "+s.got+"/"+s.total; }).join(" · "); }
function _trendSVG(arr){ var pts=arr.slice(0,6).reverse(); var n=pts.length; if(n<2) return "";
  var w=280,hh=60, xs=function(i){return 10+i*(w-20)/(n-1);}, ys=function(p){return hh-6-(p/100)*(hh-14);};
  var poly=pts.map(function(a,i){return xs(i).toFixed(0)+","+ys(a.pct).toFixed(0);}).join(" ");
  var dots=pts.map(function(a,i){ var last=i===n-1; return '<circle cx="'+xs(i).toFixed(0)+'" cy="'+ys(a.pct).toFixed(0)+'" r="'+(last?4.5:3.5)+'" fill="'+(a.passed?"#1E9E5A":"#E4111F")+'"'+(last?' stroke="#fff" stroke-width="2"':'')+'/>'; }).join("");
  return '<div style="background:var(--c-surface);border-radius:16px;padding:13px 14px;margin-bottom:13px;">'+
    '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--c-text-muted);font-weight:600;margin-bottom:6px;"><span>พัฒนาการคะแนน</span><span>เส้นประ = ผ่าน 60%</span></div>'+
    '<svg width="100%" height="60" viewBox="0 0 280 60" preserveAspectRatio="none"><line x1="0" y1="'+ys(60).toFixed(0)+'" x2="280" y2="'+ys(60).toFixed(0)+'" stroke="#C9CDD3" stroke-width="1.5" stroke-dasharray="4 4"/><polyline points="'+poly+'" fill="none" stroke="#E4111F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg></div>'; }

      '<div style="flex:1;min-width:0;"><span style="display:inline-flex;gap:5px;font-size:15px;font-weight:800;padding:4px 12px;border-radius:99px;'+(last.passed?"background:#E7F6EE;color:#12833f;":"background:#FDECEC;color:#B01515;")+'">'+(last.passed?"✓ ผ่าน":"✕ ไม่ผ่าน")+'</span>'+

      h+='<div onclick="A.openReview('+i+',\'wrong\')" style="display:flex;align-items:center;gap:11px;background:var(--c-surface);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.04);">'+

        '<span style="font-size:16px;font-weight:800;color:'+(a.passed?"#1E9E5A":"var(--c-text)")+';">'+a.pct+'%</span><span style="color:#C4C9CF;font-size:13px;">›</span></div>'; } }
  return h+'</div></div></div>';

function reviewSheet(){

  var subjCount={}; items.forEach(function(it){ subjCount[it.subj]=(subjCount[it.subj]||0)+1; });
  var shown=items.filter(function(it){ if(filt==="all") return true; if(filt==="star") return (S.starred||{})[it.fp]; return it.subj===filt; });

    '<div class="sheetbody">';

    if(top.length) h+='<div style="background:#FFF7E9;border:1px solid #F3D98C;border-radius:12px;padding:10px 12px;font-size:12px;color:#8A6400;line-height:1.5;margin-bottom:12px;">💡 พลาดบ่อย: '+top.map(function(s){return '<b>'+esc(s)+' ('+subjCount[s]+')</b>';}).join(' · ')+'</div>'; }

    h+='<div style="font-size:10px;font-weight:800;color:var(--pri);">'+esc(it.subj)+'</div><div style="font-size:13.5px;font-weight:600;line-height:1.55;margin:5px 0 '+(qq.img?"4px":"9px")+';">'+mfrac(qq.q).replace(/\n/g,"<br>")+'</div>';
    if(qq.img) h+=imgHTML(qq.img,240)+'<div style="height:9px;"></div>';   // รูปโจทย์ (ดึงจากคลังตอนเปิด ไม่กินพื้นที่เก็บประวัติ)

  return h+'</div></div></div>';

function quizPickerSheet(){
  var q=S.quiz; if(!q) return "";
  var total=q.questions.length, answered=q.picked.filter(function(x){ return x!=null; }).length;
  function cell(i){
    var isCur=i===q.idx, isAns=q.picked[i]!=null;
    var bg=isCur?"var(--pri)":(isAns?"#FFF6F6":"var(--c-surface)");
    var col=isCur?"#fff":(isAns?"var(--pri)":"var(--c-text-subtle)");
    var bd=isCur?"var(--pri)":(isAns?"var(--pri)":"var(--c-border)");
    return '<button onclick="A.pickJump('+i+')" class="mono" aria-label="ข้อ '+(i+1)+(isAns?" ตอบแล้ว":" ยังไม่ตอบ")+'" '+
      'style="aspect-ratio:1;border-radius:9px;border:1.4px solid '+bd+';background:'+bg+';color:'+col+';font-size:13px;font-weight:700;cursor:pointer;padding:0;">'+(i+1)+'</button>';
  }
  var groups="";
  if(q.mockSections){
    var start={}, cnt={};
    for(var i=0;i<q.questions.length;i++){ var s=q.questions[i]._sect||0; if(start[s]==null) start[s]=i; cnt[s]=(cnt[s]||0)+1; }
    groups=q.mockSections.map(function(sec,si){
      if(start[si]==null) return "";
      var s0=start[si], n=cnt[si], ans=0, cells="";
      for(var j=s0;j<s0+n;j++){ if(q.picked[j]!=null) ans++; cells+=cell(j); }
      return '<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;">'+
          '<span style="font-size:12px;font-weight:800;">'+esc(sec.name)+' <span style="color:var(--c-text-subtle);font-weight:600;">(ข้อ '+(s0+1)+'–'+(s0+n)+')</span></span>'+
          '<span style="font-size:10.5px;font-weight:700;color:var(--c-text-muted);white-space:nowrap;">ตอบแล้ว '+ans+'/'+n+'</span></div>'+
        '<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px;">'+cells+'</div>';
    }).join("");
  } else {
    var cc=""; for(var k=0;k<q.questions.length;k++) cc+=cell(k);
    groups='<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px;">'+cc+'</div>';
  }
  var nextUn=-1;
  for(var m=0;m<q.picked.length;m++){ var idx=(q.idx+1+m)%q.picked.length; if(q.picked[idx]==null){ nextUn=idx; break; } }
  function lg(bg,bd,tx){ return '<span><span style="display:inline-block;width:13px;height:13px;border-radius:5px;background:'+bg+';border:1.4px solid '+bd+';vertical-align:-2px;margin-right:4px;"></span>'+tx+'</span>'; }
  return '<div class="sheet"><div class="sheetin" style="border-radius:24px 24px 0 0;background:var(--c-surface);">'+
    '<div class="sheethead" style="align-items:flex-start;">'+
      '<div style="min-width:0;"><div style="font-size:15px;font-weight:800;">เลือกข้อ</div>'+
        '<div style="font-size:11.5px;color:var(--c-text-muted);">ตอบแล้ว '+answered+' · เหลือ '+(total-answered)+'</div></div>'+
      '<button class="x" onclick="A.closeQuizPicker()">✕</button>'+
    '</div>'+
    '<div class="sheetbody">'+
      (nextUn>=0
        ? '<button class="btn" style="width:100%;margin-bottom:8px;" onclick="A.pickJump('+nextUn+')">→ ไปข้อถัดไปที่ยังไม่ตอบ (ข้อ '+(nextUn+1)+')</button>'
        : '<div style="text-align:center;font-size:13px;color:#1E9E5A;font-weight:700;padding:8px 0 4px;">✓ ตอบครบทุกข้อแล้ว</div>')+
      '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--c-text-muted);margin:6px 0 2px;">'+
        lg('#FFF6F6','var(--pri)','ตอบแล้ว')+lg('var(--pri)','var(--pri)','ข้อปัจจุบัน')+lg('var(--c-surface)','var(--c-border)','ยังไม่ตอบ')+'</div>'+
      groups+
    '</div></div></div>';
}

/* ═══════════ รูปภาพประกอบโจทย์ ═══════════
   เก็บรูปเป็น data URI ฝังใน questions.json เลย → อัปโหลดไฟล์เดียวจบ
   และนักเรียนได้รูปติดเครื่องไปด้วย เปิดออฟไลน์เห็นรูปแน่นอน
   ย่อ+บีบอัดก่อนเก็บเสมอ ไม่งั้นไฟล์บวมจนโหลดไม่ไหว */
var IMG_MAX = 900;          // ด้านยาวสุด (px)
var _imgTarget = null;

function pickImage(t, i){
  _imgTarget = {t:t, i:i};
  var el = document.getElementById("imgfile");
  if(!el) return;
  el.value = "";
  el.click();
}
function onImageFile(el){
  var f = el.files && el.files[0];
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast("ไฟล์นี้ไม่ใช่รูปภาพ"); return; }
  var r = new FileReader();
  r.onload = function(){
    var im = new Image();
    im.onload = function(){
      var s = Math.min(1, IMG_MAX/im.width, IMG_MAX/im.height);
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.width*s));
      c.height = Math.max(1, Math.round(im.height*s));
      var x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height);   // พื้นโปร่งใสจะกลายเป็นดำถ้าไม่รองพื้นขาว
      x.drawImage(im, 0, 0, c.width, c.height);
      var url = c.toDataURL("image/webp", 0.8);
      if(url.indexOf("data:image/webp") !== 0) url = c.toDataURL("image/jpeg", 0.75);
      setDraftImage(url);
      toast("ใส่รูปแล้ว · " + kb(url) + " KB");
    };
    im.onerror = function(){ toast("เปิดไฟล์รูปไม่สำเร็จ"); };
    im.src = r.result;
  };
  r.onerror = function(){ toast("อ่านไฟล์ไม่สำเร็จ"); };
  r.readAsDataURL(f);
}
function setDraftImage(url){
  var d = S.adminDraft, t = _imgTarget;
  if(!d || !t) return;
  if(t.t === "q") d.img = url;
  else if(t.t === "x") d.ximg = url;
  else if(t.t === "c"){ d.cimg = d.cimg || ["","","",""]; d.cimg[t.i] = url; }
  render();
}
function delDraftImage(t, i){
  var d = S.adminDraft;
  if(!d) return;
  if(t === "q") d.img = "";
  else if(t === "x") d.ximg = "";
  else if(t === "c" && d.cimg) d.cimg[i] = "";
  render();
}
function kb(s){ return Math.round((s ? s.length : 0) * 0.75 / 1024); }
function imgHTML(src, max){
  if(!src) return "";
  /* eager (ไม่ lazy) — รูปเป็น data URI ฝังในไฟล์อยู่แล้ว การ lazy ทำให้รูปที่อยู่ล่าง ๆ ไม่ถูกพิมพ์ลง PDF (โหลดเฉพาะตอนเลื่อนเห็น) */
  return '<img src="'+esc(src)+'" alt="รูปประกอบโจทย์" loading="eager" decoding="sync" '+
    'style="display:block;max-width:100%;max-height:'+(max||260)+'px;margin:8px 0;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface);break-inside:avoid;page-break-inside:avoid;">';
}

/* ═══════════ ACTIONS ═══════════ */
var A={
  tab:function(k){ if(S.player){ destroyPlayer(); S.player=null; } set({tab:k}); document.getElementById("view").scrollTop=0; },
