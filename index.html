<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผู้ช่วยเตรียมสอบ นสต. รุ่น 18</title>
<meta name="theme-color" content="#A40001">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="นสต.18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pri:#E4111F; --priD:#B60D18;
    /* โทนกลางวัน (ค่าเดิมของแอป — กลางวันหน้าตาเหมือนเดิมทุกจุด) */
    --c-bg:#F4F6FA;
    --c-surface:#FFFFFF;
    --c-border:#E4E5E7;
    --c-text:#0E0F12;
    --c-text-muted:#6E7378;
    --c-text-subtle:#9AA0A8;
    --c-on-brand:#FFFFFF;
    --c-navpill:#FFFFFF;
    --ec-dim:0;              /* ชั้นหรี่แสง 0–0.55 */
  }
  /* โทนกลางคืน — พื้นอุ่นถนอมสายตา */
  [data-theme="night"]{
    color-scheme:dark;
    --c-bg:#1A1A1C;
    --c-surface:#242427;
    --c-border:#35353A;
    --c-text:#E8E6E3;
    --c-text-muted:#A3A099;
    --c-text-subtle:#7A776F;
    --c-on-brand:#F4EFEA;
    --c-navpill:#ECE7DE;
  }
  body{ transition:background-color .2s ease, color .2s ease; }

  /* ───── โหมดถนอมสายตา: ปุ่ม + แผงตั้งค่า + ชั้นหรี่แสง ───── */
  .ec-toggle{ flex:none; width:34px; height:34px; border-radius:10px; border:1px solid var(--c-border);
    background:var(--c-surface); color:var(--c-text); font-size:16px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s; }
  .ec-toggle:active{ transform:scale(.92); }
  .ec-statusgroup{ display:flex; align-items:center; gap:10px; }
  .ec-panel{ position:fixed; z-index:2147483600; top:52px; right:14px; width:250px; max-width:calc(100vw - 28px);
    background:var(--c-surface); color:var(--c-text); border:1px solid var(--c-border); border-radius:16px;
    box-shadow:0 14px 40px rgba(0,0,0,.28); padding:14px 16px; }
  .ec-panel[hidden]{ display:none !important; }
  .ec-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .ec-row + .ec-row{ margin-top:16px; }
  .ec-row .lbl2{ font-size:13px; font-weight:600; color:var(--c-text); }
  .ec-row .sub2{ font-size:11px; color:var(--c-text-subtle); margin-top:2px; }
  .ec-switch{ flex:none; width:46px; height:28px; border-radius:999px; border:none; cursor:pointer;
    background:var(--c-border); position:relative; transition:background .18s ease; }
  .ec-switch[aria-checked="true"]{ background:var(--pri); }
  .ec-switch::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
    background:var(--c-surface); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .18s ease; }
  .ec-switch[aria-checked="true"]::after{ left:21px; }
  .ec-dimrow{ flex-direction:column; align-items:stretch; }
  .ec-dimhead{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .ec-dimval{ font-size:12px; font-weight:600; color:var(--c-text-subtle); font-variant-numeric:tabular-nums; }
  .ec-range{ -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:999px;
    background:var(--c-border); outline:none; cursor:pointer; }
  .ec-range::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--pri); border:2px solid var(--c-surface); cursor:pointer; }
  .ec-range::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:var(--pri);
    border:2px solid var(--c-surface); cursor:pointer; }
  .ec-toggle:focus-visible, .ec-switch:focus-visible, .ec-range:focus-visible{ outline:2px solid var(--pri); outline-offset:2px; }
  /* ชั้นหรี่แสง: ทับทั้งจอ ไม่รับคลิก อยู่ใต้แผงตั้งค่าเพื่อให้ปรับสไลเดอร์ได้ชัด */
  .ec-dimlayer{ position:fixed; inset:0; pointer-events:none; z-index:2147483000;
    background:rgb(0 0 0 / var(--ec-dim)); transition:background-color .2s ease; }
  @media (prefers-reduced-motion:reduce){
    .ec-toggle,.ec-switch,.ec-switch::after,.ec-dimlayer,body{ transition:none !important; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; min-height:100%; }
  body{
    font-family:'Anuphan',system-ui,sans-serif; color:var(--c-text); background:var(--c-bg);
    -webkit-text-size-adjust:100%;
  }
  input,select,textarea,button{ font-family:inherit; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .np-scroll::-webkit-scrollbar{ width:0; }
  @keyframes flipIn{ from{ transform:rotateX(-88deg); opacity:0; } to{ transform:rotateX(0); opacity:1; } }
  @keyframes fadeUp{ from{ transform:translateY(8px); opacity:0; } to{ transform:none; opacity:1; } }

  /* โครงหน้าจอ — เต็มจอบนมือถือ, จัดกลางบนคอม */
  .shell{ max-width:460px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; background:var(--c-bg); }
  .statusbar{ flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 22px;
    height:46px; padding-top:env(safe-area-inset-top); box-sizing:content-box; }
  /* โลโก้ + ชื่อสถาบัน มุมซ้ายบน = ปุ่มเข้าแผงแอดมิน */
  .brandtap{ display:flex; align-items:center; gap:9px; cursor:pointer; border:none; background:none;
    padding:0; border-radius:11px; transition:transform .12s ease; }
  .brandtap img{ width:34px; height:34px; border-radius:10px; display:block; box-shadow:0 3px 10px rgba(164,0,1,.28); }
  .brandname{ font-size:11px; font-weight:700; letter-spacing:.11em; color:#A40101; white-space:nowrap; }
  .brandtap:active{ transform:scale(.9); }
  .brandtap:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--pri); }
  .tabhead{ flex:none; padding:6px 20px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .kicker{ font-size:18px; font-weight:600; letter-spacing:.08em; color:var(--pri); text-transform:uppercase; }
  .tabhead h1{ margin:2px 0 0; font-size:23px; font-weight:700; letter-spacing:-.01em; }
  .cdchip{ text-align:right; color:var(--c-on-brand); border-radius:12px; padding:7px 12px; background:#A40001; flex:none; }
  .view{ flex:1; overflow-y:auto; padding:2px 16px 24px; -webkit-overflow-scrolling:touch; }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  .navwrap{ flex:none; padding:10px 14px calc(14px + env(safe-area-inset-bottom)); position:sticky; bottom:0; background:linear-gradient(180deg,rgba(244,246,250,0) 0%,var(--c-bg) 42%); }
  .navbar{ background:var(--pri); border-radius:999px; display:flex; padding:5px; gap:3px; box-shadow:0 10px 26px rgba(14,15,18,.20); }
  .navbtn{ flex:1; text-align:center; white-space:nowrap; cursor:pointer; border-radius:999px; padding:10px 4px;
    font-size:11.5px; font-weight:600; color:rgba(255,255,255,.80); border:none; background:transparent; transition:background .15s; }
  .navbtn.on{ background:var(--c-navpill); color:var(--pri); font-weight:700; box-shadow:0 2px 6px rgba(14,15,18,.18); }

  .card{ background:var(--c-surface); border:1px solid var(--c-border); border-radius:18px; padding:16px; }
  .card h3{ margin:0; font-size:14px; font-weight:700; }
  .lbl{ font-size:12px; font-weight:600; letter-spacing:.05em; color:var(--c-text-muted); text-transform:uppercase; }
  .muted{ font-size:12px; color:var(--c-text-muted); }
  .btn{ padding:11px 16px; border-radius:11px; border:none; background:var(--pri); color:var(--c-on-brand); font-size:14px; font-weight:700; cursor:pointer; }
  .btn.ghost{ border:1px solid var(--c-border); background:var(--c-surface); color:var(--c-text); font-weight:600; }
  .btn.sm{ padding:6px 12px; font-size:12px; border-radius:9px; font-weight:600; }
  .in{ border:1px solid var(--c-border); border-radius:9px; padding:7px 10px; font-size:14px; background:var(--c-surface); color:var(--c-text); }
  .chip{ font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:999px; white-space:nowrap; }

  /* ───── การแสดงผลสมการคณิตศาสตร์ ───── */
  /* เศษส่วนซ้อนบน-ล่าง */
  .fr{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle;
    margin:0 3px; line-height:1.12; font-size:.9em; position:relative; top:-0.06em; }
  .fr .n{ padding:0 4px 1px; border-bottom:1.4px solid currentColor; }
  .fr .d{ padding:1px 4px 0; }
  .mixw{ vertical-align:middle; margin-right:1px; }
  /* ยกกำลัง / ตัวห้อย */
  .msup{ font-size:.68em; vertical-align:super; line-height:0; margin-left:1px; }
  .msub{ font-size:.68em; vertical-align:sub;   line-height:0; margin-left:1px; }
  /* กรณฑ์ (รากที่สอง) — ขีดบนคลุมทั้งพจน์
     ต้องล็อก line-height ไว้ ไม่งั้นกล่องจะยืดตามข้อความรอบ ๆ แล้วเลขหลุดลงไปใต้ขีด */
  .sq{ display:inline-flex; align-items:stretch; vertical-align:middle; margin:0 2px; line-height:1.15; }
  .sq .rad{ font-size:1.05em; line-height:1.15; align-self:center; margin-right:-1px; }
  .sq .bod{ border-top:1.3px solid currentColor; padding:1px 3px 0 2px; line-height:1.15; }
  .fr, .fr .n, .fr .d{ line-height:1.15; }

  /* ประตูกรอกรหัส */
  .gate{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
    max-width:460px; margin:0 auto; padding:28px 24px calc(28px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,#FFFFFF 0%,#EAEFF6 100%); animation:fadeUp .35s ease-out; }
  .gate h1{ margin:0; font-size:22px; font-weight:700; text-align:center; letter-spacing:-.01em; }
  .gate .sub{ margin:8px 0 24px; font-size:13.5px; color:var(--c-text-muted); text-align:center; line-height:1.55; text-wrap:pretty; }
  /* โลโก้ = ปุ่มเข้าใช้งาน */
  .logobtn{ display:block; margin:18px auto 0; padding:0; border:none; background:none; cursor:pointer;
    border-radius:34px; line-height:0; transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 14px 38px rgba(164,0,1,.32); }
  .logobtn img{ width:154px; height:154px; border-radius:34px; display:block; }
  .logobtn:active{ transform:scale(.94); box-shadow:0 6px 18px rgba(164,0,1,.30); }
  .logobtn:focus-visible{ outline:none; box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--pri); }
  .logobtn.busy{ animation:pulse .5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(.96); } }
  .taphint{ margin:14px 0 0; font-size:13.5px; font-weight:700; color:var(--pri); text-align:center; }
  .codein{ width:100%; border:1.5px solid var(--c-border); border-radius:14px; padding:16px 14px; background:var(--c-surface);
    font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; text-align:center; letter-spacing:.06em; text-transform:uppercase; }
  .codein:focus{ outline:none; border-color:var(--pri); }
  .gate .err{ font-size:13px; color:var(--pri); font-weight:600; margin-top:10px; text-align:center; min-height:19px; white-space:pre-line; line-height:1.5; }
  .gate .note{ font-size:11.5px; color:var(--c-text-subtle); line-height:1.6; margin-top:22px; text-align:center; text-wrap:pretty; }

  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom));
    background:#0E0F12; color:var(--c-on-brand); font-size:13px; font-weight:600; padding:11px 18px; border-radius:999px;
    z-index:90; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:fadeUp .2s ease-out; max-width:88%; text-align:center; }

  .sheet{ position:fixed; inset:0; z-index:60; background:rgba(14,15,18,.5); display:flex; flex-direction:column; justify-content:flex-end; }
  .sheetin{ background:var(--c-bg); border-radius:24px 24px 0 0; max-height:92%; display:flex; flex-direction:column; overflow:hidden;
    max-width:460px; width:100%; margin:0 auto; animation:fadeUp .22s ease-out; padding-bottom:env(safe-area-inset-bottom); }
  .sheethead{ padding:16px 18px; border-bottom:1px solid var(--c-border); background:var(--c-surface); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .sheetbody{ padding:16px 18px; overflow-y:auto; }
  @keyframes tmpulse{ 0%,100%{ transform:scale(1); box-shadow:0 6px 18px rgba(0,0,0,.14); } 50%{ transform:scale(1.03); box-shadow:0 8px 24px rgba(0,0,0,.22); } }
  #quizTimerBar.tmup{ animation:tmpulse 1s ease-in-out infinite; }
  @media (prefers-reduced-motion:reduce){ #quizTimerBar.tmup{ animation:none; } }
  /* วงเปอร์เซ็นต์แบบเปลวไฟ — แสงเรืองไหวระริกเหมือนไฟลุก */
  @keyframes flameflick{ 0%,100%{ filter:drop-shadow(0 0 2px var(--fl)); } 45%{ filter:drop-shadow(0 0 7px var(--fl)); } 70%{ filter:drop-shadow(0 0 4px var(--fl)); } }
  #ytmount, #ytmount iframe{ position:absolute; inset:0; width:100%!important; height:100%!important; border:0; }
  /* จอวิดีโอล็อก — ปุ่มควบคุมของเราเอง (กันกดเข้าลิงก์/ก็อปลิงก์) */
  .ytbtn{ appearance:none; -webkit-appearance:none; border:0; background:rgba(255,255,255,.22); color:#fff; width:38px; height:38px; border-radius:50%; font-size:13px; font-weight:800; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition:transform .1s, background .15s; }
  .ytbtn:hover{ background:rgba(255,255,255,.32); }
  .ytbtn:active{ transform:scale(.9); }
  .ytbtn.play{ background:var(--pri); width:46px; height:46px; font-size:18px; box-shadow:0 3px 10px rgba(0,0,0,.35); }
  .ytstage:fullscreen{ width:100vw; height:100vh; border-radius:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ytstage:-webkit-full-screen{ width:100vw; height:100vh; border-radius:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ytstage.ytfs{ position:fixed!important; inset:0!important; z-index:9999!important; border-radius:0!important; background:#000; display:flex!important; flex-direction:column; align-items:center; justify-content:center; }
  .ytstage:fullscreen .ytwrap, .ytstage:-webkit-full-screen .ytwrap, .ytstage.ytfs .ytwrap,
  .ytstage:fullscreen .ytctrl, .ytstage:-webkit-full-screen .ytctrl, .ytstage.ytfs .ytctrl{ width:min(100%, calc((100vh - 54px) * 16 / 9)); }
  .ytstage:fullscreen .ytwrap, .ytstage:-webkit-full-screen .ytwrap, .ytstage.ytfs .ytwrap{ padding-top:0!important; aspect-ratio:16 / 9; }
  .flamearc{ filter:drop-shadow(0 0 3px var(--fl)); animation:flameflick 1.5s ease-in-out infinite; }
  /* ไฟลุกที่ปลายแถบ: ลิ้นไฟลุกขึ้น-ลง + แสงเรืองหายใจ */
  @keyframes fltongue{ 0%,100%{ transform:scaleY(1) scaleX(1); opacity:.95; } 35%{ transform:scaleY(1.28) scaleX(.88); opacity:1; } 65%{ transform:scaleY(.86) scaleX(1.08); opacity:.9; } }
  @keyframes flhalo{ 0%,100%{ opacity:.45; transform:scale(1); } 50%{ opacity:.9; transform:scale(1.2); } }
  @keyframes flcore{ 0%,100%{ opacity:.9; } 50%{ opacity:1; } }
  .fltongue{ transform-box:fill-box; transform-origin:50% 100%; filter:drop-shadow(0 0 2px var(--fl)); animation:fltongue .85s ease-in-out infinite; }
  .flhalo{ transform-box:fill-box; transform-origin:center; animation:flhalo 1.1s ease-in-out infinite; }
  .flcore{ filter:drop-shadow(0 0 3px var(--fl)); animation:flcore .85s ease-in-out infinite; }
  @media (prefers-reduced-motion:reduce){ .flamearc,.fltongue,.flhalo,.flcore{ animation:none; } }
  .x{ width:32px; height:32px; flex:none; border-radius:9px; border:1px solid var(--c-border); background:var(--c-surface); color:var(--c-text-muted); cursor:pointer; font-size:14px; }

  /* ───── กระดาษข้อสอบเสมือนจริง ───── */
  .paperhead{ text-align:center; padding-bottom:14px; margin-bottom:16px; border-bottom:2px solid #0E0F12; }
  .ph-org{ font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--pri); }
  .ph-title{ font-size:17px; font-weight:800; margin-top:3px; line-height:1.3; }
  .ph-sub{ font-size:11.5px; color:var(--c-text-muted); margin-top:3px; }
  .ph-name{ font-size:12px; margin-top:12px; text-align:left; }
  .psec{ font-size:12px; font-weight:700; color:var(--pri); background:#FBEFF0; padding:5px 10px;
         border-radius:6px; margin:18px 0 10px; page-break-after:avoid; break-after:avoid; }
  .pq{ margin-bottom:14px; page-break-inside:avoid; break-inside:avoid; }
  .pq-t{ display:flex; gap:7px; font-size:13.5px; line-height:1.65; align-items:baseline; }
  .pq-n{ font-weight:700; flex:none; min-width:1.7em; }
  .pch{ list-style:none; margin:5px 0 0 1.7em; padding:0; }
  .pch li{ font-size:13px; line-height:1.7; }
  .pans{ font-size:13px; font-weight:700; color:#1E9E5A; margin:4px 0 0 1.7em; }
  .ptopic{ font-size:10.5px; color:var(--c-text-subtle); margin:2px 0 0 1.7em; }
  .pexp{ font-size:12.5px; line-height:1.7; color:#3D4348; margin:5px 0 0 1.7em;
         padding-left:10px; border-left:2px solid var(--c-border); }
  .keygrid{ display:flex; flex-wrap:wrap; gap:5px 12px; font-size:12.5px; margin-bottom:6px; }
  .kg{ min-width:58px; font-variant-numeric:tabular-nums; }

  /* ลายน้ำ: แผ่นลายน้ำมีสัดส่วนเท่าพื้นที่พิมพ์ 1 หน้า แล้วปูซ้ำลงมา
     กว้าง 100% ของกรอบเสมอ ความสูงแผ่นจึงปรับตามความกว้างจริงของกระดาษ
     ไม่ผูกกับหน่วยมิลลิเมตร (ซึ่ง iPhone ย่อทั้งหน้าจนคลาดเคลื่อน) */
  .printarea{ position:relative; }
  .paperbody{
    position:relative;
    background-image:url("icons/watermark.jpg");
    background-repeat:repeat-y;
    background-position:center top;
    background-size:100% auto;
  }

  @media print{
    /* ปล่อยให้เบราว์เซอร์แบ่งหน้าเอง เนื้อหาจึงไหลต่อเนื่องไม่มีช่องว่างคั่น
       ขอบ 12 มม. ตรงกับสัดส่วนแผ่นลายน้ำ (186 x 273 มม.) */
    @page{ size:A4; margin:12mm; }
    /* พิมพ์ออกมาเป็นภาพสีเหมือนที่เห็นบนจอ */
    html, body{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    body{ background:var(--c-surface) !important; }
    /* ซ่อนทุกอย่าง แล้วค่อยเปิดเฉพาะกระดาษข้อสอบ — กันแผงแอดมินติดไปด้วย */
    .shell, .gate, .noprint, .sheethead, .sheet{ display:none !important; }
    .sheet.mockwrap{ position:static !important; background:none !important; display:block !important;
            inset:auto !important; padding:0 !important; }
    .mockwrap .sheetin{ max-height:none !important; border-radius:0 !important; box-shadow:none !important;
              width:100% !important; max-width:none !important; }
    .mockwrap .printarea{ overflow:visible !important; max-height:none !important;
                          padding:0 !important; background:var(--c-surface) !important; }
    .paperbody{ background-size:100% auto !important; }
    img{ max-height:170px !important; }
  }
</style>
<script>

"use strict";
/* ═══════════════════════════════════════════════════════════════
   ผู้ช่วยเตรียมสอบ นสต. รุ่น 18
   สร้างตามดีไซน์ ผู้ช่วยสอบนายสิบ.dc.html
   ═══════════════════════════════════════════════════════════════ */

/* ───── SHA-256 (เขียนไว้ในไฟล์ เพื่อให้ตรวจรหัสได้แม้เปิดจากไฟล์ในเครื่อง/ไม่มีเน็ต) ───── */
function sha256(str){
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var msg=unescape(encodeURIComponent(str));
  var maxWord=Math.pow(2,32), i, j, result="", words=[];
  var bitLength=msg.length*8;
  var hash=sha256.h=sha256.h||[];
  var k=sha256.k=sha256.k||[];
  var primeCounter=k.length, isComposite={};
  for(var candidate=2; primeCounter<64; candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate) isComposite[i]=candidate;
      hash[primeCounter]=(Math.pow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(Math.pow(candidate,1/3)*maxWord)|0;
    }
  }
  msg+="\x80";
  while(msg.length%64-56) msg+="\x00";
  for(i=0;i<msg.length;i++){
    j=msg.charCodeAt(i);
    if(j>>8) return "";
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(bitLength/maxWord)|0;
  words[words.length]=bitLength;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var i15=i-15, i2=i-2, a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^(~e&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:( w[i15]=w[i15]|0, w[i2]=w[i2]|0,
            (w[i-16]|0)+(rr(w[i15],7)^rr(w[i15],18)^(w[i15]>>>3))
            +(w[i-7]|0)+(rr(w[i2],17)^rr(w[i2],19)^(w[i2]>>>10)) )|0 );
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++)
    for(j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b<16)?0:"")+b.toString(16);
    }
  return result;
}

/* ───── ระบบรหัสเปิดใช้งาน ─────
   ⚠️ SECRET นี้ต้องตรงกับในไฟล์ "สร้างรหัส.html" ที่ใช้ออกรหัสให้นักเรียน

function deviceId(){
  var d=null;
  try{ d=localStorage.getItem(DEV_KEY); }catch(e){}
  if(!d){
    var a=new Uint8Array(8);
    (window.crypto||window.msCrypto).getRandomValues(a);

    for(var i=0;i<8;i++){ var h=a[i].toString(16); d+=(h.length<2?"0":"")+h; }
    try{ localStorage.setItem(DEV_KEY,d); }catch(e){}
  }
  return d;
}

function normCode(v){ return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function checkFor(payload){ return sha256(SECRET+"|"+payload).slice(0,6).toUpperCase(); }
function validCode(v){
  var c=normCode(v);
  if(c.indexOf("NST18")!==0) return false;
  var body=c.slice(5);
  if(body.length!==11) return false;
  var p=body.slice(0,5), chk=body.slice(5);
  for(var i=0;i<5;i++) if(ALPHA.indexOf(p[i])<0) return false;
  return checkFor(p)===chk;
}
function prettyCode(v){
  var c=normCode(v);
  return "NST18-"+c.slice(5,10)+"-"+c.slice(10,16);
}
function licSig(code,dev){ return sha256(SECRET+"|lic|"+code+"|"+dev).slice(0,12).toUpperCase(); }
function readLic(){
  try{ return JSON.parse(localStorage.getItem(LIC_KEY)||"null"); }catch(e){ return null; }
}
function saveLic(v){
  var code=prettyCode(v), dev=deviceId();
  localStorage.setItem(LIC_KEY, JSON.stringify({
    code:code, device:dev, sig:licSig(code,dev), at:new Date().toISOString()
  }));
}
function isActivated(){
  var l=readLic();
  if(!(l && l.code && validCode(l.code))) return false;
  if(!ACTIVATE_URL) return true;              // ยังไม่ได้เปิดระบบคุมเครื่อง
  var dev=deviceId();
  if(l.device!==dev) return false;            // ย้ายไฟล์ไปเครื่องอื่น → ต้องกรอกรหัสใหม่
  return l.sig===licSig(l.code,dev);          // กันการแก้ข้อมูลในเครื่องแบบง่าย ๆ
}

/* คุยกับเซิร์ฟเวอร์รหัส — ใช้ text/plain เพื่อให้ Apps Script รับได้โดยไม่ติด CORS */
function askServer(action,code,cb){
  var done=false;
  var t=setTimeout(function(){ if(!done){ done=true; cb({ok:false,reason:"offline"}); } },15000);
  fetch(ACTIVATE_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({ action:action, code:prettyCode(code), device:deviceId() })
  })
  .then(function(r){ return r.json(); })
  .then(function(j){ if(!done){ done=true; clearTimeout(t); cb(j||{ok:false,reason:"servererror"}); } })
  .catch(function(){ if(!done){ done=true; clearTimeout(t); cb({ok:false,reason:"offline"}); } });
}

/* เช็กเงียบ ๆ ตอนเปิดแอป: ล็อกออกเฉพาะรหัสที่พี่กด "ระงับ" เท่านั้น
   ถ้าไม่มีเน็ต/เซิร์ฟเวอร์ล่ม → ปล่อยผ่าน ไม่รบกวนคนที่ใช้ออฟไลน์อยู่ */
function revalidate(){
  if(!ACTIVATE_URL) return;
  var l=readLic(); if(!l) return;
  askServer("check", l.code, function(j){
    if(j && j.ok===false && j.reason==="revoked"){
      try{ localStorage.removeItem(LIC_KEY); }catch(e){}
      alert("รหัสนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ขาย");
      location.reload();
    }
  });
}

var MS=86400000;
function today0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function mondayOf(d){ var x=new Date(d); var day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function addTime(hhmm,mins){ var p=String(hhmm).split(":").map(Number); var t=(((p[0]*60+p[1]+mins)%1440)+1440)%1440;
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }
function thDate(d){ var M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."]; return d.getDate()+" "+M[d.getMonth()]; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ var p=String(s).split("-").map(Number); var d=new Date(p[0],p[1]-1,p[2]); d.setHours(0,0,0,0); return d; }
function thMonthFull(m){ return ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"][m]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ═══════════ ตัวเขียนสมการคณิตศาสตร์ ═══════════
   แปลงข้อความที่ติวเตอร์พิมพ์ ให้แสดงตามหลักการเขียนคณิตศาสตร์
     1/2          → เศษส่วนซ้อนบน-ล่าง
     2 1/2        → จำนวนคละ
     (x+1)/(x-2)  → เศษส่วนที่มีหลายพจน์
     x^2  2^(n+1) → ยกกำลัง
     a_1  a_(n+1) → ตัวห้อย
     sqrt(2)      → กรณฑ์ มีขีดบนคลุม
     <= >= != +- *  -> → ≤ ≥ ≠ ± × →
   ข้อความไทยและตัวเลขธรรมดาไม่ถูกแตะต้อง · ผ่าน esc() กันสคริปต์แฝงทุกจุด */
var MSYM = [[/<=/g,"≤"], [/>=/g,"≥"], [/!=/g,"≠"], [/\+-/g,"±"], [/->/g,"→"], [/\*/g,"×"], [/<->/g,"↔"]];
function msym(t){ MSYM.forEach(function(p){ t = t.replace(p[0], p[1]); }); return t; }
function mIsInt(t){ return /^\d+$/.test(t); }

function mtok(s){
  var out = [], i = 0, n = s.length;
  while(i < n){
    var c = s[i];
    if(c === "\n"){ out.push({k:"chr", html:"\n"}); i++; continue; }
    if(c === " " || c === "\t"){
      var j = i; while(j < n && (s[j] === " " || s[j] === "\t")) j++;
      out.push({k:"sp", html:s.slice(i,j)}); i = j; continue;
    }
    if(c === "("){                                    // วงเล็บ → หาคู่ปิด แล้วแปลงข้างในซ้ำ
      var d = 0, j2 = i, ok = false;
      for(; j2 < n; j2++){
        if(s[j2] === "(") d++;
        else if(s[j2] === ")"){ d--; if(d === 0){ ok = true; break; } }
      }
      if(ok){
        var inner = s.slice(i+1, j2);
        out.push({k:"atom", grouped:true, txt:inner, html:"(" + mrender(inner) + ")"});
        i = j2 + 1; continue;
      }
    }
    if(s.substr(i,4) === "sqrt"){ out.push({k:"fn"}); i += 4; continue; }
    if(c === "^" || c === "_" || c === "/"){ out.push({k:"op", op:c}); i++; continue; }
    if(/[0-9A-Za-z.]/.test(c)){                       // เลข/ตัวแปร = พจน์เดี่ยว
      var j3 = i; while(j3 < n && /[0-9A-Za-z.]/.test(s[j3])) j3++;
      var t = s.slice(i,j3);
      out.push({k:"atom", txt:t, html:esc(t)}); i = j3; continue;
    }
    var j4 = i;                                        // ไทย/เครื่องหมายอื่น ๆ
    while(j4 < n && !/[\s()\^_\/0-9A-Za-z.]/.test(s[j4])) j4++;
    if(j4 === i) j4 = i + 1;
    out.push({k:"chr", html:esc(msym(s.slice(i,j4)))});
    i = j4;
  }
  return out;
}
function mNextAtom(t, i){ var j = i; while(j < t.length && t[j].k === "sp") j++; return (t[j] && t[j].k === "atom") ? j : -1; }

function mSqrt(t){
  var out = [];
  for(var i = 0; i < t.length; i++){
    if(t[i].k === "fn"){
      var j = mNextAtom(t, i+1);
      if(j >= 0){
        var body = t[j].grouped ? mrender(t[j].txt) : t[j].html;
        out.push({k:"atom", html:'<span class="sq"><span class="rad">√</span><span class="bod">'+body+'</span></span>'});
        i = j; continue;
      }
      out.push({k:"chr", html:"sqrt"}); continue;
    }
    out.push(t[i]);
  }
  return out;
}
function mScript(t){
  var out = [];
  for(var i = 0; i < t.length; i++){
    if(t[i].k === "op" && (t[i].op === "^" || t[i].op === "_") &&
       out.length && out[out.length-1].k === "atom" && t[i+1] && t[i+1].k === "atom"){
      var base = out.pop();
      var sup  = t[i+1].grouped ? mrender(t[i+1].txt) : t[i+1].html;   // วงเล็บของเลขชี้กำลังไม่ต้องแสดง
      var cls  = t[i].op === "^" ? "msup" : "msub";
      out.push({k:"atom", html: base.html + '<span class="'+cls+'">' + sup + "</span>"});
      i++; continue;
    }
    out.push(t[i]);
  }
  return out;
}
function mFrac(t){
  var out = [];
  for(var i = 0; i < t.length; i++){
    // ต้องติดกันสนิท "3/4" เท่านั้น — "1 / 10" ไม่ใช่เศษส่วน
    if(t[i].k === "op" && t[i].op === "/" &&
       out.length && out[out.length-1].k === "atom" && t[i+1] && t[i+1].k === "atom"){
      var num = out.pop(), den = t[i+1];
      var nh = num.grouped ? mrender(num.txt) : num.html;
      var dh = den.grouped ? mrender(den.txt) : den.html;
      var frac = '<span class="fr"><span class="n">'+nh+'</span><span class="d">'+dh+'</span></span>';
      // จำนวนคละ: จำนวนเต็ม + เว้นวรรค + เศษส่วน  เช่น "2 1/2"
      if(!num.grouped && mIsInt(num.txt) && out.length >= 2 &&
         out[out.length-1].k === "sp" && out[out.length-2].k === "atom" &&
         mIsInt(out[out.length-2].txt)){
        out.pop();                                   // ทิ้งช่องว่าง
        var whole = out.pop();
        frac = '<span class="mixw">' + whole.html + "</span>" + frac;
      }
      out.push({k:"atom", html:frac});
      i++; continue;
    }
    out.push(t[i]);
  }
  return out;
}
function mrender(s){
  var t = mtok(String(s == null ? "" : s));
  t = mSqrt(t); t = mScript(t); t = mFrac(t);
  // สัญลักษณ์ที่ไม่ได้ถูกใช้สร้างเศษส่วน/ยกกำลัง ต้องคืนเป็นตัวอักษรตามเดิม
  // ไม่งั้นหน่วยอย่าง "ลิตร/ชม." จะกลายเป็น "ลิตรชม." (ขีดหายไปเฉย ๆ)
  t = t.map(function(x){
    if(x.k === "op") return { k:"chr", html: esc(x.op) };
    if(x.k === "fn") return { k:"chr", html: "sqrt" };
    return x;
  });
  return t.map(function(x){ return x.html; }).join("");
}
function mfrac(s){ return mrender(s); }
function pv(str){
  if(str==null) return NaN;
  var s=String(str).trim();
  if(s.indexOf(":")>=0){ var p=s.split(":").map(parseFloat); if(p.some(isNaN)) return NaN; return p[0]*60+(p[1]||0); }
  return parseFloat(s.replace(/[^0-9.]/g,""));
}

function phaseCounts(T){
  var mock=T<=1?0:Math.min(3,Math.max(2,Math.round(T*0.2)));
  var content=Math.max(1,Math.round(T*0.6));
  if(content+mock>T) mock=Math.max(0,T-content);
  var drill=T-content-mock;
  if(drill<0){ drill=0; content=T-mock; }
  return {content:content, drill:drill, mock:mock};
}
function phaseFor(i,T){ var c=phaseCounts(T); if(i<c.content) return "content"; if(i>=T-c.mock) return "mock"; return "drill"; }
function iconFor(k,type){
  if(type==="phys") return "🏃";

}

}

function calc(){
  var hours=Number(S.hours)||3, total=Math.round(hours*60);
  var b0=Math.round(total*5/12), b1=Math.round(total*4/12), b2=total-b0-b1;
  var mins=[b0,b1,b2];
  var t0=S.studyStart, t1=addTime(t0,b0), t2=addTime(t0,b0+b1), t3=addTime(t0,total);
  var timeRanges=[t0+"–"+t1, t1+"–"+t2, t2+"–"+t3];

  var daysLeft=null;
  if(S.examDate){ var ex=new Date(S.examDate+"T00:00:00"); daysLeft=Math.round((ex-today0())/MS); }
  var planNo=S.planWeeksNoDate||12;
  var T = daysLeft!=null ? Math.max(1,Math.ceil(daysLeft/7)) : planNo;

  var anchorMon=mondayOf(today0());
  var selObj=S.selDate?parseISO(S.selDate):today0();
  var weekIndex=Math.min(Math.max(0,Math.floor(Math.round((selObj-anchorMon)/MS)/7)),T-1);

  return { mins:mins, timeRanges:timeRanges, daysLeft:daysLeft, planNo:planNo, T:T,
           anchorMon:anchorMon, selObj:selObj, weekIndex:weekIndex };
}
function cellFor(entry,time){
  var k=entry[0], act=entry[1], type=entry[2];
  return { subjName:short(k), sk:k, type:type, icon:iconFor(k,type), act:act, time:time };
}
function blocksOf(dayIdx,weekIndex,T){
  var c=calc();
  var off=Number(S.dayOff);
  if(dayIdx===off) return null;
  var P=plans()[phaseFor(weekIndex,T)];
  var k=0; for(var i=0;i<dayIdx;i++){ if(i!==off) k++; }
  return P[k%6].map(function(b,bi){ return cellFor(b, c.timeRanges[bi]); });
}

function knowStats(){
  var done=0,total=0;
  subjects().forEach(function(su){
    (S.topics[su.k]||[]).forEach(function(t){ total++; if(S.know[t.id]) done++; });
  });
  return { done:done, total:total, pct: total?Math.round(done/total*100):0 };
}
function physStats(){
  var evs=physList(), passedCount=0;
  var per=evs.map(function(e){
    var targetRaw=(S.target[e.k]!=null && S.target[e.k]!=="")?S.target[e.k]:e.def;
    var target=pv(targetRaw);
    var list=(S.tests&&S.tests[e.k])||[];
    var passArr=list.map(function(v){
      var val=pv(v);
      if(isNaN(val)||isNaN(target)) return false;
      return e.dir==="high" ? val>=target : val<=target;
    });
    // ผลที่ดีที่สุด (วิ่ง=เร็วสุด, กระโดด=ไกลสุด) — ใช้ตัดสินสถานะ "ผ่าน/ยังไม่ผ่าน" ให้เข้าใจง่าย
    var bestObj=null;
    list.forEach(function(v){ var val=pv(v); if(isNaN(val)) return;
      if(!bestObj || (e.dir==="high"?val>bestObj.val:val<bestObj.val)) bestObj={raw:v,val:val}; });
    var passed = bestObj!=null && !isNaN(target) && (e.dir==="high"?bestObj.val>=target:bestObj.val<=target);
    if(passed) passedCount++;
    return { e:e, targetRaw:targetRaw, target:target, list:list, passArr:passArr, n:list.length,
             best:(bestObj?bestObj.val:null), bestRaw:(bestObj?bestObj.raw:null), passed:passed,
             stKey: list.length===0?"none":(passed?"pass":"improve") };
  });
  return { per:per, passed:passedCount, total:evs.length, pct: evs.length?Math.round(passedCount/evs.length*100):0 };
}
// แสดงระยะห่างจากเกณฑ์ให้อ่านง่าย (เวลาเป็น น:วิ, อื่น ๆ เป็นตัวเลข+หน่วย)
function fmtGap(e, diff){
  diff=Math.abs(diff);
  if(e.fmt==="mmss"){ var m=Math.floor(diff/60), s=Math.round(diff%60); return m?(m+":"+String(s).padStart(2,"0")+" นาที"):(s+" วินาที"); }
  return (Math.round(diff*100)/100)+" "+(e.unit||"");
}

/* จานสีเปลวไฟของวงเปอร์เซ็นต์ — ล่างเข้ม→บนสว่าง เหมือนไฟลุก + มีแสงเรือง/ไหวระริก
   key = สีฐานที่ส่งเข้ามา (แดง=ความรู้, เขียว=ร่างกาย) ทำให้ทุกจุดที่เรียก ring() หน้าตาเหมือนกัน */
var FLAME={
  "#E4111F":{ base:"#E4111F", g0:"#FFCF3D", g1:"#FF6A1A", g2:"#D80E1B", glow:"#FF5A1E" }, // เปลวไฟแดง
  "#1E9E5A":{ base:"#1E9E5A", g0:"#C4F24E", g1:"#37C46B", g2:"#0B7A41", glow:"#40CB74" }  // เปลวไฟเขียว
};
var _flN=0;
function ring(pct,color,label,st){
  var C=2*Math.PI*46;
  var p=Math.max(0,Math.min(100, pct||0));
  var f=FLAME[color]||{ base:color, g0:color, g1:color, g2:color, glow:color };
  var uid="flame"+(++_flN), hid=uid+"h";
  // ตำแหน่ง "ปลาย" ของแถบ (หัวความคืบหน้า) — เริ่มที่ 12 นาฬิกา วนตามเข็ม
  var th=2*Math.PI*(p/100);
  var tx=54+46*Math.sin(th), ty=54-46*Math.cos(th);
  var flameTip = p>0
    ? '<g transform="translate('+tx.toFixed(2)+','+ty.toFixed(2)+')" style="--fl:'+f.glow+';">'+
        '<circle class="flhalo" r="9" fill="url(#'+hid+')"></circle>'+
        '<path class="fltongue" d="M0,-10 C5.2,-4 4.2,2.6 0,5.2 C-4.2,2.6 -5.2,-4 0,-10 Z" fill="url(#'+uid+')"></path>'+
        '<circle class="flcore" r="2.6" fill="'+f.g0+'"></circle>'+
      '</g>'
    : '';
  return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">'+
    '<div style="position:relative;width:108px;height:108px;">'+
      '<svg width="108" height="108" viewBox="0 0 108 108" style="overflow:visible;">'+
        '<defs><linearGradient id="'+uid+'" x1="0" y1="1" x2="0" y2="0">'+
          '<stop offset="0%" stop-color="'+f.g2+'"></stop>'+
          '<stop offset="55%" stop-color="'+f.g1+'"></stop>'+
          '<stop offset="100%" stop-color="'+f.g0+'"></stop>'+
        '</linearGradient>'+
        '<radialGradient id="'+hid+'">'+
          '<stop offset="0%" stop-color="'+f.glow+'" stop-opacity="0.85"></stop>'+
          '<stop offset="100%" stop-color="'+f.glow+'" stop-opacity="0"></stop>'+
        '</radialGradient></defs>'+
        '<circle cx="54" cy="54" r="46" fill="none" stroke="var(--c-border)" stroke-width="10"></circle>'+
        '<circle class="flamearc" cx="54" cy="54" r="46" fill="none" stroke="url(#'+uid+')" stroke-width="10" stroke-linecap="round" '+
          'stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p/100))+'" transform="rotate(-90 54 54)" '+
          'style="--fl:'+f.glow+';transition:stroke-dashoffset .6s;"></circle>'+
        flameTip+
      '</svg>'+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">'+
        '<span class="mono" style="font-size:26px;font-weight:700;color:'+f.base+';">'+pct+'</span>'+
        '<span style="font-size:11px;font-weight:600;color:'+f.base+';margin-top:-2px;">%</span>'+
      '</div>'+
    '</div>'+
    '<div style="font-size:13px;font-weight:600;">'+label+'</div>'+
    '<div style="font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:#F4F6F9;color:'+st.c+';">'+st.t+'</div>'+
  '</div>';
}

// ดึง YouTube video id จากลิงก์หลายรูปแบบ (watch, youtu.be, embed, shorts) หรือรับ id ตรง ๆ
function ytId(url){
  var s=String(url||"").trim();
  if(/^[\w-]{11}$/.test(s)) return s;
  var m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
  return m?m[1]:"";
}
function studyVids(tid){ return (S.videos||{})[tid]||[]; }
function videoIndex(){                       // id → {v, tid, sk} สำหรับสร้างประวัติ/เปิดเล่น
  var idx={};
  subjects().forEach(function(su){
    (S.topics[su.k]||[]).forEach(function(t){
      studyVids(t.id).forEach(function(v){ idx[v.id]={v:v, tid:t.id, sk:su.k}; });
    });
  });
  return idx;
}
function prog(id){ return (S.progress||{})[id]||{sec:0,pct:0,at:null}; }
function isDone(id){ return (prog(id).pct||0) >= 90; }   // ดูจบ ~90% ขึ้นไป = เรียนจบ
function subjVidStats(sk){
  var total=0, done=0;
  (S.topics[sk]||[]).forEach(function(t){
    studyVids(t.id).forEach(function(v){ total++; if(isDone(v.id)) done++; });
  });
  return { total:total, done:done, pct: total?Math.round(done/total*100):0 };
}
function allVidStats(){
  var total=0, done=0;
  subjects().forEach(function(su){ var s=subjVidStats(su.k); total+=s.total; done+=s.done; });
  return { total:total, done:done, pct: total?Math.round(done/total*100):0 };
}
function learnHistory(){
  var idx=videoIndex(), pr=S.progress||{}, arr=[];
  Object.keys(pr).forEach(function(id){ if(idx[id] && pr[id] && pr[id].at) arr.push({ id:id, at:pr[id].at, v:idx[id].v, sk:idx[id].sk, pct:pr[id].pct||0 }); });
  arr.sort(function(a,b){ return a.at<b.at?1:(a.at>b.at?-1:0); });
  return arr;
}
function relTime(iso){
  var t=new Date(iso).getTime(); if(isNaN(t)) return "";
  var s=Math.floor((Date.now()-t)/1000);
  if(s<60) return "เมื่อครู่นี้";
  if(s<3600) return Math.floor(s/60)+" นาทีที่แล้ว";
  if(s<86400) return Math.floor(s/3600)+" ชม.ที่แล้ว";
  if(s<2592000) return Math.floor(s/86400)+" วันที่แล้ว";
  var d=new Date(iso); return d.getDate()+"/"+(d.getMonth()+1);
}

/* ── YouTube IFrame API (ฟรี ไม่ต้องมี API key) — ทำ % ที่ดูจริง + จำตำแหน่งล่าสุด ── */
var _yt={ player:null, vid:null, poll:0, apiReq:false };
function ensureYTApi(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  window.onYouTubeIframeAPIReady=function(){ cb(); };
  if(!_yt.apiReq){
    _yt.apiReq=true;
    var s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s);
  }
}
function saveProg(id, patch){
  var pr=Object.assign({}, S.progress||{});
  pr[id]=Object.assign({sec:0,pct:0}, pr[id]||{}, patch, {at:new Date().toISOString()});
  S.progress=pr; save();     // ไม่ render เพื่อไม่ให้ iframe รีโหลด
}
function fmtSec(sec){ var s=Math.floor(sec||0); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function setYtUI(){                       // อัปเดตปุ่มเล่น/หยุด + ชั้นหรี่จอเวลาหยุด (ไม่ render)
  if(!_yt.player || !_yt.player.getPlayerState) return;
  var playing=_yt.player.getPlayerState()===1;
  var ic=document.getElementById("ytplayicon"); if(ic) ic.textContent=playing?"⏸":"▶";
  var big=document.getElementById("ytbigplay"); if(big) big.style.display=playing?"none":"flex";
  var sh=document.getElementById("ytshield"); if(sh) sh.style.background=playing?"transparent":"rgba(0,0,0,.4)";
}
function pollProg(){
  if(!_yt.player || !_yt.player.getCurrentTime || !S.player) return;
  var cur=_yt.player.getCurrentTime()||0;
  var dur=(_yt.player.getDuration&&_yt.player.getDuration())||0;
  var tEl=document.getElementById("yttime"); if(tEl) tEl.textContent=fmtSec(cur)+(dur>0?" / "+fmtSec(dur):"");
  if(dur>0){
    var pct=Math.max(0,Math.min(100,Math.round(cur/dur*100)));
    saveProg(S.player.id,{sec:cur,pct:pct});
    var bar=document.getElementById("ytbar"); if(bar) bar.style.width=pct+"%";
    var mp=document.getElementById("ytmeta"); if(mp) mp.textContent=(S.player.dur?S.player.dur+" · ":"")+"ดูแล้ว "+pct+"% · บันทึกตำแหน่งล่าสุดอัตโนมัติ";
  }
}
function startPoll(){ stopPoll(); _yt.poll=setInterval(pollProg,1500); }
function stopPoll(){ if(_yt.poll){ clearInterval(_yt.poll); _yt.poll=0; } }
function destroyPlayer(){ stopPoll(); if(_yt.player && _yt.player.destroy){ try{ _yt.player.destroy(); }catch(e){} } _yt.player=null; _yt.vid=null; }
function mountPlayer(){
  var p=S.player; if(!p || !p.yt) return;
  var el=document.getElementById("ytmount"); if(!el) return;
  if(el.tagName==="IFRAME" && _yt.player && _yt.vid===p.id) return;   // ยังเล่นอยู่ ไม่ต้องสร้างใหม่
  destroyPlayer();
  _yt.vid=p.id;
  var startSec=Math.floor(prog(p.id).sec||0);
  ensureYTApi(function(){
    if(!S.player || S.player.id!==p.id) return;
    if(!document.getElementById("ytmount")) return;
    _yt.player=new YT.Player("ytmount",{
      width:"100%", height:"100%", videoId:p.yt,
      // controls:0 + fs:0 + disablekb + iv_load_policy:3 → ซ่อนคอนโทรล/โลโก้/คำบรรยายของ YouTube (ใช้ปุ่มเราแทน)
      playerVars:{ rel:0, modestbranding:1, playsinline:1, controls:0, fs:0, disablekb:1, iv_load_policy:3, start:startSec },
      events:{
        onReady:function(e){ var l=document.getElementById("ytload"); if(l) l.style.display="none"; try{ e.target.playVideo(); }catch(_){} startPoll(); setYtUI(); },
        onStateChange:function(e){ setYtUI(); if(e.data===1) startPoll(); else { pollProg(); if(e.data===2||e.data===0) stopPoll(); } }
      }
    });
  });
}

var THL=["ก","ข","ค","ง"];
/* ข้อสอบมิติสัมพันธ์ที่ตัวเลือก A-D วาดอยู่ในรูป — ปุ่มต้องขึ้น "A" เฉย ๆ
   ไม่ใช่ "ก.A" ไม่งั้นนักเรียนงงว่าให้ดูตัวอักษรชุดไหน */
function isLetterCh(ch){
  return ch && ch.length===4 && ch[0]==="A" && ch[1]==="B" && ch[2]==="C" && ch[3]==="D";
}
function chLabel(ch, ci){
  return isLetterCh(ch) ? '<b>'+ch[ci]+'</b>' : (THL[ci]||"")+". "+mfrac(ch[ci]);
}
function validQs(a){
  // โจทย์ต้องมีข้อความ "หรือ" รูป (ข้อสอบรูปภาพบางข้อไม่มีข้อความโจทย์เลย)
  return (a||[]).filter(function(x){ return x && (x.q || x.img) && Array.isArray(x.choices) && x.choices.length>=2; })
    .map(function(x){
      var o = { q:x.q||"", choices:x.choices.slice(0,4),
                answer:Math.max(0,Math.min(x.choices.length-1, x.answer|0)),
                explain:x.explain||"" };
      if(x.img)  o.img  = x.img;                    // รูปโจทย์
      if(x.ximg) o.ximg = x.ximg;                   // รูปเฉลย
      if(x.cimg) o.cimg = x.cimg.slice(0,4);        // รูปตัวเลือก
      return o;
    });
}
function drawQs(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a.slice(0,10);
}

/* ══════════ ชุดข้อสอบเสมือนจริง ══════════
   สัดส่วนตามข้อสอบจริงของ นสต. — แก้ตัวเลขตรงนี้ได้ถ้าประกาศเปลี่ยน */
var MOCK_PLAN = [
  { k:"math",   n:30 },
  { k:"thai",   n:25 },
  { k:"eng",    n:30 },
  { k:"com",    n:25 },
  { k:"law",    n:20 },
  { k:"social", n:20 }
];
var MOCK_TOTAL = MOCK_PLAN.reduce(function(a,b){ return a+b.n; },0);

/* ข้อสอบทั้งหมดของวิชาหนึ่ง (รวมทุกหัวข้อ) พร้อมชื่อหัวข้อติดไปด้วย */
function poolOf(subj){
  var out=[];
  (S.topics[subj]||[]).forEach(function(t){
    validQs(S.bank[t.id]).forEach(function(q){
      q._topic = t.label; out.push(q);
    });
  });
  return out;
}
function shuffled(a){
  var x=a.slice();
  for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; }
  return x;
}

/* ตารางสัดส่วน + เตือนวิชาที่ข้อสอบไม่พอ */
function mockPlanHTML(){
  var rows="", short=0;

    var have=poolOf(p.k).length, ok=have>=p.n;

    rows+='<tr>'+
      '<td style="padding:5px 8px;">'+esc(sName[p.k]||p.k)+'</td>'+

      '<td style="padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums;color:'+(ok?"var(--c-text-muted)":"var(--pri)")+';">'+have+'</td>'+
      '<td style="padding:5px 8px;text-align:right;font-weight:700;color:'+(ok?"#1E9E5A":"var(--pri)")+';">'+
        (ok?"พอ":"ขาด "+(p.n-have))+'</td></tr>';
  });
  return '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12.5px;">'+
      '<thead><tr style="color:var(--c-text-subtle);font-size:11px;">'+

        '<th style="text-align:right;padding:4px 8px;">ต้องใช้</th>'+
        '<th style="text-align:right;padding:4px 8px;">มีในคลัง</th>'+
        '<th style="text-align:right;padding:4px 8px;">สถานะ</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (short ? '<div style="margin-top:10px;padding:10px 12px;background:#FEF4F4;border-left:3px solid var(--pri);border-radius:0 8px 8px 0;font-size:12px;color:#7A1219;line-height:1.6;">'+
        '⚠️ ตอนนี้สร้างได้ '+(MOCK_TOTAL-short)+' ข้อ จาก '+MOCK_TOTAL+' ข้อ<br>'+
        'วิชาที่ยังไม่มีข้อสอบจะถูกข้ามไป ระบบจะครบเองเมื่อลงข้อสอบวิชานั้นแล้ว</div>' : "");
}

/* สุ่มชุดข้อสอบ */
function buildMock(){
  var items=[], gaps=[];
  MOCK_PLAN.forEach(function(p){
    var pool=poolOf(p.k), take=Math.min(p.n, pool.length);
    if(take<p.n) gaps.push({ subj:sName[p.k]||p.k, want:p.n, got:take });
    shuffled(pool).slice(0,take).forEach(function(q){
      q._subj = sName[p.k]||p.k;
      items.push(q);
    });
  });
  return { items:items, gaps:gaps, at:new Date(), mockSet:true,
           label:"ข้อสอบเสมือนจริง นายสิบตำรวจ รุ่น 18" };
}

/* ── ดึงข้อสอบเอง: เลือกวิชา / หัวข้อ / จำนวน ── */
function pickPool(){
  var subj = S.pickSubj || "math";
  if(S.pickTopic && S.pickTopic!=="_all"){
    var t=(S.topics[subj]||[]).find(function(x){ return x.id===S.pickTopic; });
    var a=validQs(S.bank[S.pickTopic]);
    a.forEach(function(q){ q._topic = t?t.label:""; });
    return a;
  }
  return poolOf(subj);
}
function buildPick(){
  var subj = S.pickSubj || "math";
  var pool = pickPool();
  var want = Math.max(1, Math.min(parseInt(S.pickN,10)||10, pool.length));
  var picked = (S.pickOrder==="bank" ? pool.slice(0,want) : shuffled(pool).slice(0,want));
  picked.forEach(function(q){ q._subj = sName[subj]||subj; });
  var tObj=(S.topics[subj]||[]).find(function(x){ return x.id===S.pickTopic; });
  return {
    items: picked, gaps: [], at: new Date(),
    label: (sName[subj]||subj) + (tObj ? " — "+tObj.label : " — ทุกหัวข้อ")
  };
}

          '<input type="number" min="1" max="'+Math.max(1,pool.length)+'" value="'+(S.pickN||10)+'" '+
            'style="'+st+'" onchange="A.setPick(\'n\',this.value)"></div>'+

function mockPaperBlocks(m){

  m.items.forEach(function(q,i){

        (q.img?imgHTML(q.img,200):"")+

            /* ข้อสอบรูปภาพ ตัวเลือกเป็นตัวอักษร A–D อยู่ในตัวมันเองแล้ว ใช้ c ตรง ๆ

/* ═══════════ รูปภาพประกอบโจทย์ ═══════════
   เก็บรูปเป็น data URI ฝังใน questions.json เลย → อัปโหลดไฟล์เดียวจบ
   และนักเรียนได้รูปติดเครื่องไปด้วย เปิดออฟไลน์เห็นรูปแน่นอน
   ย่อ+บีบอัดก่อนเก็บเสมอ ไม่งั้นไฟล์บวมจนโหลดไม่ไหว */
var IMG_MAX = 900;          // ด้านยาวสุด (px)
var _imgTarget = null;

function pickImage(t, i){
  _imgTarget = {t:t, i:i};
  var el = document.getElementById("imgfile");
  if(!el) return;
  el.value = "";
  el.click();
}
function onImageFile(el){
  var f = el.files && el.files[0];
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast("ไฟล์นี้ไม่ใช่รูปภาพ"); return; }
  var r = new FileReader();
  r.onload = function(){
    var im = new Image();
    im.onload = function(){
      var s = Math.min(1, IMG_MAX/im.width, IMG_MAX/im.height);
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.width*s));
      c.height = Math.max(1, Math.round(im.height*s));
      var x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height);   // พื้นโปร่งใสจะกลายเป็นดำถ้าไม่รองพื้นขาว
      x.drawImage(im, 0, 0, c.width, c.height);
      var url = c.toDataURL("image/webp", 0.8);
      if(url.indexOf("data:image/webp") !== 0) url = c.toDataURL("image/jpeg", 0.75);
      setDraftImage(url);
      toast("ใส่รูปแล้ว · " + kb(url) + " KB");
    };
    im.onerror = function(){ toast("เปิดไฟล์รูปไม่สำเร็จ"); };
    im.src = r.result;
  };
  r.onerror = function(){ toast("อ่านไฟล์ไม่สำเร็จ"); };
  r.readAsDataURL(f);
}
function setDraftImage(url){
  var d = S.adminDraft, t = _imgTarget;
  if(!d || !t) return;
  if(t.t === "q") d.img = url;
  else if(t.t === "x") d.ximg = url;
  else if(t.t === "c"){ d.cimg = d.cimg || ["","","",""]; d.cimg[t.i] = url; }
  render();
}
function delDraftImage(t, i){
  var d = S.adminDraft;
  if(!d) return;
  if(t === "q") d.img = "";
  else if(t === "x") d.ximg = "";
  else if(t === "c" && d.cimg) d.cimg[i] = "";
  render();
}
function kb(s){ return Math.round((s ? s.length : 0) * 0.75 / 1024); }
function imgHTML(src, max){
  if(!src) return "";
  return '<img src="'+esc(src)+'" alt="รูปประกอบโจทย์" loading="lazy" '+
    'style="display:block;max-width:100%;max-height:'+(max||260)+'px;margin:8px 0;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface);">';
}

  /* รีเซ็ตความคืบหน้านักเรียน "ทุกคน" กลับเป็นค่าเริ่มต้น (คะแนน+เช็กลิสต์+ช่องติ๊กแผน)
     ต้องใส่รหัสผ่าน RESET_PW · สั่งผ่าน resetToken ที่ฝังใน questions.json */
  resetStudents:function(){
    var pw=prompt("⚠️ รีเซ็ตความคืบหน้าของนักเรียน “ทุกคน” กลับเป็นค่าเริ่มต้น\n\nจะล้าง: คะแนนสอบ + สถานะเช็กลิสต์ผ่าน/ไม่ผ่าน + ช่องติ๊กงานประจำวัน\nจะเก็บไว้: วันสอบ ตั้งค่าส่วนตัว ธีมสี และรหัสเปิดใช้งาน\n\nพิมพ์รหัสผ่านเพื่อยืนยัน:");
    if(pw===null) return;                              // กดยกเลิก
    if(String(pw).trim()!==RESET_PW){ alert("รหัสผ่านไม่ถูกต้อง — ยกเลิกการรีเซ็ต"); return; }
    if(!confirm("ยืนยันอีกครั้ง — นักเรียนทุกคนจะถูกรีเซ็ตความคืบหน้าเมื่อเปิดแอปครั้งถัดไปที่มีเน็ต\n\nการนี้ย้อนกลับไม่ได้ ดำเนินการต่อ?")) return;
    var rt=(S.resetToken||0)+1;
    // ตั้ง token ใหม่ + กันเครื่องครูเองไม่ให้ถูกรีเซ็ตซ้ำ
    set({resetToken:rt, resetAppliedToken:rt});
    A.exportQuestions();                               // ได้ไฟล์ questions.json (มี resetToken) ไปอัปโหลด
    alert("ตั้งคำสั่งรีเซ็ตเรียบร้อย (รอบที่ "+rt+")\n\nขั้นสุดท้าย: อัปโหลดไฟล์ questions.json ที่เพิ่งดาวน์โหลด ทับของเดิมบนเว็บ\nนักเรียนทุกคนจะถูกรีเซ็ตอัตโนมัติเมื่อเปิดแอปครั้งถัดไปที่มีเน็ต");
  },
  /* ปลดสถานะ "แก้ค้าง" แล้วดึงคลังล่าสุดจากเว็บมาทับ
     ใช้เมื่อเครื่องนี้ติดค้างที่ข้อสอบชุดเก่า เพราะเคยแตะแก้ในแอดมินแล้วไม่ได้ส่งออก */
  pullLatest:function(){
    var msg = S.bankDirty
      ? "เครื่องนี้มีข้อสอบที่แก้ไว้แต่ยังไม่ได้ส่งออก\n\nถ้าดึงของใหม่จากเว็บ ที่แก้ไว้ในเครื่องนี้จะหายทั้งหมด\n\nยืนยันดึงข้อสอบล่าสุดจากเว็บ?"
      : "ดึงข้อสอบล่าสุดจากเว็บมาทับของในเครื่องนี้?";
    if(!confirm(msg)) return;
    var before = Object.values(S.bank||{}).reduce(function(a,b){return a+b.length;},0);
    set({bankDirty:false});
    toast("กำลังดึงข้อสอบล่าสุด…");
    syncContent().then(function(){
      var after = Object.values(S.bank||{}).reduce(function(a,b){return a+b.length;},0);
      render();
      if(after===before && (S.contentVersion||0)>0)
        toast("ข้อสอบในเครื่องเป็นชุดล่าสุดอยู่แล้ว ("+after+" ข้อ)");
      else
        toast("ดึงข้อสอบล่าสุดแล้ว — "+after+" ข้อ (เวอร์ชัน "+(S.contentVersion||0)+")");
    });
  },
  /* ── ชุดข้อสอบเสมือนจริง ── */
  makeMock:function(){
    var m=buildMock();
    if(!m.items.length){ alert("ยังไม่มีข้อสอบในคลังเลย"); return; }
    S.mock=m; S.mockView="paper";
    render();
    var b=document.getElementById("printarea");
    if(b) b.scrollTop=0;
  },
  setPick:function(f,v){
    if(f==="subj"){ S.pickSubj=v; S.pickTopic="_all"; }
    else if(f==="topic") S.pickTopic=v;
    else if(f==="n")     S.pickN=Math.max(1,parseInt(v,10)||10);
    else if(f==="order") S.pickOrder=v;
    render();
  },
  makePick:function(){
    var m=buildPick();
    if(!m.items.length){ alert("หัวข้อที่เลือกยังไม่มีข้อสอบ"); return; }
    S.mock=m; S.mockView="paper";
    render();
    var b=document.getElementById("printarea"); if(b) b.scrollTop=0;
  },
  closeMock:function(){ S.mock=null; render(); },
  mockView:function(v){ S.mockView=v; render(); var b=document.getElementById("printarea"); if(b) b.scrollTop=0; },
  printMock:function(){ window.print(); },
  importData:function(){ document.getElementById("importfile").click(); },
  importFile:function(el){
    var f=el.files && el.files[0];
    if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d || typeof d!=="object") throw new Error("bad");
        if(!confirm("นำเข้าข้อมูลนี้ทับของเดิม?")) return;
        localStorage.setItem(LS, JSON.stringify(d));
        load(); render();
        toast("นำเข้าข้อมูลแล้ว");
      }catch(e){ toast("ไฟล์ไม่ถูกต้อง"); }
    };
    r.readAsText(f);
    el.value="";
  }
};
window.A=A;

function loadQuiz(sk,id,label,subjName){
  var bank=validQs((S.bank||{})[id]);
  if(bank.length>0){ startQuiz(id, drawQs(bank)); return; }
  var cached=validQs((S.pool||{})[id]);
  if(cached.length>0){ startQuiz(id, drawQs(cached)); return; }
  // ไม่มีข้อสอบในคลัง — ถ้าเปิดในหน้าต่างพรีวิวของ Claude จะลองให้ AI ออกข้อสอบให้
  if(window.claude && window.claude.complete){ aiQuiz(sk,id,label,subjName); return; }
  if(S.quiz && S.quiz.topicId===id){ S.quiz.status="empty"; render(); }
}
function startQuiz(id,qs){
  if(!S.quiz || S.quiz.topicId!==id) return;
  S.quiz.status="active"; S.quiz.questions=qs; S.quiz.idx=0;
  S.quiz.picked=qs.map(function(){ return null; });   // ยาวเท่าจำนวนข้อ, null=ยังไม่ตอบ (ข้ามไปทำข้ออื่น/แก้ไขได้)
  S.quiz.correct=0; S.quiz._confirm=false;
  S.quiz.totalMs = qs.length * SEC_PER_Q * 1000;   // ข้อละ 1.2 นาที ตามจำนวนข้อ
  S.quiz.deadline = Date.now() + S.quiz.totalMs;
  S.quiz.timeUp = false;
  render();
  startQuizTimer();
}

/* ── จับเวลาทำข้อสอบ: ให้เวลา "ข้อละ 1.2 นาที" ตามจำนวนข้อ แสดงนับถอยหลังขณะทำ ──
   หมดเวลา = ส่งคำตอบให้อัตโนมัติ ข้อที่ยังไม่ตอบนับเป็นผิด */
var SEC_PER_Q = 72;                 // 1.2 นาที = 72 วินาที/ข้อ
var quizTimerId = 0;
function quizRemainMs(){
  var q=S.quiz;
  if(!q || !q.deadline) return 0;
  var r=q.deadline-Date.now();
  return r>0?r:0;
}
function fmtClock(ms){
  var s=Math.ceil(ms/1000);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function clearQuizTimer(){ if(quizTimerId){ clearInterval(quizTimerId); quizTimerId=0; } }
function startQuizTimer(){
  clearQuizTimer();
  quizTimerId=setInterval(function(){
    var q=S.quiz;
    if(!q || q.status!=="active"){ clearQuizTimer(); return; }
    var rem=quizRemainMs();
    if(rem<=0){ timeUpQuiz(); return; }
    var el=document.getElementById("quizClock");
    if(el){
      el.textContent=fmtClock(rem);
      var bar=document.getElementById("quizTimerBar");
      if(bar && rem<=60000) bar.classList.add("tmup");   // เหลือ 1 นาทีสุดท้าย ให้กล่องกะพริบเตือน
    }
  },500);
}
function gradeQuiz(){                       // นับข้อถูกจากคำตอบที่เลือกไว้ (ข้อที่ไม่ตอบ = ผิด)
  var q=S.quiz, c=0;
  for(var i=0;i<q.questions.length;i++){ if(q.picked[i]===q.questions[i].answer) c++; }
  q.correct=c;
  q.pct=Math.round(c/q.questions.length*100);
  q.passed=q.pct>=80;
}
function finishQuiz(timeUp){
  clearQuizTimer();
  var q=S.quiz;
  if(!q || q.status!=="active") return;
  gradeQuiz();
  q.timeUp=!!timeUp;
  q.status="result";
  var sc=Object.assign({},S.scores); sc[q.topicId]=q.pct;
  var kn=Object.assign({},S.know); if(q.passed) kn[q.topicId]=true;
  set({scores:sc, know:kn});
}
function timeUpQuiz(){ finishQuiz(true); }   // หมดเวลา = ส่งอัตโนมัติ
function aiQuiz(sk,id,label,subjName){
  var prompt="คุณเป็นผู้ออกข้อสอบและติวเตอร์นายสิบตำรวจ (สายปราบปราม) ระดับสนามสอบจริง\n"+
    "สร้างคลังข้อสอบปรนัย 30-50 ข้อ หัวข้อ: \""+subjName+" — "+label+"\" ครอบคลุมหลายแง่มุมและห้ามซ้ำกัน\n"+
    "ตอบกลับเป็น JSON เท่านั้น ห้ามมีข้อความอื่น รูปแบบ:\n"+
    "{\"questions\":[{\"q\":\"โจทย์\",\"choices\":[\"ตัวเลือกที่1\",\"ตัวเลือกที่2\",\"ตัวเลือกที่3\",\"ตัวเลือกที่4\"],\"answer\":0,\"explain\":\"เฉลยละเอียด\"}]}\n"+
    "กติกา: แต่ละข้อมี 4 ตัวเลือก, answer เป็นดัชนี 0-3 ของตัวเลือกที่ถูก, ภาษาไทย มีคำตอบถูกเพียงข้อเดียว\n"+
    "สำคัญมาก: ฟิลด์ explain ต้องเป็นเฉลยแบบละเอียดให้มือใหม่เข้าใจง่ายที่สุด อธิบายเป็นขั้นตอน (ขึ้นบรรทัดใหม่ด้วย \\n)";
  window.claude.complete({messages:[{role:"user",content:prompt}], max_tokens:32000})
    .then(function(raw){
      var txt=String(raw).replace(/```json/gi,"").replace(/```/g,"").trim();
      var pool=validQs(JSON.parse(txt).questions);
      if(pool.length<1) throw new Error("empty");
      var p=Object.assign({},S.pool); p[id]=pool;
      S.pool=p; save();
      startQuiz(id, drawQs(pool));
    })
    .catch(function(){ if(S.quiz && S.quiz.topicId===id){ S.quiz.status="error"; render(); } });
}

function toast(msg){
  var t=document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },2600);
}

/* ═══════════ เริ่มทำงาน ═══════════ */
/* ดึงคลังข้อสอบกลางจากเว็บ (questions.json) — นี่คือวิธีที่ข้อสอบของติวเตอร์ไปถึงนักเรียนทุกคน
   ถ้าไม่มีเน็ต ตัว service worker จะหยิบของที่แคชไว้มาให้เอง */
function syncContent(){
  return fetch("questions.json",{cache:"no-cache"})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){
      if(!d) return;
      // คำสั่งรีเซ็ตจากครู: ถ้า resetToken บนเว็บใหม่กว่าที่เครื่องนี้เคยทำ → ล้างความคืบหน้ากลับค่าเริ่มต้น 1 ครั้ง
      var rt=d.resetToken||0;
      if(rt > (S.resetAppliedToken||0)){
        set({ scores:{}, know:{}, done:{}, progress:{}, resetAppliedToken:rt });
        toast("ครูรีเซ็ตความคืบหน้าใหม่ทั้งหมดแล้ว — เริ่มต้นใหม่ได้เลย");
      }
      var v=d.version||0, newer = v!==(S.contentVersion||0);
      if(S.bankDirty){                             // ติวเตอร์มีข้อสอบแก้ค้าง ห้ามทับ
        if(newer) toast("มีเนื้อหาใหม่บนเว็บ — แต่ยังไม่ดึงมา เพราะมีข้อสอบที่ยังไม่ได้ส่งออก");
        return;
      }
      // ดึงคลังจากเว็บมาใส่ทุกครั้งที่เปิดแอป (ไม่ได้เก็บใน localStorage แล้ว)
      var patch={ contentVersion:v };
      if(d.topics) patch.topics=d.topics;
      if(d.bank) patch.bank=d.bank;
      if(d.physEvents) patch.physEvents=d.physEvents;
      if(d.videos && !S.videosDirty) patch.videos=d.videos;   // ไม่ทับวิดีโอที่แก้ค้างในเครื่อง
      set(patch);
      if(newer && v>1) toast("อัปเดตเนื้อหาใหม่แล้ว");
    })
    .catch(function(){});
}
/* ── กันสลับหน้าจอระหว่างทำข้อสอบ ──
   ถ้าสลับไปหน้าจอ/แอปอื่นขณะกำลังทำข้อสอบ ให้เด้งออกทันที ไม่บันทึกคะแนน
   ครอบคลุม: สลับแท็บ สลับแอป กดปุ่มโฮม ล็อกหน้าจอ */
function abortQuizOnSwitch(){
  if(S.quiz && S.quiz.status==="active"){
    clearQuizTimer();
    S.quiz.status="aborted";
    render();
  }
}

/* ── ดึงข้อสอบใหม่ตอนกลับมาที่แอป ──
   นักเรียนส่วนใหญ่ไม่ได้ปิดแอปสนิท แค่สลับไปแอปอื่นแล้วกดกลับมา
   ถ้าไม่เช็คตรงนี้ เขาจะไม่ได้ข้อสอบชุดใหม่จนกว่าจะปิดแอปแล้วเปิดใหม่เอง */
var lastSyncAt = 0;
function maybeSync(){
  if(!isActivated()) return;                    // ยังไม่ได้เปิดใช้งาน
  if(S.quiz || S.adminOpen || S.mock || S.player) return;   // ทำข้อสอบ/แอดมิน/ดูชุดข้อสอบ/ดูวิดีโอ อย่ารบกวน
  if(Date.now()-lastSyncAt < 30000) return;     // เพิ่งเช็คไปไม่ถึงครึ่งนาที
  lastSyncAt = Date.now();
  syncContent();
}
function startApp(){
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  load();
  render();
  lastSyncAt = Date.now();
  syncContent();
  setInterval(function(){
    if(!S.quiz && !S.adminOpen && !S.mock && !S.player) render();
  },60000);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden") abortQuizOnSwitch();
    else maybeSync();
  });
  window.addEventListener("online", maybeSync);
  document.getElementById("brandtap").onclick=function(){ A.openAdmin(); };
}
function showGate(){
  document.getElementById("app").hidden=true;
  document.getElementById("gate").hidden=false;
  var input=document.getElementById("codein");
  var err=document.getElementById("codeerr");
  var btn=document.getElementById("codebtn");

  input.addEventListener("input",function(){
    err.textContent="";
    var raw=normCode(input.value).slice(0,16);
    if(raw.indexOf("NST18")!==0 && raw.length>0 && "NST18".indexOf(raw)!==0) raw="NST18"+raw;
    var out=raw.slice(0,5);
    if(raw.length>5) out+="-"+raw.slice(5,10);
    if(raw.length>10) out+="-"+raw.slice(10,16);
    input.value=out;
  });
  var SAYS={
    offline:"ตอนเปิดใช้งานครั้งแรกต้องต่อเน็ตก่อนนะครับ\n(หลังจากนี้ใช้ได้ตลอด ไม่ต้องมีเน็ตอีก)",
    notfound:"ไม่พบรหัสนี้ในระบบ ตรวจตัวอักษรอีกครั้ง",
    used:"รหัสนี้ถูกเปิดใช้กับเครื่องอื่นไปแล้ว\n1 รหัสใช้ได้ 1 เครื่อง — ถ้าเปลี่ยนมือถือ ติดต่อผู้ขาย",
    revoked:"รหัสนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ขาย",
    busy:"ระบบกำลังยุ่ง รอสักครู่แล้วลองใหม่",
    badrequest:"เปิดใช้งานไม่สำเร็จ ลองใหม่อีกครั้ง",
    servererror:"ระบบขัดข้องชั่วคราว ลองใหม่อีกครั้ง"
  };
  function finish(v){
    try{ saveLic(v); }
    catch(e){ err.textContent="เครื่องนี้บันทึกข้อมูลไม่ได้ (ลองปิดโหมดไม่ระบุตัวตน)"; return; }
    startApp();
  }
  /* ปุ่มเปิดใช้งานคือรูปโลโก้ — ห้ามแตะ textContent ของปุ่ม (รูปจะหาย)
     บอกสถานะที่บรรทัด "แตะโลโก้เพื่อเปิดใช้งาน" ใต้โลโก้แทน */
  var hint=document.getElementById("taphint");
  var HINT=hint.textContent;
  var busy=false;
  function setBusy(on){
    busy=on;
    btn.disabled=on;
    btn.style.opacity=on?"0.45":"";
    hint.textContent=on?"กำลังตรวจสอบรหัส…":HINT;
  }
  function submit(){
    if(busy) return;
    var v=input.value;
    if(!normCode(v)){ err.textContent="กรอกรหัสก่อนนะครับ"; return; }
    if(!validCode(v)){
      err.textContent="รหัสไม่ถูกต้อง ตรวจตัวอักษรอีกครั้ง";
      input.select(); return;
    }
    if(!ACTIVATE_URL){ finish(v); return; }   // ยังไม่ได้เปิดระบบคุมเครื่อง

    setBusy(true); err.textContent="";
    askServer("activate", v, function(j){
      setBusy(false);
      if(j && j.ok){ finish(v); return; }
      err.textContent = SAYS[j && j.reason] || SAYS.servererror;
      input.select();
    });
  }
  btn.onclick=submit;
  input.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
}

if(isActivated()){ startApp(); revalidate(); } else showGate();

/* ── service worker: ทำให้ใช้ออฟไลน์ได้ + แจ้งเตือนเมื่อมีเวอร์ชันใหม่ ── */
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange",function(){
          if(nw.state==="installed" && navigator.serviceWorker.controller){
            var t=document.createElement("div");
            t.className="toast";
            t.style.cursor="pointer";
            t.textContent="มีเวอร์ชันใหม่ — แตะเพื่ออัปเดต";
            t.onclick=function(){ nw.postMessage("skip-waiting"); location.reload(); };
            document.body.appendChild(t);
          }
        });
      });
    }).catch(function(){});
  });
}
</script>
<script>
/* ───── โหมดถนอมสายตา (ทำงานแยกจากตัวแอป ไม่ยุ่งกับ state/render เดิม) ───── */
(function () {
  var K_NIGHT = 'np18_night', K_DIM = 'np18_dim', DIM_MAX = 0.55
  var root = document.documentElement
  var btn = document.getElementById('ecBtn')
  var panel = document.getElementById('ecPanel')
  var sw = document.getElementById('ecNight')
  var dim = document.getElementById('ecDim')
  var dimVal = document.getElementById('ecDimVal')
  if (!btn || !panel || !sw || !dim) return

  function get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }
  function set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k) } catch (e) {} }

  var isNight = get(K_NIGHT) === '1'
  var dimVer = Math.min(DIM_MAX, Math.max(0, parseFloat(get(K_DIM)) || 0))

  function applyNight() {
    if (isNight) root.setAttribute('data-theme', 'night')
    else root.removeAttribute('data-theme')
    sw.setAttribute('aria-checked', isNight ? 'true' : 'false')
    btn.textContent = isNight ? '☀' : '☾'
  }
  function applyDim() {
    root.style.setProperty('--ec-dim', String(dimVer))
    dim.value = String(dimVer)
    dimVal.textContent = Math.round((dimVer / DIM_MAX) * 100) + '%'
  }
  applyNight()
  applyDim()

  function openPanel(open) {
    panel.hidden = !open
    btn.setAttribute('aria-expanded', open ? 'true' : 'false')
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation()
    openPanel(panel.hidden)
  })
  sw.addEventListener('click', function () {
    isNight = !isNight
    if (isNight) set(K_NIGHT, '1'); else del(K_NIGHT)
    applyNight()
  })
  dim.addEventListener('input', function () {
    dimVer = Math.min(DIM_MAX, Math.max(0, parseFloat(dim.value) || 0))
    set(K_DIM, String(dimVer))
    applyDim()
  })
  // ปิดแผงเมื่อคลิกที่อื่น หรือกด Esc
  document.addEventListener('click', function (e) {
    if (!panel.hidden && !panel.contains(e.target) && e.target !== btn) openPanel(false)
  })
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) openPanel(false)
  })
})()
</script>
